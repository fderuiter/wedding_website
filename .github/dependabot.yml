version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        versions: [">= 23.0.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "debian"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "postgres"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docker/prisma-cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "@types/node"
        versions: [">= 23.0.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        versions: [">= 6.1.0"]
        update-types: ["version-update:semver-major"]
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
          - "effect"
          - "@electric-sql/pglite*"
        update-types:
          - "minor"
          - "patch"
      prisma-security:
        applies-to: "security-updates"
        patterns:
          - "prisma"
          - "@prisma/*"
          - "effect"
          - "@electric-sql/pglite*"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      pg:
        patterns:
          - "pg"
          - "@types/pg"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

