name: Rollback Pipeline

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: 'Immutable container image tag or commit SHA to restore (optional when previous_digest is provided)'
        required: false
        default: ''
        type: string
      previous_digest:
        description: 'Optional immutable container image digest (sha256:<64-hex>) to restore'
        required: false
        default: ''
        type: string
      target_environment:
        description: 'Target deployment environment'
        required: false
        default: 'production'
        type: string
      rollback_environment:
        description: 'Optional unguarded GitHub Environment holding rollback secrets (defaults to target_environment)'
        required: false
        default: ''
        type: string
      provider:
        description: 'Hosting Provider Adapter (google-cloud-run, docker-host, generic-webhook)'
        required: false
        default: 'google-cloud-run'
        type: string
      reason:
        description: 'Reason for triggering automated or manual rollback'
        required: false
        default: 'Automated post-deployment health check failure'
        type: string
      dry_run:
        description: 'Run rollback in explicit dry-run validation mode'
        required: false
        default: false
        type: boolean
      commit_sha:
        description: 'Optional 40-character failing commit SHA to check out for migration linting and block self-rollback against (defaults to github.sha)'
        required: false
        default: ''
        type: string
      cloud_run_service:
        description: 'Optional Cloud Run service name override (defaults to vars.CLOUD_RUN_SERVICE or environment-isolated service name)'
        required: false
        default: ''
        type: string
      cloud_run_region:
        description: 'Optional Cloud Run region override (defaults to vars.CLOUD_RUN_REGION or us-central1)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      commit_sha:
        description: 'Optional 40-character failing commit SHA to check out for migration linting and block self-rollback against (defaults to github.sha)'
        required: false
        default: ''
        type: string
      previous_tag:
        description: 'Immutable container image tag or commit SHA to restore'
        required: false
        default: ''
        type: string
      previous_digest:
        description: 'Optional immutable container image digest (sha256:<64-hex>) to restore'
        required: false
        default: ''
        type: string
      target_environment:
        description: 'Target deployment environment'
        required: false
        default: 'production'
        type: string
      rollback_environment:
        description: 'Optional unguarded GitHub Environment holding rollback secrets (defaults to target_environment)'
        required: false
        default: ''
        type: string
      provider:
        description: 'Hosting Provider Adapter (google-cloud-run, docker-host, generic-webhook)'
        required: false
        default: 'google-cloud-run'
        type: string
      reason:
        description: 'Reason for triggering automated or manual rollback'
        required: false
        default: 'Automated post-deployment health check failure'
        type: string
      dry_run:
        description: 'Run rollback in explicit dry-run validation mode'
        required: false
        default: false
        type: boolean
      cloud_run_service:
        description: 'Optional Cloud Run service name override (defaults to vars.CLOUD_RUN_SERVICE or environment-isolated service name)'
        required: false
        default: ''
        type: string
      cloud_run_region:
        description: 'Optional Cloud Run region override (defaults to vars.CLOUD_RUN_REGION or us-central1)'
        required: false
        default: ''
        type: string
      caller_holds_lock:
        description: 'Whether the calling workflow already holds the deploy-env-<environment> concurrency lock'
        required: false
        default: false
        type: boolean
    secrets:
      GCP_SA_KEY:
        required: false
      GCP_PROJECT_ID:
        required: false
      DEPLOY_WEBHOOK_URL:
        required: false
      DEPLOY_WEBHOOK_SECRET:
        required: false
      SERVICE_URL:
        required: false

concurrency:
  group: ${{ inputs.caller_holds_lock && format('caller-rollback-{0}-{1}-{2}', inputs.target_environment || 'production', github.run_id, github.run_attempt) || format('deploy-env-{0}', inputs.target_environment || 'production') }}
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    name: Validate Inputs & Database Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      packages: read
      attestations: read
    # Note: Automated rollback uses an unguarded rollback_environment (or target_environment)
    # on provider/probe jobs so post-deployment failure recovery can restore the previous
    # validated container image immediately without a second manual approval gate.
    outputs:
      effective_tag: ${{ steps.validate.outputs.effective_tag }}
      effective_digest: ${{ steps.verify_deployment.outputs.verified_digest || steps.validate.outputs.effective_digest }}
      validation_status: ${{ steps.validate.outputs.validation_status }}
      db_compatibility_status: ${{ steps.db_safety_check.outputs.db_compatibility_status }}
      failed_stage: ${{ steps.record_failure.outputs.failed_stage }}
    steps:
      - name: Log Rollback Request Details
        id: validate
        env:
          TARGET_ENV: ${{ inputs.target_environment || 'production' }}
          ROLLBACK_ENV: ${{ inputs.rollback_environment }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          PREVIOUS_DIGEST: ${{ inputs.previous_digest }}
          PROVIDER: ${{ inputs.provider || 'google-cloud-run' }}
          REASON: ${{ inputs.reason || 'Post-deployment verification failure' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          CURRENT_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          if [ -n "${INPUT_COMMIT_SHA:-}" ]; then
            if [[ ! "$INPUT_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
              echo "::error::Invalid commit_sha '${INPUT_COMMIT_SHA}'. Must be a 40-character hexadecimal commit SHA."
              exit 1
            fi
            CURRENT_SHA="$INPUT_COMMIT_SHA"
          else
            CURRENT_SHA="${CURRENT_SHA:-${GITHUB_SHA:-}}"
          fi

          if [[ ! "$TARGET_ENV" =~ ^(production|staging|development)$ ]]; then
            echo "::error::Invalid target environment '${TARGET_ENV}'. Must be one of: production, staging, development."
            exit 1
          fi

          if [ -n "$ROLLBACK_ENV" ] && [[ ! "$ROLLBACK_ENV" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Invalid rollback environment '${ROLLBACK_ENV}'. Must only contain alphanumeric characters, underscores, periods, and hyphens."
            exit 1
          fi

          if [[ ! "$PROVIDER" =~ ^(google-cloud-run|docker-host|generic-webhook)$ ]]; then
            echo "::error::Invalid provider '${PROVIDER}'. Must be one of: google-cloud-run, docker-host, generic-webhook."
            exit 1
          fi

          EFFECTIVE_DIGEST="${PREVIOUS_DIGEST:-}"
          if [ -n "$EFFECTIVE_DIGEST" ] && [[ ! "$EFFECTIVE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid rollback image digest '${EFFECTIVE_DIGEST}'. Must match ^sha256:[a-f0-9]{64}$."
            exit 1
          fi

          EFFECTIVE_TAG="${PREVIOUS_TAG:-}"
          if [ "$DRY_RUN" = "true" ]; then
            if [ -z "$EFFECTIVE_TAG" ] && [ -z "$EFFECTIVE_DIGEST" ]; then
              EFFECTIVE_TAG="latest"
            fi
            if [ "$EFFECTIVE_TAG" = "latest" ] || { [ -n "$EFFECTIVE_TAG" ] && [ -n "${CURRENT_SHA:-}" ] && [ "${EFFECTIVE_TAG,,}" = "${CURRENT_SHA,,}" ]; }; then
              echo "::warning::Explicit dry-run mode enabled: permitting rollback tag '${EFFECTIVE_TAG}' for dry-run validation only."
            fi
          else
            if [ -z "$EFFECTIVE_TAG" ] && [ -z "$EFFECTIVE_DIGEST" ]; then
              echo "::error::Missing rollback image tag or digest. Specify an immutable previous image tag, commit SHA, or sha256 digest."
              exit 1
            fi
            if [ "$EFFECTIVE_TAG" = "latest" ]; then
              echo "::error::Mutable image tag 'latest' is rejected outside explicit dry-run mode. Specify an immutable previous release tag or commit SHA."
              exit 1
            fi
            if [ -n "$EFFECTIVE_TAG" ] && [ -n "${CURRENT_SHA:-}" ] && [ "${EFFECTIVE_TAG,,}" = "${CURRENT_SHA,,}" ]; then
              echo "::error::Rollback image tag '${EFFECTIVE_TAG}' matches the failing commit SHA '${CURRENT_SHA}'. Specify the previous healthy release tag."
              exit 1
            fi
          fi

          if [ -n "$EFFECTIVE_TAG" ] && [[ ! "$EFFECTIVE_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Invalid image tag '${EFFECTIVE_TAG}'. Must only contain alphanumeric characters, underscores, periods, and hyphens."
            exit 1
          fi

          INVALID_REASON_CHARS="[;\`\$\&\|<>\\]"
          if [[ "$REASON" =~ $INVALID_REASON_CHARS ]]; then
            echo "::error::Invalid characters detected in rollback reason. Semicolons, backticks, and shell metacharacters are forbidden."
            exit 1
          fi

          SAFE_REASON=$(printf '%s' "$REASON" | tr -d '\r\n`$<>\\' | sed -e 's/[;&|]//g')
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo "validation_status=passed" >> "$GITHUB_OUTPUT"
          echo "effective_tag=${EFFECTIVE_TAG}" >> "$GITHUB_OUTPUT"
          echo "effective_digest=${EFFECTIVE_DIGEST}" >> "$GITHUB_OUTPUT"

          echo "=================================================="
          echo "           AUTOMATED ROLLBACK INITIATED           "
          echo "=================================================="
          echo "Target Environment: ${TARGET_ENV}"
          echo "Rollback Environment: ${ROLLBACK_ENV:-${TARGET_ENV}}"
          echo "Provider Adapter: ${PROVIDER}"
          echo "Rollback Image Tag: ${EFFECTIVE_TAG:-none}"
          echo "Rollback Image Digest: ${EFFECTIVE_DIGEST:-none}"
          echo "Explicit Dry Run: ${DRY_RUN}"
          echo "Rollback Trigger Reason: ${SAFE_REASON}"
          echo "Timestamp: ${NOW}"
          echo "=================================================="

      - name: Verify Rollback Digest Deployment History
        id: verify_deployment
        if: "!inputs.dry_run && (steps.validate.outputs.effective_digest != '' || github.event_name == 'workflow_dispatch')"
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR_LOGIN: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_ENV: ${{ inputs.target_environment || 'production' }}
          EFFECTIVE_DIGEST: ${{ steps.validate.outputs.effective_digest }}
          EFFECTIVE_TAG: ${{ steps.validate.outputs.effective_tag }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          CURRENT_SHA: ${{ inputs.commit_sha || github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-artifact.yml
        run: |
          TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$TOKEN" ] || [ -z "${GITHUB_REPOSITORY:-}" ]; then
            echo "::error::Missing GITHUB_TOKEN or GITHUB_REPOSITORY required to verify prior '${TARGET_ENV}' GitHub Deployments for rollback."
            exit 1
          fi

          RESOLVED_CURRENT_SHA="${INPUT_COMMIT_SHA:-${CURRENT_SHA:-${GITHUB_SHA:-}}}"
          NORMALIZED_CURRENT_SHA=$(printf '%s' "$RESOLVED_CURRENT_SHA" | tr '[:upper:]' '[:lower:]')
          NORMALIZED_DIGEST=$(printf '%s' "${EFFECTIVE_DIGEST:-}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          RESOLVED_OWNER="${REPO_OWNER:-${GITHUB_REPOSITORY%%/*}}"
          RESOLVED_SIGNER="${SIGNER_WORKFLOW:-${GITHUB_REPOSITORY}/.github/workflows/publish-artifact.yml}"

          GHCR_LOGGED_IN="false"
          ensure_ghcr_login() {
            if [ "$GHCR_LOGGED_IN" = "true" ]; then
              return 0
            fi
            if [ -n "$TOKEN" ] && [ -n "${GITHUB_ACTOR_LOGIN:-}" ] && command -v docker >/dev/null 2>&1; then
              printf '%s\n' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR_LOGIN" --password-stdin >/dev/null 2>&1 || true
            fi
            GHCR_LOGGED_IN="true"
          }

          if [ -n "$NORMALIZED_DIGEST" ]; then
            IMAGE_URI="ghcr.io/${REPO_LOWER}@${NORMALIZED_DIGEST}"

            if command -v gh >/dev/null 2>&1 && [ -n "$RESOLVED_OWNER" ] && [ -n "$RESOLVED_SIGNER" ]; then
              ATTESTATION_JSON=$(GH_TOKEN="$TOKEN" gh attestation verify "oci://${IMAGE_URI}" \
                --owner "$RESOLVED_OWNER" \
                --signer-workflow "$RESOLVED_SIGNER" \
                --format json 2>/dev/null || true)
              if [ -n "$ATTESTATION_JSON" ]; then
                ATTESTED_SHA=$(printf '%s' "$ATTESTATION_JSON" | jq -r '
                  [
                    (if type == "array" then .[] else . end)
                    | (
                        ((.verificationResult.statement.predicate // .statement.predicate // .predicate // empty) | (
                          .buildDefinition.externalParameters.inputs.commit_sha,
                          (.buildDefinition.resolvedDependencies[]? | (.digest.gitCommit, .digest.sha1)),
                          .buildDefinition.internalParameters.github.sha,
                          .invocation.configSource.digest.sha1,
                          (.materials[]? | (.digest.gitCommit, .digest.sha1))
                        )),
                        .verificationResult.signature.certificate.sourceRepositoryDigest,
                        .verificationResult.statement.subject[]?.annotations["org.opencontainers.image.revision"],
                        .statement.subject[]?.annotations["org.opencontainers.image.revision"]
                      )
                    | select(type == "string" and test("^[a-fA-F0-9]{40}$"))
                  ][0] // empty
                ' 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
                if [ -n "$ATTESTED_SHA" ] && [ -n "$NORMALIZED_CURRENT_SHA" ] && [ "$ATTESTED_SHA" = "$NORMALIZED_CURRENT_SHA" ]; then
                  echo "::error::Rollback image digest '${EFFECTIVE_DIGEST}' was built from the failing commit SHA '${RESOLVED_CURRENT_SHA}'. Specify a prior healthy deployment digest."
                  exit 1
                fi
              fi
            fi

            if command -v docker >/dev/null 2>&1; then
              ensure_ghcr_login
              RAW_MANIFEST=$(docker buildx imagetools inspect --raw "$IMAGE_URI" 2>/dev/null || true)
              if [[ "${RAW_MANIFEST#"${RAW_MANIFEST%%[![:space:]]*}"}" == \{* ]]; then
                MANIFEST_REV=$(printf '%s' "$RAW_MANIFEST" | jq -r '
                  .annotations["org.opencontainers.image.revision"]
                  // .config.Labels["org.opencontainers.image.revision"]
                  // ([.manifests[]?.annotations["org.opencontainers.image.revision"] | select(type == "string" and test("^[a-fA-F0-9]{40}$"))][0])
                  // empty
                ' 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
                if [ -n "$MANIFEST_REV" ] && [ -n "$NORMALIZED_CURRENT_SHA" ] && [ "$MANIFEST_REV" = "$NORMALIZED_CURRENT_SHA" ]; then
                  echo "::error::Rollback image digest '${EFFECTIVE_DIGEST}' matches OCI revision '${RESOLVED_CURRENT_SHA}' (CURRENT_SHA). Specify a prior healthy deployment digest."
                  exit 1
                fi
              fi

              if [[ "$NORMALIZED_CURRENT_SHA" =~ ^[a-f0-9]{40}$ ]]; then
                CURRENT_SHA_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "ghcr.io/${REPO_LOWER}:${NORMALIZED_CURRENT_SHA}" 2>/dev/null | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' || true)
                if [ -n "$CURRENT_SHA_DIGEST" ] && [ "$CURRENT_SHA_DIGEST" = "$NORMALIZED_DIGEST" ]; then
                  echo "::error::Rollback image digest '${EFFECTIVE_DIGEST}' matches the image digest of failing commit SHA '${RESOLVED_CURRENT_SHA}'. Specify a prior healthy deployment digest."
                  exit 1
                fi
              fi
            fi
          fi

          API_BASE="${GITHUB_API_URL:-https://api.github.com}"
          if ! DEPLOYMENTS_JSON=$(curl -fsSL --connect-timeout 5 --max-time 10 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            "${API_BASE}/repos/${GITHUB_REPOSITORY}/deployments?environment=${TARGET_ENV}&per_page=50"); then
            echo "::error::Failed to query GitHub Deployments for environment '${TARGET_ENV}' in '${GITHUB_REPOSITORY}'."
            exit 1
          fi

          if [[ "${DEPLOYMENTS_JSON#"${DEPLOYMENTS_JSON%%[![:space:]]*}"}" != \[* ]]; then
            echo "::error::Unexpected GitHub Deployments response while verifying rollback history for '${TARGET_ENV}'."
            exit 1
          fi

          VERIFIED_DEPLOYMENT_ID=""
          VERIFIED_DIGEST="$NORMALIZED_DIGEST"

          while IFS='|' read -r DEP_ID DEP_SHA DEP_COMMIT_SHA DEP_TAG DEP_DIGEST DEP_DRY_RUN; do
            [ -z "$DEP_ID" ] && continue
            if [ "$DEP_DRY_RUN" = "true" ]; then
              continue
            fi

            NORM_DEP_SHA=$(printf '%s' "${DEP_SHA:-}" | tr '[:upper:]' '[:lower:]')
            NORM_DEP_COMMIT=$(printf '%s' "${DEP_COMMIT_SHA:-}" | tr '[:upper:]' '[:lower:]')
            NORM_DEP_DIGEST=$(printf '%s' "${DEP_DIGEST:-}" | tr '[:upper:]' '[:lower:]')

            MATCHES_TARGET="false"
            if [ -n "$NORMALIZED_DIGEST" ]; then
              if [ -n "$NORM_DEP_DIGEST" ] && [ "$NORM_DEP_DIGEST" = "$NORMALIZED_DIGEST" ]; then
                MATCHES_TARGET="true"
              elif [ -z "$NORM_DEP_DIGEST" ] && command -v docker >/dev/null 2>&1; then
                CANDIDATE_LOOKUP_TAG="${DEP_TAG:-${DEP_SHA:-}}"
                if [ -n "$CANDIDATE_LOOKUP_TAG" ] && [ "$CANDIDATE_LOOKUP_TAG" != "latest" ]; then
                  ensure_ghcr_login
                  RESOLVED_DEP_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "ghcr.io/${REPO_LOWER}:${CANDIDATE_LOOKUP_TAG}" 2>/dev/null | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]' || true)
                  if [ -n "$RESOLVED_DEP_DIGEST" ] && [ "$RESOLVED_DEP_DIGEST" = "$NORMALIZED_DIGEST" ]; then
                    MATCHES_TARGET="true"
                  fi
                fi
              fi
            elif [ -n "${EFFECTIVE_TAG:-}" ]; then
              if [ "${DEP_TAG:-}" = "$EFFECTIVE_TAG" ] || [ "$NORM_DEP_SHA" = "${EFFECTIVE_TAG,,}" ] || [ "$NORM_DEP_COMMIT" = "${EFFECTIVE_TAG,,}" ]; then
                MATCHES_TARGET="true"
              fi
            fi

            if [ "$MATCHES_TARGET" != "true" ]; then
              continue
            fi

            if [ -n "$NORMALIZED_CURRENT_SHA" ]; then
              if { [ -n "$NORM_DEP_SHA" ] && [ "$NORM_DEP_SHA" = "$NORMALIZED_CURRENT_SHA" ]; } || \
                 { [ -n "$NORM_DEP_COMMIT" ] && [ "$NORM_DEP_COMMIT" = "$NORMALIZED_CURRENT_SHA" ]; }; then
                echo "::error::Rollback target '${EFFECTIVE_DIGEST:-$EFFECTIVE_TAG}' matches failing commit SHA '${RESOLVED_CURRENT_SHA}' in '${TARGET_ENV}' GitHub Deployments."
                exit 1
              fi
            fi

            STATUSES_JSON=$(curl -fsSL --connect-timeout 5 --max-time 10 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${TOKEN}" \
              "${API_BASE}/repos/${GITHUB_REPOSITORY}/deployments/${DEP_ID}/statuses?per_page=20" 2>/dev/null || true)
            ACTIVE_STATE=""
            if [[ "${STATUSES_JSON#"${STATUSES_JSON%%[![:space:]]*}"}" == \[* ]]; then
              ACTIVE_STATE=$(printf '%s' "$STATUSES_JSON" | jq -r '[.[]? | select(.state != null and .state != "inactive") | .state] | .[0] // empty' 2>/dev/null || true)
            fi
            if [ "$ACTIVE_STATE" != "success" ]; then
              continue
            fi

            VERIFIED_DEPLOYMENT_ID="$DEP_ID"
            if [ -z "$VERIFIED_DIGEST" ] && [[ "$NORM_DEP_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              VERIFIED_DIGEST="$NORM_DEP_DIGEST"
            fi
            break
          done < <(printf '%s' "$DEPLOYMENTS_JSON" | jq -r --arg env "$TARGET_ENV" '
            .[]?
            | select((.environment // $env) == $env and .id != null)
            | [
                (.id | tostring),
                (.sha // ""),
                ((.payload | if type == "object" then (.commit_sha // "") else "" end) | tostring),
                ((.payload | if type == "object" then (.image_tag // "") else "" end) | tostring),
                ((.payload | if type == "object" then (.image_digest // "") else "" end) | tostring),
                ((.payload | if type == "object" then (.dry_run // false) else false end) | tostring)
              ]
            | join("|")
          ' 2>/dev/null || true)

          if [ -z "$VERIFIED_DEPLOYMENT_ID" ]; then
            echo "::error::Rollback blocked: '${EFFECTIVE_DIGEST:-$EFFECTIVE_TAG}' has no prior successful GitHub Deployment in environment '${TARGET_ENV}'."
            exit 1
          fi

          echo "verified_deployment_id=${VERIFIED_DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "verified_digest=${VERIFIED_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "✅ Verified prior successful '${TARGET_ENV}' GitHub Deployment #${VERIFIED_DEPLOYMENT_ID} for rollback target '${EFFECTIVE_DIGEST:-$EFFECTIVE_TAG}'."

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Pre-Rollback Database Compatibility Safety Gate
        id: db_safety_check
        env:
          TARGET_ENV: ${{ inputs.target_environment || 'production' }}
          PREVIOUS_TAG: ${{ steps.validate.outputs.effective_tag }}
          REASON: ${{ inputs.reason || 'Post-deployment verification failure' }}
        run: |
          echo "=================================================="
          echo "    PRE-ROLLBACK DATABASE COMPATIBILITY CHECK    "
          echo "=================================================="
          echo "Verifying database migrations backwards compatibility for N-1 container restoration..."
          npm run lint:migrations
          echo "db_compatibility_status=verified" >> "$GITHUB_OUTPUT"
          echo "✅ N-1 database schema compatibility validated. Safe to redeploy previous image tag."

      - name: Record Preflight Failure Stage
        id: record_failure
        if: failure()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          VERIFY_DEPLOYMENT_OUTCOME: ${{ steps.verify_deployment.outcome }}
          DB_CHECK_OUTCOME: ${{ steps.db_safety_check.outcome }}
        run: |
          if [ "$VALIDATE_OUTCOME" != "success" ]; then
            echo "failed_stage=Input Validation" >> "$GITHUB_OUTPUT"
          elif [ "$VERIFY_DEPLOYMENT_OUTCOME" = "failure" ]; then
            echo "failed_stage=Rollback Digest Deployment Verification" >> "$GITHUB_OUTPUT"
          elif [ "$DB_CHECK_OUTCOME" != "success" ]; then
            echo "failed_stage=Pre-Rollback Database Compatibility Gate (lint:migrations)" >> "$GITHUB_OUTPUT"
          else
            echo "failed_stage=Preflight Dependency Setup" >> "$GITHUB_OUTPUT"
          fi

  redeploy:
    name: Redeploy Previous Validated Container Image
    permissions:
      actions: read
      contents: read
      packages: read
      attestations: read
      deployments: write
      id-token: write
    needs: [preflight]
    uses: ./.github/workflows/deploy-provider.yml
    with:
      environment: ${{ inputs.target_environment || 'production' }}
      rollback_environment: ${{ inputs.rollback_environment || '' }}
      image_digest: ${{ needs.preflight.outputs.effective_digest || '' }}
      image_tag: ${{ needs.preflight.outputs.effective_tag }}
      provider: ${{ inputs.provider || 'google-cloud-run' }}
      cloud_run_service: ${{ inputs.cloud_run_service || '' }}
      cloud_run_region: ${{ inputs.cloud_run_region || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      caller_holds_lock: true
    secrets: inherit

  verify:
    name: Verify Restored Container Health
    needs: [preflight, redeploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      health_status: ${{ steps.health_probe.outputs.health_status }}
      service_url: ${{ steps.health_probe.outputs.service_url }}
      http_status: ${{ steps.health_probe.outputs.http_status }}
    steps:
      - name: Poll Restored Service Health
        id: health_probe
        timeout-minutes: 2
        env:
          VAR_SERVICE_URL: ${{ vars.SERVICE_URL }}
          ENV_SERVICE_URL: ${{ secrets.SERVICE_URL }}
          PROVIDER_SERVICE_URL: ${{ needs.redeploy.outputs.service_url }}
          PROVIDER_HEALTH_STATUS: ${{ needs.redeploy.outputs.health_status }}
          PROVIDER_HTTP_STATUS: ${{ needs.redeploy.outputs.http_status }}
          IS_DRY_RUN: ${{ (inputs.dry_run && needs.redeploy.outputs.is_dry_run == 'true') && 'true' || 'false' }}
          TARGET_ENV: ${{ inputs.target_environment || 'production' }}
          RESTORED_TAG: ${{ needs.preflight.outputs.effective_tag || needs.preflight.outputs.effective_digest }}
        run: |
          CONFIGURED_SERVICE_URL=""
          USED_SECRET_FALLBACK="false"
          if [ -n "${VAR_SERVICE_URL:-}" ]; then
            CONFIGURED_SERVICE_URL="$VAR_SERVICE_URL"
          elif [ -n "${ENV_SERVICE_URL:-}" ]; then
            CONFIGURED_SERVICE_URL="$ENV_SERVICE_URL"
            USED_SECRET_FALLBACK="true"
          fi

          RESOLVED_URL="$CONFIGURED_SERVICE_URL"
          if [ -z "$RESOLVED_URL" ] && [ -n "${PROVIDER_SERVICE_URL:-}" ] && [ "$PROVIDER_SERVICE_URL" != "***" ]; then
            RESOLVED_URL="$PROVIDER_SERVICE_URL"
          fi

          if [ "${IS_DRY_RUN:-false}" = "true" ]; then
            TARGET_URL="${RESOLVED_URL:-http://127.0.0.1:3000}"
          else
            TARGET_URL="$RESOLVED_URL"
          fi
          TARGET_URL="${TARGET_URL%/}"

          OUTPUT_SERVICE_URL="$TARGET_URL"
          if [ "$USED_SECRET_FALLBACK" = "true" ]; then
            OUTPUT_SERVICE_URL=""
          fi

          if [ "${PROVIDER_HEALTH_STATUS:-}" = "healthy" ]; then
            EFFECTIVE_HTTP="${PROVIDER_HTTP_STATUS:-200}"
            echo "✅ Consumed verified provider /api/health outcome from deploy-provider.yml (HTTP ${EFFECTIVE_HTTP}) for '${TARGET_ENV}'."
            echo "service_url=${OUTPUT_SERVICE_URL}" >> "$GITHUB_OUTPUT"
            echo "http_status=${EFFECTIVE_HTTP}" >> "$GITHUB_OUTPUT"
            echo "health_status=healthy" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "${PROVIDER_HEALTH_STATUS:-}" = "unhealthy" ]; then
            EFFECTIVE_HTTP="${PROVIDER_HTTP_STATUS:-unreachable}"
            echo "::error::Provider health verification reported unhealthy for '${TARGET_ENV}' (HTTP ${EFFECTIVE_HTTP})."
            echo "service_url=${OUTPUT_SERVICE_URL}" >> "$GITHUB_OUTPUT"
            echo "http_status=${EFFECTIVE_HTTP}" >> "$GITHUB_OUTPUT"
            echo "health_status=unhealthy" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ -z "$TARGET_URL" ] || [[ ! "$TARGET_URL" =~ ^https?://[^[:space:]]+ ]]; then
            echo "::error::Invalid or missing SERVICE_URL '${OUTPUT_SERVICE_URL}'. Must start with http:// or https://."
            echo "health_status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "service_url=${OUTPUT_SERVICE_URL}" >> "$GITHUB_OUTPUT"
            echo "http_status=invalid-url" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          HEALTH_ENDPOINT="${TARGET_URL}/api/health"
          READY_ENDPOINT="${TARGET_URL}/api/ready"

          echo "=================================================="
          echo "   POST-ROLLBACK HEALTH & READINESS PROBES        "
          echo "=================================================="
          echo "Target Environment : ${TARGET_ENV}"
          echo "Restored Image Tag : ${RESTORED_TAG}"
          echo "Target Service URL : ${TARGET_URL}"
          echo "Health Probe Path  : ${HEALTH_ENDPOINT}"
          echo "Readiness Probe    : ${READY_ENDPOINT}"
          echo "Dry Run Environment: ${IS_DRY_RUN}"
          echo "=================================================="

          MAX_TIMEOUT=55
          START_TIME=$(date +%s)
          DELAY=2
          SUCCESS=false
          HTTP_STATUS=""
          RESPONSE_BODY=""

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            if [ $ELAPSED -ge $MAX_TIMEOUT ]; then
              echo "❌ Post-rollback health and readiness check timed out after ${MAX_TIMEOUT} seconds."
              break
            fi

            echo "Polling ${HEALTH_ENDPOINT} (elapsed: ${ELAPSED}s)..."

            HTTP_RESPONSE=$(curl -s -S --connect-timeout 5 --max-time 10 -w "\nHTTP_STATUS_CODE:%{http_code}" "${HEALTH_ENDPOINT}" || true)
            HTTP_STATUS=$(printf '%s\n' "$HTTP_RESPONSE" | grep "HTTP_STATUS_CODE:" | tail -n 1 | cut -d':' -f2)
            RESPONSE_BODY=$(printf '%s\n' "$HTTP_RESPONSE" | sed '/HTTP_STATUS_CODE:/d')

            if [ "$HTTP_STATUS" = "200" ]; then
              PAYLOAD_KIND=$(printf '%s' "$RESPONSE_BODY" | jq -r 'if type != "object" then "invalid" elif has("success") then (if .success == true and (.data | type) == "object" then "wrapped" else "rejected" end) else "unwrapped" end' 2>/dev/null || true)
              STATUS_VAL=""
              DB_STATUS=""
              if [ "$PAYLOAD_KIND" = "wrapped" ]; then
                STATUS_VAL=$(printf '%s' "$RESPONSE_BODY" | jq -r '.data.status // empty' 2>/dev/null || true)
                DB_STATUS=$(printf '%s' "$RESPONSE_BODY" | jq -r '.data.database // empty' 2>/dev/null || true)
              elif [ "$PAYLOAD_KIND" = "unwrapped" ]; then
                STATUS_VAL=$(printf '%s' "$RESPONSE_BODY" | jq -r '(.status) // empty' 2>/dev/null || true)
                DB_STATUS=$(printf '%s' "$RESPONSE_BODY" | jq -r '(.database) // empty' 2>/dev/null || true)
              fi

              if [ "$STATUS_VAL" = "ok" ] && [ "$DB_STATUS" = "connected" ]; then
                echo "Polling ${READY_ENDPOINT} (elapsed: ${ELAPSED}s)..."
                READY_HTTP_RESPONSE=$(curl -s -S --connect-timeout 5 --max-time 10 -w "\nHTTP_STATUS_CODE:%{http_code}" "${READY_ENDPOINT}" || true)
                READY_HTTP_STATUS=$(printf '%s\n' "$READY_HTTP_RESPONSE" | grep "HTTP_STATUS_CODE:" | tail -n 1 | cut -d':' -f2 || true)
                READY_RESPONSE_BODY=$(printf '%s\n' "$READY_HTTP_RESPONSE" | sed '/HTTP_STATUS_CODE:/d')
                READY_IS_OBJECT=$(printf '%s' "$READY_RESPONSE_BODY" | jq -r 'if type == "object" then "true" else "false" end' 2>/dev/null || true)
                READY_STATUS_VAL=""
                READY_DB_STATUS=""
                if [ "$READY_IS_OBJECT" = "true" ]; then
                  READY_STATUS_VAL=$(printf '%s' "$READY_RESPONSE_BODY" | jq -r '(.status) // empty' 2>/dev/null || true)
                  READY_DB_STATUS=$(printf '%s' "$READY_RESPONSE_BODY" | jq -r '(.database) // empty' 2>/dev/null || true)
                fi

                if [ "$READY_HTTP_STATUS" = "200" ] && [ "$READY_STATUS_VAL" = "ready" ] && [ "$READY_DB_STATUS" = "connected" ]; then
                  echo "✅ Post-rollback health and readiness probes succeeded! /api/health (${STATUS_VAL}/${DB_STATUS}), /api/ready (${READY_STATUS_VAL}/${READY_DB_STATUS})"
                  SUCCESS=true
                  break
                else
                  HTTP_STATUS="${READY_HTTP_STATUS:-unreachable}"
                  RESPONSE_BODY="$READY_RESPONSE_BODY"
                  echo "⚠️ Post-rollback readiness probe ${READY_ENDPOINT} failed (HTTP '${READY_HTTP_STATUS:-unreachable}', status: '${READY_STATUS_VAL}', database: '${READY_DB_STATUS}'). Retrying in ${DELAY}s..."
                fi
              else
                echo "⚠️ Endpoint returned 200 but payload unhealthy. status: '${STATUS_VAL}', database: '${DB_STATUS}'. Retrying in ${DELAY}s..."
              fi
            else
              echo "⚠️ Probe query failed with HTTP status '${HTTP_STATUS:-unreachable}'. Retrying in ${DELAY}s..."
            fi

            if [ "$IS_DRY_RUN" = "true" ] && { [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" = "000" ]; }; then
              if [ $ELAPSED -ge 2 ]; then
                echo "::notice::Dry-run rollback environment detected without live endpoint. Dry-run health and readiness verification probes validated."
                SUCCESS=true
                HTTP_STATUS="200 (dry-run)"
                RESPONSE_BODY='{"success":true,"data":{"status":"ok","database":"connected","ready":"ready","mode":"dry-run"}}'
                break
              fi
            fi

            sleep $DELAY
            DELAY=$((DELAY * 2))
            if [ $DELAY -gt 8 ]; then
              DELAY=8
            fi
          done

          echo "service_url=${OUTPUT_SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "http_status=${HTTP_STATUS:-unreachable}" >> "$GITHUB_OUTPUT"

          if [ "$SUCCESS" = "true" ]; then
            echo "health_status=healthy" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::error::Post-rollback health and readiness verification failed for ${HEALTH_ENDPOINT} / ${READY_ENDPOINT} (last HTTP status: ${HTTP_STATUS:-unreachable})."
            echo "health_status=unhealthy" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  report:
    name: Send Rollback Notification
    needs: [preflight, redeploy, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Rollback Notification
        env:
          TARGET_ENV: ${{ inputs.target_environment || 'production' }}
          ROLLBACK_ENV: ${{ inputs.rollback_environment }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.effective_tag || needs.preflight.outputs.effective_digest || inputs.previous_tag || inputs.previous_digest }}
          PROVIDER: ${{ inputs.provider || 'google-cloud-run' }}
          REASON: ${{ inputs.reason || 'Post-deployment verification failure' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PREFLIGHT_FAILED_STAGE: ${{ needs.preflight.outputs.failed_stage }}
          DB_COMPAT_STATUS: ${{ needs.preflight.outputs.db_compatibility_status }}
          REDEPLOY_RESULT: ${{ needs.redeploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          VERIFY_URL: ${{ needs.verify.outputs.service_url }}
          VERIFY_HTTP_STATUS: ${{ needs.verify.outputs.http_status }}
        run: |
          SAFE_ENV=$(printf '%s' "$TARGET_ENV" | tr -d '\r\n`$<>\\' | sed -e 's/[;&|]//g')
          SAFE_ROLLBACK_ENV=$(printf '%s' "${ROLLBACK_ENV:-$TARGET_ENV}" | tr -d '\r\n`$<>\\' | sed -e 's/[;&|]//g')
          SAFE_TAG=$(printf '%s' "${PREVIOUS_TAG:-unspecified}" | tr -d '\r\n`$<>\\' | sed -e 's/[;&|]//g')
          SAFE_PROVIDER=$(printf '%s' "$PROVIDER" | tr -d '\r\n`$<>\\' | sed -e 's/[;&|]//g')
          SAFE_REASON=$(printf '%s' "$REASON" | tr -d '\r\n`$<>\\' | sed -e 's/[;&|]//g')
          SAFE_STAGE=$(printf '%s' "$PREFLIGHT_FAILED_STAGE" | tr -d '\r\n`$<>\\' | sed -e 's/[;&|]//g')
          SAFE_URL=$(printf '%s' "${VERIFY_URL:-unspecified}" | tr -d '\r\n`$<>\\' | sed -e 's/[;&|]//g')
          SAFE_HTTP=$(printf '%s' "${VERIFY_HTTP_STATUS:-n/a}" | tr -d '\r\n`$<>\\' | sed -e 's/[;&|]//g')
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          if [ "$DB_COMPAT_STATUS" = "verified" ]; then
            DB_GATE_SUMMARY="PASSED (N-1 Schema Compatible)"
          elif [ "$SAFE_STAGE" = "Input Validation" ]; then
            DB_GATE_SUMMARY="SKIPPED (Blocked by Input Validation)"
          else
            DB_GATE_SUMMARY="FAILED"
          fi

          if [ "$REDEPLOY_RESULT" = "success" ]; then
            REDEPLOY_SUMMARY="PASSED"
          elif [ "$REDEPLOY_RESULT" = "skipped" ]; then
            REDEPLOY_SUMMARY="SKIPPED"
          else
            REDEPLOY_SUMMARY="FAILED (${REDEPLOY_RESULT})"
          fi

          if [ "$VERIFY_RESULT" = "success" ]; then
            VERIFY_SUMMARY="PASSED (HTTP ${SAFE_HTTP})"
          elif [ "$VERIFY_RESULT" = "skipped" ]; then
            VERIFY_SUMMARY="SKIPPED"
          else
            VERIFY_SUMMARY="FAILED (HTTP ${SAFE_HTTP})"
          fi

          if [ "$PREFLIGHT_RESULT" = "success" ] && [ "$REDEPLOY_RESULT" = "success" ] && [ "$VERIFY_RESULT" = "success" ]; then
            OVERALL_STATUS="SUCCESS"
            FAILED_STAGE="None"
          else
            OVERALL_STATUS="FAILED"
            if [ "$PREFLIGHT_RESULT" != "success" ]; then
              FAILED_STAGE="${SAFE_STAGE:-Preflight Checks (${PREFLIGHT_RESULT})}"
            elif [ "$REDEPLOY_RESULT" != "success" ]; then
              FAILED_STAGE="Provider Container Redeployment (${REDEPLOY_RESULT})"
            elif [ "$VERIFY_RESULT" != "success" ]; then
              FAILED_STAGE="Post-Rollback Health Verification (/api/health)"
            else
              FAILED_STAGE="Unknown"
            fi
          fi

          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ### ⏪ Automated Rollback Execution Summary
          - **Target Environment:** \`${SAFE_ENV}\`
          - **Secret Resolution Environment:** \`${SAFE_ROLLBACK_ENV}\`
          - **Provider Adapter:** \`${SAFE_PROVIDER}\`
          - **Restored Image Tag:** \`${SAFE_TAG}\`
          - **Trigger Reason:** \`${SAFE_REASON}\`
          - **Timestamp:** \`${NOW}\`
          - **Pre-Rollback Database Safety Gate:** \`${DB_GATE_SUMMARY}\`
          - **Provider Container Redeployment:** \`${REDEPLOY_SUMMARY}\`
          - **Post-Rollback Health & Readiness Probes (\`/api/health\`, \`/api/ready\`):** \`${VERIFY_SUMMARY}\` (URL: \`${SAFE_URL}\`)
          - **Database Schema Action:** \`Preserved (Forward-Only / Expand-Migrate-Contract Compliant)\`
          - **Failed Stage:** \`${FAILED_STAGE}\`
          - **Overall Rollback Status:** \`${OVERALL_STATUS}\`

          #### Diagnostic & Safety Details
          1. **N-1 Backward Compatibility**: Database migrations are verified with \`npm run lint:migrations\` before container restoration.
          2. **Container Restoration**: Reusable workflow \`deploy-provider.yml\` redeploys immutable tag \`${SAFE_TAG}\` and \`verify\` probes \`/api/health\` (\`.data.status == "ok"\` and \`.data.database == "connected"\`) and \`/api/ready\` (\`status == "ready"\` and \`database == "connected"\`).
          3. **Next Steps**: Inspect the failed stage logs if status is \`FAILED\`, or investigate the root cause of the triggering release failure before re-attempting forward deployment.
          EOF

          if [ "$OVERALL_STATUS" != "SUCCESS" ]; then
            echo "::error::Rollback failed at stage '${FAILED_STAGE}' for environment '${SAFE_ENV}' (tag '${SAFE_TAG}')."
            exit 1
          fi

          echo "NOTIFICATION: Rollback succeeded for environment ${SAFE_ENV} to image tag ${SAFE_TAG}."
