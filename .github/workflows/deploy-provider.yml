name: Provider Deployment

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      image_tag:
        description: 'OCI Image Tag or SHA to deploy'
        required: true
        default: 'latest'
        type: string
      provider:
        description: 'Hosting Provider Adapter'
        required: true
        default: 'google-cloud-run'
        type: choice
        options:
          - google-cloud-run
          - docker-host
          - generic-webhook
  workflow_call:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: false
        default: 'production'
        type: string
      image_tag:
        description: 'OCI Image Tag or SHA to deploy'
        required: false
        default: 'latest'
        type: string
      provider:
        description: 'Hosting Provider Adapter'
        required: false
        default: 'google-cloud-run'
        type: string
    secrets:
      GCP_SA_KEY:
        required: false
      GCP_PROJECT_ID:
        required: false
      DEPLOY_WEBHOOK_URL:
        required: false
      DATABASE_URL:
        required: false
    outputs:
      service_url:
        description: 'Target deployment service URL'
        value: ${{ jobs.deploy.outputs.service_url }}
      is_dry_run:
        description: 'Flag indicating if deployment ran in dry-run mode'
        value: ${{ jobs.deploy.outputs.is_dry_run }}

jobs:
  deploy:
    name: Deploy Release Artifact to Provider
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    outputs:
      service_url: ${{ steps.resolve-url.outputs.service_url }}
      is_dry_run: ${{ steps.resolve-url.outputs.is_dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve Artifact Image URI
        id: resolve
        run: |
          TAG="${{ inputs.image_tag || 'latest' }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${REPO_LOWER}:${TAG}"
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "Resolved deployment target artifact: ${IMAGE_URI}"

      - name: Deploy to Google Cloud Run Adapter
        if: (inputs.provider == 'google-cloud-run' || inputs.provider == '') && secrets.GCP_SA_KEY != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Execute Cloud Run Deployment
        id: cloudrun
        if: (inputs.provider == 'google-cloud-run' || inputs.provider == '') && secrets.GCP_SA_KEY != ''
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: wedding-website
          image: ${{ steps.resolve.outputs.image_uri }}
          region: us-central1

      - name: Deploy via Generic Webhook Adapter
        if: inputs.provider == 'generic-webhook' && secrets.DEPLOY_WEBHOOK_URL != ''
        run: |
          echo "Triggering deployment webhook for image ${{ steps.resolve.outputs.image_uri }}..."
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"image\": \"${{ steps.resolve.outputs.image_uri }}\", \"environment\": \"${{ inputs.environment || 'production' }}\"}"

      - name: Dry-run Provider Adapter Validation
        if: secrets.GCP_SA_KEY == '' && secrets.DEPLOY_WEBHOOK_URL == ''
        run: |
          echo "::notice::No active cloud provider secrets configured (e.g. GCP_SA_KEY or DEPLOY_WEBHOOK_URL). Validated provider adapter deployment parameters for image tag: ${{ inputs.image_tag || 'latest' }}."

      - name: Resolve Service URL Output
        id: resolve-url
        if: always()
        run: |
          URL="${{ steps.cloudrun.outputs.url }}"
          IS_DRY_RUN="false"
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] && [ -z "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            IS_DRY_RUN="true"
          fi
          if [ -z "$URL" ]; then
            URL="${{ secrets.SERVICE_URL || 'http://127.0.0.1:3000' }}"
          fi
          echo "service_url=${URL}" >> $GITHUB_OUTPUT
          echo "is_dry_run=${IS_DRY_RUN}" >> $GITHUB_OUTPUT
          echo "Resolved deployment service URL: ${URL} (is_dry_run=${IS_DRY_RUN})"

      - name: Deployment Summary
        run: |
          echo "### 🚀 Provider Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** \`${{ inputs.environment || 'production' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Provider:** \`${{ inputs.provider || 'google-cloud-run' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Image URI:** \`${{ steps.resolve.outputs.image_uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL:** \`${{ steps.resolve-url.outputs.service_url }}\`" >> $GITHUB_STEP_SUMMARY
