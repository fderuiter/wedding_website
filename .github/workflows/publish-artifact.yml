name: Publish Release Artifact

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom image tag (defaults to commit SHA)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Custom image tag'
        required: false
        type: string
    outputs:
      image_uri:
        description: 'Primary published image URI'
        value: ${{ jobs.publish.outputs.image_uri }}
      image_tag:
        description: 'Published image tag'
        value: ${{ jobs.publish.outputs.image_tag }}
      image_digest:
        description: 'Published image digest'
        value: ${{ jobs.publish.outputs.image_digest }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish Immutable OCI Image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.primary_uri }}
      image_tag: ${{ steps.meta.outputs.tag_name }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute Image Tag & Targets
        id: meta
        run: |
          RAW_TAG="${{ inputs.tag_name }}"
          if [ -z "$RAW_TAG" ]; then
            TAG_NAME="${{ github.sha }}"
          else
            TAG_NAME="$RAW_TAG"
          fi

          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          GHCR_PRIMARY="ghcr.io/${REPO_LOWER}:${TAG_NAME}"
          TAGS="${GHCR_PRIMARY}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}:latest"
          fi

          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            TAGS="${TAGS},${{ secrets.DOCKERHUB_USERNAME }}/wedding-website:${TAG_NAME},${{ secrets.DOCKERHUB_USERNAME }}/wedding-website:latest"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "primary_uri=${GHCR_PRIMARY}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 🚀 Release Artifact Published" >> $GITHUB_STEP_SUMMARY
          echo "**Primary Image URI:** \`${{ steps.meta.outputs.primary_uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.meta.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
