name: Publish Release Artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom image tag (defaults to commit SHA)'
        required: false
        type: string
      commit_sha:
        description: 'Commit SHA to check out and default image tag to'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Custom image tag'
        required: false
        type: string
      commit_sha:
        description: 'Commit SHA to check out and default image tag to'
        required: false
        type: string
    outputs:
      image_uri:
        description: 'Primary published image URI'
        value: ${{ jobs.publish.outputs.image_uri }}
      image_tag:
        description: 'Published image tag'
        value: ${{ jobs.publish.outputs.image_tag }}
      image_digest:
        description: 'Published image digest'
        value: ${{ jobs.publish.outputs.image_digest }}

permissions:
  contents: read

concurrency:
  group: publish-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish Immutable OCI Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    outputs:
      image_uri: ${{ steps.meta.outputs.primary_uri }}
      image_tag: ${{ steps.meta.outputs.tag_name }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Compute Image Tag & Targets
        id: meta
        env:
          RAW_INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$INPUT_COMMIT_SHA" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid commit_sha '${INPUT_COMMIT_SHA}'. Must be a 40-character hexadecimal commit SHA."
            exit 1
          fi

          RESOLVED_SHA="${INPUT_COMMIT_SHA:-${GITHUB_SHA}}"

          if [ -n "$RAW_INPUT_TAG" ]; then
            if [[ ! "$RAW_INPUT_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
              echo "::error::Invalid image tag '${RAW_INPUT_TAG}'. Must only contain alphanumeric characters, underscores, periods, and hyphens."
              exit 1
            fi
            TAG_NAME="$RAW_INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]] && [ -n "${GITHUB_REF_NAME}" ]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[a-zA-Z0-9_.-]*$ ]]; then
              echo "::error::Invalid release tag '${GITHUB_REF_NAME}'. Must start with 'v' and only contain alphanumeric characters, underscores, periods, and hyphens."
              exit 1
            fi
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="${RESOLVED_SHA}"
          fi

          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          GHCR_PRIMARY="ghcr.io/${REPO_LOWER}:${TAG_NAME}"
          TAGS="${GHCR_PRIMARY}"

          if [ -n "${RESOLVED_SHA}" ] && [ "${TAG_NAME}" != "${RESOLVED_SHA}" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}:${RESOLVED_SHA}"
          fi

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}:latest"
          fi

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            TAGS="${TAGS},${DOCKERHUB_USERNAME}/wedding-website:${TAG_NAME}"
            if [ -n "${RESOLVED_SHA}" ] && [ "${TAG_NAME}" != "${RESOLVED_SHA}" ]; then
              TAGS="${TAGS},${DOCKERHUB_USERNAME}/wedding-website:${RESOLVED_SHA}"
            fi
            TAGS="${TAGS},${DOCKERHUB_USERNAME}/wedding-website:latest"
          fi

          echo "image_repository=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "primary_uri=${GHCR_PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Local Container Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.primary_uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_uri }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy Scan Results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push Docker Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@c0744595e72338575084a4bf85ed76e1eb521ddf # v2.2.3
        with:
          subject-name: ${{ steps.meta.outputs.image_repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          PRIMARY_URI: ${{ steps.meta.outputs.primary_uri }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### 🚀 Release Artifact Published" >> "$GITHUB_STEP_SUMMARY"
          echo "**Primary Image URI:** \`${PRIMARY_URI}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${TAG_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
