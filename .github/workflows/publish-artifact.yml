name: Publish Release Artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom image tag (defaults to commit SHA)'
        required: false
        type: string
      commit_sha:
        description: 'Commit SHA to check out and default image tag to'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Custom image tag'
        required: false
        type: string
      commit_sha:
        description: 'Commit SHA to check out and default image tag to'
        required: false
        type: string
    outputs:
      image_uri:
        description: 'Primary published image URI'
        value: ${{ jobs.publish.outputs.image_uri }}
      image_tag:
        description: 'Published image tag'
        value: ${{ jobs.publish.outputs.image_tag }}
      image_digest:
        description: 'Published image digest'
        value: ${{ jobs.publish.outputs.image_digest }}

permissions:
  contents: read

concurrency:
  group: publish-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, Scan & Smoke Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Validate Commit SHA Input
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ -n "$INPUT_COMMIT_SHA" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid commit_sha '${INPUT_COMMIT_SHA}'. Must be a 40-character hexadecimal commit SHA."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache BuildKit APT and npm mounts
        id: buildkit-deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildkit-mounts/deps
          key: buildkit-deps-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'package-lock.json', '.npmrc') }}
          restore-keys: |
            buildkit-deps-${{ matrix.arch }}-

      - name: Cache BuildKit Next.js mount
        id: buildkit-next-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildkit-mounts/next
          key: buildkit-next-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.ts', 'postcss.config.mjs', 'tsconfig.json', 'tsconfig.build.json', 'prisma/schema.prisma', 'src/**') }}
          restore-keys: |
            buildkit-next-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}-
            buildkit-next-${{ matrix.arch }}-

      - name: Hydrate BuildKit Cache Mounts
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          MOUNT_CACHE_DIR: /tmp/buildkit-mounts
        run: |
          BASE_IMAGE=$(awk '/^FROM / {print $2; exit}' Dockerfile)
          CTX_DIR=$(mktemp -d)
          trap 'rm -rf "$CTX_DIR"' EXIT
          HAS_ARCHIVE=false
          if [ -f "$MOUNT_CACHE_DIR/deps/mounts.tar" ]; then
            cp "$MOUNT_CACHE_DIR/deps/mounts.tar" "$CTX_DIR/deps.tar"
            HAS_ARCHIVE=true
          fi
          if [ -f "$MOUNT_CACHE_DIR/next/mounts.tar" ]; then
            cp "$MOUNT_CACHE_DIR/next/mounts.tar" "$CTX_DIR/next.tar"
            HAS_ARCHIVE=true
          fi
          if [ "$HAS_ARCHIVE" = "false" ]; then
            echo "No persisted BuildKit cache mounts found; skipping hydration."
            exit 0
          fi
          printf '%s\n' \
            '# syntax=docker/dockerfile:1' \
            "FROM ${BASE_IMAGE}" \
            'ARG CACHEBUST=1' \
            'RUN --mount=type=bind,target=/ctx \' \
            '    --mount=type=cache,target=/var/cache/apt,sharing=locked \' \
            '    --mount=type=cache,target=/var/lib/apt,sharing=locked \' \
            '    --mount=type=cache,target=/root/.npm,sharing=locked \' \
            '    --mount=type=cache,target=/app/.next/cache,sharing=locked \' \
            '    echo "$CACHEBUST" >/dev/null && \' \
            '    if [ -f /ctx/deps.tar ]; then tar -xf /ctx/deps.tar -C /; fi && \' \
            '    if [ -f /ctx/next.tar ]; then tar -xf /ctx/next.tar -C /; fi' \
            | docker buildx build \
              --platform "$TARGET_PLATFORM" \
              --build-arg "CACHEBUST=$(date +%s%N)" \
              --output type=cacheonly \
              -f - "$CTX_DIR"

      - name: Build Native Container Image
        id: build_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=oci,dest=/tmp/oci-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,scope=app-${{ matrix.arch }},mode=max

      - name: Persist BuildKit Cache Mounts
        if: steps.buildkit-deps-cache.outputs.cache-hit != 'true' || steps.buildkit-next-cache.outputs.cache-hit != 'true'
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          MOUNT_CACHE_DIR: /tmp/buildkit-mounts
          DEPS_CACHE_HIT: ${{ steps.buildkit-deps-cache.outputs.cache-hit }}
          NEXT_CACHE_HIT: ${{ steps.buildkit-next-cache.outputs.cache-hit }}
        run: |
          BASE_IMAGE=$(awk '/^FROM / {print $2; exit}' Dockerfile)
          EMPTY_DIR=$(mktemp -d)
          OUT_DIR=$(mktemp -d)
          trap 'rm -rf "$EMPTY_DIR" "$OUT_DIR"' EXIT
          EXPORT_DEPS="false"
          EXPORT_NEXT="false"
          if [ "$DEPS_CACHE_HIT" != "true" ]; then EXPORT_DEPS="true"; fi
          if [ "$NEXT_CACHE_HIT" != "true" ]; then EXPORT_NEXT="true"; fi
          printf '%s\n' \
            '# syntax=docker/dockerfile:1' \
            "FROM ${BASE_IMAGE} AS exporter" \
            'ARG CACHEBUST=1' \
            'ARG EXPORT_DEPS=false' \
            'ARG EXPORT_NEXT=false' \
            'RUN --mount=type=cache,target=/var/cache/apt,sharing=locked \' \
            '    --mount=type=cache,target=/var/lib/apt,sharing=locked \' \
            '    --mount=type=cache,target=/root/.npm,sharing=locked \' \
            '    --mount=type=cache,target=/app/.next/cache,sharing=locked \' \
            '    echo "$CACHEBUST" >/dev/null && \' \
            '    mkdir -p /out /var/cache/apt /var/lib/apt /root/.npm /app/.next/cache && \' \
            '    if [ "$EXPORT_DEPS" = "true" ]; then mkdir -p /out/deps && tar -cf /out/deps/mounts.tar -C / var/cache/apt var/lib/apt root/.npm; fi && \' \
            '    if [ "$EXPORT_NEXT" = "true" ]; then mkdir -p /out/next && tar -cf /out/next/mounts.tar -C / app/.next/cache; fi' \
            'FROM scratch' \
            'COPY --from=exporter /out /' \
            | docker buildx build \
              --platform "$TARGET_PLATFORM" \
              --build-arg "CACHEBUST=$(date +%s%N)" \
              --build-arg "EXPORT_DEPS=${EXPORT_DEPS}" \
              --build-arg "EXPORT_NEXT=${EXPORT_NEXT}" \
              --output "type=local,dest=${OUT_DIR}" \
              -f - "$EMPTY_DIR"
          if [ -f "$OUT_DIR/deps/mounts.tar" ]; then
            mkdir -p "$MOUNT_CACHE_DIR/deps"
            mv -f "$OUT_DIR/deps/mounts.tar" "$MOUNT_CACHE_DIR/deps/mounts.tar"
          fi
          if [ -f "$OUT_DIR/next/mounts.tar" ]; then
            mkdir -p "$MOUNT_CACHE_DIR/next"
            mv -f "$OUT_DIR/next/mounts.tar" "$MOUNT_CACHE_DIR/next/mounts.tar"
          fi

      - name: Load OCI Archive into Local Docker Daemon
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          OCI_TAR="/tmp/oci-${ARCH}.tar"
          if [ ! -f "$OCI_TAR" ]; then
            echo "::error::Missing exported OCI archive '${OCI_TAR}'."
            exit 1
          fi
          skopeo copy "oci-archive:${OCI_TAR}" "docker-daemon:wedding-website:latest"

      - name: Scan Native Container Image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wedding-website:latest
          format: 'sarif'
          output: 'trivy-results-${{ matrix.arch }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy Scan Results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always() && hashFiles(format('trivy-results-{0}.sarif', matrix.arch)) != ''
        with:
          sarif_file: 'trivy-results-${{ matrix.arch }}.sarif'
          category: 'trivy-${{ matrix.arch }}'

      - name: Run Native Container & Clean Database Smoke Test
        env:
          SKIP_IMAGE_BUILD: 'true'
          GHA_CACHE_SCOPE: app-${{ matrix.arch }}
        run: node scripts/test-container.mjs

      - name: Compress Verified OCI Archive & Export Digest
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          OCI_TAR="/tmp/oci-${ARCH}.tar"
          if [ ! -f "$OCI_TAR" ]; then
            echo "::error::Missing verified OCI archive '${OCI_TAR}'."
            exit 1
          fi
          ARCHIVE_DIGEST=$(skopeo inspect --format '{{.Digest}}' "oci-archive:${OCI_TAR}" | tr -d '[:space:]')
          if [[ ! "$ARCHIVE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid OCI manifest digest '${ARCHIVE_DIGEST}' inspected from '${OCI_TAR}'."
            exit 1
          fi
          if [ -n "$BUILD_DIGEST" ] && [ "$BUILD_DIGEST" != "$ARCHIVE_DIGEST" ]; then
            echo "::error::Buildx digest '${BUILD_DIGEST}' does not match inspected OCI archive digest '${ARCHIVE_DIGEST}'."
            exit 1
          fi
          mkdir -p /tmp/oci-handoff
          zstd -T0 -f "$OCI_TAR" -o "/tmp/oci-handoff/oci-${ARCH}.tar.zst"
          printf '%s\n' "$ARCHIVE_DIGEST" > "/tmp/oci-handoff/${ARCH}.digest"

      - name: Upload Verified OCI Archive Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-archive-${{ matrix.arch }}
          path: |
            /tmp/oci-handoff/oci-${{ matrix.arch }}.tar.zst
            /tmp/oci-handoff/${{ matrix.arch }}.digest
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Merge Multi-Arch Index & Attest Provenance
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_uri: ${{ steps.meta.outputs.primary_uri }}
      image_tag: ${{ steps.meta.outputs.tag_name }}
      image_digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Compute Image Tag & Targets
        id: meta
        env:
          RAW_INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$INPUT_COMMIT_SHA" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid commit_sha '${INPUT_COMMIT_SHA}'. Must be a 40-character hexadecimal commit SHA."
            exit 1
          fi

          RESOLVED_SHA="${INPUT_COMMIT_SHA:-${GITHUB_SHA}}"

          if [ -n "$RAW_INPUT_TAG" ]; then
            if [[ ! "$RAW_INPUT_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
              echo "::error::Invalid image tag '${RAW_INPUT_TAG}'. Must only contain alphanumeric characters, underscores, periods, and hyphens."
              exit 1
            fi
            TAG_NAME="$RAW_INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]] && [ -n "${GITHUB_REF_NAME}" ]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[a-zA-Z0-9_.-]*$ ]]; then
              echo "::error::Invalid release tag '${GITHUB_REF_NAME}'. Must start with 'v' and only contain alphanumeric characters, underscores, periods, and hyphens."
              exit 1
            fi
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="${RESOLVED_SHA}"
          fi

          PUBLISH_LATEST="false"
          if [ -z "$RAW_INPUT_TAG" ]; then
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              PUBLISH_LATEST="true"
            elif [[ "${GITHUB_REF}" == refs/tags/v* ]] && [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" != *-* ]]; then
              PUBLISH_LATEST="true"
            fi
          fi

          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO="ghcr.io/${REPO_LOWER}"
          GHCR_PRIMARY="${IMAGE_REPO}:${TAG_NAME}"
          TAGS="${GHCR_PRIMARY}"

          if [ -n "${RESOLVED_SHA}" ] && [ "${TAG_NAME}" != "${RESOLVED_SHA}" ]; then
            TAGS="${TAGS},${IMAGE_REPO}:${RESOLVED_SHA}"
          fi

          if [ "${PUBLISH_LATEST}" = "true" ]; then
            TAGS="${TAGS},${IMAGE_REPO}:latest"
          fi

          DOCKERHUB_REPO=""
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            DOCKERHUB_REPO="${DOCKERHUB_USERNAME}/wedding-website"
            TAGS="${TAGS},${DOCKERHUB_REPO}:${TAG_NAME}"
            if [ -n "${RESOLVED_SHA}" ] && [ "${TAG_NAME}" != "${RESOLVED_SHA}" ]; then
              TAGS="${TAGS},${DOCKERHUB_REPO}:${RESOLVED_SHA}"
            fi
            if [ "${PUBLISH_LATEST}" = "true" ]; then
              TAGS="${TAGS},${DOCKERHUB_REPO}:latest"
            fi
          fi

          echo "image_repository=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_repository=${DOCKERHUB_REPO}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "primary_uri=${GHCR_PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Download Verified OCI Archive Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oci-archive-*
          merge-multiple: true
          path: /tmp/oci-handoff

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify and Push Architecture OCI Archives
        env:
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_repository }}
          DOCKERHUB_REPOSITORY: ${{ steps.meta.outputs.dockerhub_repository }}
        run: |
          mkdir -p /tmp/digests

          for required_arch in amd64 arm64; do
            DIGEST_FILE="/tmp/oci-handoff/${required_arch}.digest"
            COMPRESSED_ARCHIVE="/tmp/oci-handoff/oci-${required_arch}.tar.zst"
            DECOMPRESSED_ARCHIVE="/tmp/oci-handoff/oci-${required_arch}.tar"

            if [ ! -f "$DIGEST_FILE" ] || [ ! -f "$COMPRESSED_ARCHIVE" ]; then
              echo "::error::Missing OCI archive or digest artifact for architecture '${required_arch}'."
              exit 1
            fi

            EXPECTED_DIGEST=$(tr -d '[:space:]' < "$DIGEST_FILE")
            if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid expected digest '${EXPECTED_DIGEST}' for architecture '${required_arch}'."
              exit 1
            fi

            zstd -d -f "$COMPRESSED_ARCHIVE" -o "$DECOMPRESSED_ARCHIVE"
            ACTUAL_DIGEST=$(skopeo inspect --format '{{.Digest}}' "oci-archive:${DECOMPRESSED_ARCHIVE}" | tr -d '[:space:]')
            if [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
              echo "::error::OCI archive digest mismatch for '${required_arch}': expected '${EXPECTED_DIGEST}', inspected '${ACTUAL_DIGEST}'."
              exit 1
            fi

            printf '%s\n' "$EXPECTED_DIGEST" > "/tmp/digests/${required_arch}.digest"
          done

          for required_arch in amd64 arm64; do
            ARCH_DIGEST=$(tr -d '[:space:]' < "/tmp/digests/${required_arch}.digest")
            DECOMPRESSED_ARCHIVE="/tmp/oci-handoff/oci-${required_arch}.tar"

            skopeo copy --preserve-digests \
              "oci-archive:${DECOMPRESSED_ARCHIVE}" \
              "docker://${IMAGE_REPOSITORY}@${ARCH_DIGEST}"

            if [ -n "$DOCKERHUB_REPOSITORY" ]; then
              skopeo copy --preserve-digests \
                "oci-archive:${DECOMPRESSED_ARCHIVE}" \
                "docker://docker.io/${DOCKERHUB_REPOSITORY}@${ARCH_DIGEST}"
            fi
          done

      - name: Merge and Push Multi-Platform OCI Index
        id: merge
        env:
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_repository }}
          DOCKERHUB_REPOSITORY: ${{ steps.meta.outputs.dockerhub_repository }}
          PRIMARY_URI: ${{ steps.meta.outputs.primary_uri }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for required_arch in amd64 arm64; do
            if [ ! -f "/tmp/digests/${required_arch}.digest" ]; then
              echo "::error::Missing verified digest file for architecture '${required_arch}'."
              exit 1
            fi
          done

          AMD64_DIGEST=$(tr -d '[:space:]' < /tmp/digests/amd64.digest)
          ARM64_DIGEST=$(tr -d '[:space:]' < /tmp/digests/arm64.digest)

          for arch_digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            if [[ ! "$arch_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid per-architecture digest '${arch_digest}'."
              exit 1
            fi
          done

          IFS=',' read -r -a ALL_TAGS <<< "$TAGS"
          GHCR_TAG_ARGS=()
          DOCKERHUB_TAG_ARGS=()
          DOCKERHUB_PRIMARY_URI=""

          for tag_ref in "${ALL_TAGS[@]}"; do
            [ -z "$tag_ref" ] && continue
            if [[ "$tag_ref" == ghcr.io/* ]]; then
              GHCR_TAG_ARGS+=("--tag" "$tag_ref")
            else
              DOCKERHUB_TAG_ARGS+=("--tag" "$tag_ref")
              if [ -z "$DOCKERHUB_PRIMARY_URI" ]; then
                DOCKERHUB_PRIMARY_URI="$tag_ref"
              fi
            fi
          done

          docker buildx imagetools create \
            "${GHCR_TAG_ARGS[@]}" \
            "${IMAGE_REPOSITORY}@${AMD64_DIGEST}" \
            "${IMAGE_REPOSITORY}@${ARM64_DIGEST}"

          INDEX_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$PRIMARY_URI")
          if [[ ! "$INDEX_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Failed to resolve valid sha256 multi-platform index digest for '${PRIMARY_URI}' (got '${INDEX_DIGEST}')."
            exit 1
          fi

          RAW_INDEX=$(docker buildx imagetools inspect --raw "$PRIMARY_URI")
          for expected_arch in amd64 arm64; do
            if ! printf '%s' "$RAW_INDEX" | jq -e --arg arch "$expected_arch" '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch)' >/dev/null; then
              echo "::error::Published multi-platform index '${PRIMARY_URI}' is missing linux/${expected_arch} manifest."
              exit 1
            fi
          done

          DOCKERHUB_INDEX_DIGEST=""
          if [ -n "$DOCKERHUB_REPOSITORY" ] && [ "${#DOCKERHUB_TAG_ARGS[@]}" -gt 0 ]; then
            docker buildx imagetools create \
              "${DOCKERHUB_TAG_ARGS[@]}" \
              "${DOCKERHUB_REPOSITORY}@${AMD64_DIGEST}" \
              "${DOCKERHUB_REPOSITORY}@${ARM64_DIGEST}"

            DOCKERHUB_INDEX_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$DOCKERHUB_PRIMARY_URI")
            if [[ ! "$DOCKERHUB_INDEX_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Failed to resolve valid sha256 multi-platform index digest for '${DOCKERHUB_PRIMARY_URI}' (got '${DOCKERHUB_INDEX_DIGEST}')."
              exit 1
            fi

            DOCKERHUB_RAW_INDEX=$(docker buildx imagetools inspect --raw "$DOCKERHUB_PRIMARY_URI")
            for expected_arch in amd64 arm64; do
              if ! printf '%s' "$DOCKERHUB_RAW_INDEX" | jq -e --arg arch "$expected_arch" '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch)' >/dev/null; then
                echo "::error::Published multi-platform index '${DOCKERHUB_PRIMARY_URI}' is missing linux/${expected_arch} manifest."
                exit 1
              fi
            done
          fi

          echo "digest=${INDEX_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_digest=${DOCKERHUB_INDEX_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image_repository }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub Build Provenance (optional)
        if: steps.meta.outputs.dockerhub_repository != '' && steps.merge.outputs.dockerhub_digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ steps.meta.outputs.dockerhub_repository }}
          subject-digest: ${{ steps.merge.outputs.dockerhub_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Summary
        env:
          PRIMARY_URI: ${{ steps.meta.outputs.primary_uri }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          echo "### 🚀 Release Artifact Published" >> "$GITHUB_STEP_SUMMARY"
          echo "**Primary Image URI:** \`${PRIMARY_URI}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${TAG_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
