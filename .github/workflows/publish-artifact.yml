name: Publish Release Artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom image tag (defaults to commit SHA)'
        required: false
        type: string
      commit_sha:
        description: 'Commit SHA to check out and default image tag to'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Custom image tag'
        required: false
        type: string
      commit_sha:
        description: 'Commit SHA to check out and default image tag to'
        required: false
        type: string
    outputs:
      image_uri:
        description: 'Primary published image URI'
        value: ${{ jobs.publish.outputs.image_uri }}
      image_tag:
        description: 'Published image tag'
        value: ${{ jobs.publish.outputs.image_tag }}
      image_digest:
        description: 'Published image digest'
        value: ${{ jobs.publish.outputs.image_digest }}

permissions:
  contents: read

concurrency:
  group: publish-artifact-release
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    name: Verify Main Ancestry & CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      resolved_sha: ${{ steps.resolve.outputs.resolved_sha }}
      promote_existing: ${{ steps.inspect-ghcr.outputs.promote_existing }}
      amd64_digest: ${{ steps.inspect-ghcr.outputs.amd64_digest }}
      arm64_digest: ${{ steps.inspect-ghcr.outputs.arm64_digest }}
      source_index_digest: ${{ steps.inspect-ghcr.outputs.source_index_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Commit SHA & Main Branch Ancestry
        id: resolve
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_COMMIT_SHA" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid commit_sha '${INPUT_COMMIT_SHA}'. Must be a 40-character hexadecimal commit SHA."
            exit 1
          fi

          RESOLVED_SHA="${INPUT_COMMIT_SHA:-${CURRENT_SHA}}"
          if [[ ! "$RESOLVED_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Resolved target SHA '${RESOLVED_SHA}' is not a valid 40-character commit SHA."
            exit 1
          fi

          GIT_AUTH_ARGS=()
          ORIGIN_URL=$(git remote get-url origin 2>/dev/null || true)
          EFFECTIVE_GIT_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -n "$EFFECTIVE_GIT_TOKEN" ] && [[ "$ORIGIN_URL" =~ ^https?://[^/]+ ]]; then
            ORIGIN_SERVER="${BASH_REMATCH[0]}"
            BASIC_TOKEN=$(printf 'x-access-token:%s' "$EFFECTIVE_GIT_TOKEN" | base64 | tr -d '\r\n')
            GIT_AUTH_ARGS=(-c "http.${ORIGIN_SERVER}/.extraheader=AUTHORIZATION: basic ${BASIC_TOKEN}")
          fi

          if git remote get-url origin >/dev/null 2>&1; then
            git "${GIT_AUTH_ARGS[@]}" fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          fi

          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::Missing refs/remotes/origin/main reference required to verify main branch ancestry."
            exit 1
          fi

          if ! git cat-file -e "${RESOLVED_SHA}^{commit}" 2>/dev/null; then
            if git remote get-url origin >/dev/null 2>&1; then
              git "${GIT_AUTH_ARGS[@]}" fetch --no-tags origin "$RESOLVED_SHA" || true
            fi
          fi

          if ! git cat-file -e "${RESOLVED_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Commit '${RESOLVED_SHA}' does not exist in repository history."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$RESOLVED_SHA" refs/remotes/origin/main; then
            echo "::error::Target commit '${RESOLVED_SHA}' is not an ancestor of origin/main. Refusing to build or sign unmerged artifact."
            exit 1
          fi

          echo "resolved_sha=${RESOLVED_SHA}" >> "$GITHUB_OUTPUT"
          echo "Verified target commit ${RESOLVED_SHA} is an ancestor of origin/main."

      - name: Poll Active CI Runs & Verify Passing CI Status
        id: verify-ci
        timeout-minutes: 42
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RESOLVED_SHA: ${{ steps.resolve.outputs.resolved_sha }}
        run: |
          if [[ ! "$RESOLVED_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid target commit SHA '${RESOLVED_SHA}'."
            exit 1
          fi

          API_BASE="${GITHUB_API_URL:-https://api.github.com}"
          MAX_TIMEOUT="${CI_POLL_TIMEOUT_SECONDS:-2400}"
          POLL_INTERVAL="${CI_POLL_INTERVAL_SECONDS:-15}"
          if [ "${EVENT_NAME:-}" = "push" ]; then
            INITIAL_GRACE="${CI_INITIAL_GRACE_SECONDS:-30}"
          else
            INITIAL_GRACE="${CI_INITIAL_GRACE_SECONDS:-0}"
          fi

          AUTH_ARGS=()
          if [ -n "${GH_TOKEN:-}" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${GH_TOKEN}")
          fi

          START_TIME=$(date +%s)
          OBSERVED_ACTIVE_IDS=""

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if ! RUNS_JSON=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${AUTH_ARGS[@]}" \
              "${API_BASE}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RESOLVED_SHA}&per_page=100"); then
              echo "::error::Failed to query ci.yml workflow runs for commit '${RESOLVED_SHA}' in '${GITHUB_REPOSITORY}'."
              exit 1
            fi

            MATCHED_RUNS=$(printf '%s' "$RUNS_JSON" | jq -c \
              --arg sha "$RESOLVED_SHA" \
              --arg repo "$GITHUB_REPOSITORY" '
              [
                .workflow_runs[]?
                | select((.head_sha // "" | ascii_downcase) == ($sha | ascii_downcase))
                | select((.head_repository == null) or ((.head_repository.full_name // "" | ascii_downcase) == ($repo | ascii_downcase)))
              ]
            ')

            TOTAL_COUNT=$(printf '%s' "$MATCHED_RUNS" | jq 'length')
            ACTIVE_IDS=$(printf '%s' "$MATCHED_RUNS" | jq -r '[.[] | select(.status != "completed") | (.id | tostring)] | join(",")')

            if [ -n "$ACTIVE_IDS" ]; then
              IFS=',' read -r -a CURRENT_ACTIVE <<< "$ACTIVE_IDS"
              for run_id in "${CURRENT_ACTIVE[@]}"; do
                [ -z "$run_id" ] && continue
                case ",${OBSERVED_ACTIVE_IDS}," in
                  *",${run_id},"*) ;;
                  *) OBSERVED_ACTIVE_IDS="${OBSERVED_ACTIVE_IDS:+${OBSERVED_ACTIVE_IDS},}${run_id}" ;;
                esac
              done

              if [ "$ELAPSED" -ge "$MAX_TIMEOUT" ]; then
                echo "::error::Timed out after ${MAX_TIMEOUT}s waiting for active ci.yml run(s) [${ACTIVE_IDS}] for commit '${RESOLVED_SHA}'."
                exit 1
              fi

              echo "Waiting for active ci.yml run(s) [${ACTIVE_IDS}] on commit ${RESOLVED_SHA} (elapsed: ${ELAPSED}s)..."
              sleep "$POLL_INTERVAL"
              continue
            fi

            if [ "$TOTAL_COUNT" -eq 0 ] && [ "$ELAPSED" -lt "$INITIAL_GRACE" ]; then
              echo "No ci.yml workflow runs registered yet for pushed commit ${RESOLVED_SHA}; retrying in ${POLL_INTERVAL}s (elapsed: ${ELAPSED}s)..."
              sleep "$POLL_INTERVAL"
              continue
            fi

            if [ -n "$OBSERVED_ACTIVE_IDS" ]; then
              WAITED_SUCCESS_ID=$(printf '%s' "$MATCHED_RUNS" | jq -r \
                --arg ids ",${OBSERVED_ACTIVE_IDS}," '
                [
                  .[]
                  | select(.status == "completed" and .conclusion == "success")
                  | ("," + (.id | tostring) + ",") as $needle
                  | select($ids | contains($needle))
                  | (.id | tostring)
                ][0] // empty
              ')
              if [ -z "$WAITED_SUCCESS_ID" ]; then
                echo "::error::Active ci.yml workflow run(s) [${OBSERVED_ACTIVE_IDS}] for commit '${RESOLVED_SHA}' completed without success. Blocking artifact build and provenance signing."
                exit 1
              fi
              VERIFIED_RUN_ID="$WAITED_SUCCESS_ID"
            else
              VERIFIED_RUN_ID=$(printf '%s' "$MATCHED_RUNS" | jq -r '
                [.[] | select(.status == "completed" and .conclusion == "success") | (.id | tostring)][0] // empty
              ')
            fi

            if [ -z "$VERIFIED_RUN_ID" ]; then
              echo "::error::No completed successful ci.yml workflow run found for commit '${RESOLVED_SHA}' in '${GITHUB_REPOSITORY}'. Blocking artifact build and provenance signing."
              exit 1
            fi

            echo "Verified passing ci.yml run (ID: ${VERIFIED_RUN_ID}) for commit ${RESOLVED_SHA}."
            echo "### 🟢 Pre-Publish CI Verification Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Target Commit SHA:** \`${RESOLVED_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Verified CI Run ID:** \`${VERIFIED_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **CI Status:** \`VERIFIED\`" >> "$GITHUB_STEP_SUMMARY"
            break
          done

      - name: Verify Successful CI Run for Commit
        timeout-minutes: 3
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.resolved_sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const fullRepo = `${context.repo.owner}/${context.repo.repo}`;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: targetSha,
                status: 'completed',
                per_page: 100,
              }
            );

            const successfulRun = runs.find(
              (run) =>
                run.conclusion === 'success' &&
                run.head_sha === targetSha &&
                (!run.head_repository || run.head_repository.full_name === fullRepo)
            );

            if (!successfulRun) {
              core.setFailed(
                `No completed successful CI workflow run found for commit ${targetSha} in ${fullRepo}. Artifact publication aborted.`
              );
              return;
            }

            core.info(
              `Verified successful CI run #${successfulRun.run_number} (ID: ${successfulRun.id}) for commit ${targetSha}.`
            );

      - name: Inspect Existing Attested GHCR Release Image
        id: inspect-ghcr
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR_LOGIN: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          RESOLVED_SHA: ${{ steps.resolve.outputs.resolved_sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-artifact.yml
        run: bash scripts/ghcr-release-promotion.sh inspect-preflight

  build:
    name: Build, Scan & Smoke Test (${{ matrix.platform }})
    needs: [preflight]
    if: needs.preflight.outputs.promote_existing != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Validate Commit SHA Input
        id: meta
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ -n "$INPUT_COMMIT_SHA" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid commit_sha '${INPUT_COMMIT_SHA}'. Must be a 40-character hexadecimal commit SHA."
            exit 1
          fi
          RESOLVED_SHA="${INPUT_COMMIT_SHA:-${GITHUB_SHA}}"
          echo "revision=${RESOLVED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache BuildKit APT and npm mounts
        id: buildkit-deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildkit-mounts/deps
          key: release-buildkit-deps-${{ matrix.arch }}-${{ hashFiles('Dockerfile', 'package-lock.json', '.npmrc') }}

      - name: Cache BuildKit Next.js mount
        id: buildkit-next-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildkit-mounts/next
          key: release-buildkit-next-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.ts', 'postcss.config.mjs', 'tsconfig.json', 'tsconfig.build.json', 'prisma/schema.prisma', 'src/**') }}

      - name: Hydrate BuildKit Cache Mounts
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          MOUNT_CACHE_DIR: /tmp/buildkit-mounts
        run: |
          BASE_IMAGE=$(awk '/^FROM / {print $2; exit}' Dockerfile)
          CTX_DIR=$(mktemp -d)
          trap 'rm -rf "$CTX_DIR"' EXIT
          validate_cache_archive() {
            local archive="$1"
            local allowed_regex="$2"
            if tar -tvf "$archive" | awk '{print substr($1,1,1)}' | grep -Eq '^[lhbcps]'; then
              echo "::error::Cache archive '${archive}' contains disallowed link or device entries."
              exit 1
            fi
            while IFS= read -r member; do
              [ -z "$member" ] && continue
              local normalized="${member#./}"
              if [[ "$member" == /* ]] || [[ "$normalized" == *".."* ]] || [[ ! "$normalized" =~ $allowed_regex ]]; then
                echo "::error::Cache archive '${archive}' contains unexpected path '${member}'."
                exit 1
              fi
            done < <(tar -tf "$archive")
          }
          HAS_ARCHIVE=false
          if [ -f "$MOUNT_CACHE_DIR/deps/mounts.tar" ]; then
            validate_cache_archive "$MOUNT_CACHE_DIR/deps/mounts.tar" '^(var(/cache(/apt(/.*)?)?|/lib(/apt(/.*)?)?)?|root(/\.npm(/.*)?)?)$'
            cp "$MOUNT_CACHE_DIR/deps/mounts.tar" "$CTX_DIR/deps.tar"
            HAS_ARCHIVE=true
          fi
          if [ -f "$MOUNT_CACHE_DIR/next/mounts.tar" ]; then
            validate_cache_archive "$MOUNT_CACHE_DIR/next/mounts.tar" '^app(/\.next(/cache(/.*)?)?)?$'
            cp "$MOUNT_CACHE_DIR/next/mounts.tar" "$CTX_DIR/next.tar"
            HAS_ARCHIVE=true
          fi
          if [ "$HAS_ARCHIVE" = "false" ]; then
            echo "No persisted BuildKit cache mounts found; skipping hydration."
            exit 0
          fi
          printf '%s\n' \
            '# syntax=docker/dockerfile:1' \
            "FROM ${BASE_IMAGE}" \
            'ARG CACHEBUST=1' \
            'RUN --mount=type=bind,target=/ctx \' \
            '    --mount=type=cache,target=/var/cache/apt,sharing=locked \' \
            '    --mount=type=cache,target=/var/lib/apt,sharing=locked \' \
            '    --mount=type=cache,target=/root/.npm,sharing=locked \' \
            '    --mount=type=cache,target=/app/.next/cache,sharing=locked \' \
            '    echo "$CACHEBUST" >/dev/null && \' \
            '    if [ -f /ctx/deps.tar ]; then mkdir -p /var/cache/apt /var/lib/apt /root/.npm && tar --no-same-owner --no-same-permissions -xf /ctx/deps.tar -C / var/cache/apt var/lib/apt root/.npm; fi && \' \
            '    if [ -f /ctx/next.tar ]; then mkdir -p /app/.next/cache && tar --no-same-owner --no-same-permissions -xf /ctx/next.tar -C / app/.next/cache; fi' \
            | docker buildx build \
              --platform "$TARGET_PLATFORM" \
              --build-arg "CACHEBUST=$(date +%s%N)" \
              --output type=cacheonly \
              -f - "$CTX_DIR"

      - name: Build Native Container Image
        id: build_image
        timeout-minutes: 20
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
          annotations: |
            manifest:org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
          outputs: type=oci,dest=/tmp/oci-${{ matrix.arch }}.tar
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,scope=app-${{ matrix.arch }},mode=max

      - name: Persist BuildKit Cache Mounts
        if: steps.buildkit-deps-cache.outputs.cache-hit != 'true' || steps.buildkit-next-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          MOUNT_CACHE_DIR: /tmp/buildkit-mounts
          DEPS_CACHE_HIT: ${{ steps.buildkit-deps-cache.outputs.cache-hit }}
          NEXT_CACHE_HIT: ${{ steps.buildkit-next-cache.outputs.cache-hit }}
        run: |
          if [ -f scripts/persist-buildkit-mounts.sh ]; then
            bash scripts/persist-buildkit-mounts.sh
          else
            echo "::notice::Skipping BuildKit mount persistence because scripts/persist-buildkit-mounts.sh is absent at checked-out revision."
          fi

      - name: Load OCI Archive into Local Docker Daemon
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          OCI_TAR="/tmp/oci-${ARCH}.tar"
          if [ ! -f "$OCI_TAR" ]; then
            echo "::error::Missing exported OCI archive '${OCI_TAR}'."
            exit 1
          fi
          skopeo copy "oci-archive:${OCI_TAR}" "docker-daemon:wedding-website:latest"

      - name: Scan Native Container Image with Trivy
        timeout-minutes: 5
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wedding-website:latest
          format: 'sarif'
          output: 'trivy-results-${{ matrix.arch }}.sarif'
          ignore-unfixed: 'true'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'

      - name: Generate Native Container SPDX SBOM
        timeout-minutes: 5
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wedding-website:latest
          format: 'spdx-json'
          output: 'sbom-${{ matrix.arch }}.spdx.json'

      - name: Upload Trivy Scan Results to GitHub Code Scanning
        timeout-minutes: 5
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: always() && hashFiles(format('trivy-results-{0}.sarif', matrix.arch)) != ''
        with:
          sarif_file: 'trivy-results-${{ matrix.arch }}.sarif'
          category: 'trivy-${{ matrix.arch }}'

      - name: Run Native Container & Clean Database Smoke Test
        env:
          SKIP_IMAGE_BUILD: 'true'
          GHA_CACHE_SCOPE: app-${{ matrix.arch }}
        run: node scripts/test-container.mjs --container-migration

      - name: Compress Verified OCI Archive & Export Digest
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          OCI_TAR="/tmp/oci-${ARCH}.tar"
          if [ ! -f "$OCI_TAR" ]; then
            echo "::error::Missing verified OCI archive '${OCI_TAR}'."
            exit 1
          fi
          ARCHIVE_DIGEST=$(skopeo inspect --format '{{.Digest}}' "oci-archive:${OCI_TAR}" | tr -d '[:space:]')
          if [[ ! "$ARCHIVE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Invalid OCI manifest digest '${ARCHIVE_DIGEST}' inspected from '${OCI_TAR}'."
            exit 1
          fi
          if [ -n "$BUILD_DIGEST" ] && [ "$BUILD_DIGEST" != "$ARCHIVE_DIGEST" ]; then
            echo "::error::Buildx digest '${BUILD_DIGEST}' does not match inspected OCI archive digest '${ARCHIVE_DIGEST}'."
            exit 1
          fi
          mkdir -p /tmp/oci-handoff
          SBOM_FILE="sbom-${ARCH}.spdx.json"
          if [ ! -f "$SBOM_FILE" ] || ! jq -e '.spdxVersion and (.packages | type == "array")' "$SBOM_FILE" >/dev/null; then
            echo "::error::Missing or invalid SPDX JSON SBOM '${SBOM_FILE}' for architecture '${ARCH}'."
            exit 1
          fi
          cp "$SBOM_FILE" "/tmp/oci-handoff/sbom-${ARCH}.spdx.json"
          zstd -T0 -f "$OCI_TAR" -o "/tmp/oci-handoff/oci-${ARCH}.tar.zst"
          printf '%s\n' "$ARCHIVE_DIGEST" > "/tmp/oci-handoff/${ARCH}.digest"

      - name: Upload Verified OCI Archive Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-archive-${{ matrix.arch }}
          path: |
            /tmp/oci-handoff/oci-${{ matrix.arch }}.tar.zst
            /tmp/oci-handoff/${{ matrix.arch }}.digest
            /tmp/oci-handoff/sbom-${{ matrix.arch }}.spdx.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Merge Multi-Arch Index & Attest Provenance
    needs: [preflight, build]
    if: |
      !cancelled() &&
      needs.preflight.result == 'success' &&
      (needs.build.result == 'success' || (needs.preflight.outputs.promote_existing == 'true' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_uri: ${{ steps.meta.outputs.primary_uri }}
      image_tag: ${{ steps.meta.outputs.tag_name }}
      image_digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute Image Tag & Targets
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RAW_INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$INPUT_COMMIT_SHA" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid commit_sha '${INPUT_COMMIT_SHA}'. Must be a 40-character hexadecimal commit SHA."
            exit 1
          fi

          RESOLVED_SHA="${INPUT_COMMIT_SHA:-${GITHUB_SHA}}"

          if [ -n "$RAW_INPUT_TAG" ]; then
            if [[ ! "$RAW_INPUT_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
              echo "::error::Invalid image tag '${RAW_INPUT_TAG}'. Must only contain alphanumeric characters, underscores, periods, and hyphens."
              exit 1
            fi
            TAG_NAME="$RAW_INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]] && [ -n "${GITHUB_REF_NAME}" ]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[a-zA-Z0-9_.-]*$ ]]; then
              echo "::error::Invalid release tag '${GITHUB_REF_NAME}'. Must start with 'v' and only contain alphanumeric characters, underscores, periods, and hyphens."
              exit 1
            fi
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="${RESOLVED_SHA}"
          fi

          semver_lt() {
            local lhs="${1%%+*}"
            local rhs="${2%%+*}"
            local l_maj l_min l_pat r_maj r_min r_pat
            if [[ ! "$lhs" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              return 1
            fi
            l_maj="${BASH_REMATCH[1]}"
            l_min="${BASH_REMATCH[2]}"
            l_pat="${BASH_REMATCH[3]}"
            if [[ ! "$rhs" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              return 1
            fi
            r_maj="${BASH_REMATCH[1]}"
            r_min="${BASH_REMATCH[2]}"
            r_pat="${BASH_REMATCH[3]}"
            if (( 10#$l_maj != 10#$r_maj )); then
              (( 10#$l_maj < 10#$r_maj ))
              return $?
            fi
            if (( 10#$l_min != 10#$r_min )); then
              (( 10#$l_min < 10#$r_min ))
              return $?
            fi
            (( 10#$l_pat < 10#$r_pat ))
            return $?
          }

          STABLE_SEMVER_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9A-Za-z.-]+)?$'
          PUBLISH_LATEST="false"
          if [ -z "$RAW_INPUT_TAG" ] &&
             [ -z "$INPUT_COMMIT_SHA" ] &&
             [ "${EVENT_NAME:-push}" != "workflow_dispatch" ] &&
             [ "${EVENT_NAME:-push}" != "workflow_call" ] &&
             [[ "${GITHUB_REF}" == refs/tags/v* ]] &&
             [ -n "${GITHUB_REF_NAME}" ] &&
             [[ "${GITHUB_REF_NAME}" =~ $STABLE_SEMVER_PATTERN ]]; then
            IS_HIGHEST_STABLE="true"
            while IFS= read -r existing_tag; do
              [ -z "$existing_tag" ] && continue
              if [[ "$existing_tag" =~ $STABLE_SEMVER_PATTERN ]]; then
                if semver_lt "${GITHUB_REF_NAME}" "$existing_tag"; then
                  IS_HIGHEST_STABLE="false"
                  break
                fi
              fi
            done < <(git tag -l 'v*' 2>/dev/null || true)
            if [ "$IS_HIGHEST_STABLE" = "true" ]; then
              PUBLISH_LATEST="true"
            fi
          fi

          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO="ghcr.io/${REPO_LOWER}"
          GHCR_PRIMARY="${IMAGE_REPO}:${TAG_NAME}"
          TAGS="${GHCR_PRIMARY}"

          if [ -n "${RESOLVED_SHA}" ] && [ "${TAG_NAME}" != "${RESOLVED_SHA}" ]; then
            TAGS="${TAGS},${IMAGE_REPO}:${RESOLVED_SHA}"
          fi

          if [ "${PUBLISH_LATEST}" = "true" ]; then
            TAGS="${TAGS},${IMAGE_REPO}:latest"
          fi

          DOCKERHUB_REPO=""
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            DOCKERHUB_REPO="${DOCKERHUB_USERNAME}/wedding-website"
            TAGS="${TAGS},${DOCKERHUB_REPO}:${TAG_NAME}"
            if [ -n "${RESOLVED_SHA}" ] && [ "${TAG_NAME}" != "${RESOLVED_SHA}" ]; then
              TAGS="${TAGS},${DOCKERHUB_REPO}:${RESOLVED_SHA}"
            fi
            if [ "${PUBLISH_LATEST}" = "true" ]; then
              TAGS="${TAGS},${DOCKERHUB_REPO}:latest"
            fi
          fi

          echo "image_repository=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_repository=${DOCKERHUB_REPO}" >> "$GITHUB_OUTPUT"
          echo "revision=${RESOLVED_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "resolved_sha=${RESOLVED_SHA}" >> "$GITHUB_OUTPUT"
          echo "primary_uri=${GHCR_PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Download Verified OCI Archive Artifacts
        if: needs.preflight.outputs.promote_existing != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oci-archive-*
          merge-multiple: true
          path: /tmp/oci-handoff

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        timeout-minutes: 2
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        timeout-minutes: 2
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Per-Architecture SPDX SBOM Artifacts
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_EXISTING: ${{ needs.preflight.outputs.promote_existing }}
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_repository }}
          PROMOTED_AMD64_DIGEST: ${{ needs.preflight.outputs.amd64_digest }}
          PROMOTED_ARM64_DIGEST: ${{ needs.preflight.outputs.arm64_digest }}
          REVISION: ${{ steps.meta.outputs.revision }}
          RESOLVED_SHA: ${{ steps.meta.outputs.resolved_sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-artifact.yml
        run: |
          if [ "${PROMOTE_EXISTING:-false}" = "true" ]; then
            bash scripts/ghcr-release-promotion.sh extract-promoted-sboms
          fi

          for required_arch in amd64 arm64; do
            SBOM_FILE="/tmp/oci-handoff/sbom-${required_arch}.spdx.json"
            if [ ! -f "$SBOM_FILE" ] || ! jq -e '.spdxVersion and (.packages | type == "array")' "$SBOM_FILE" >/dev/null; then
              echo "::error::Missing or invalid SPDX JSON SBOM '${SBOM_FILE}' for architecture '${required_arch}'."
              exit 1
            fi
          done

      - name: Verify and Push Architecture OCI Archives
        timeout-minutes: 5
        env:
          PROMOTE_EXISTING: ${{ needs.preflight.outputs.promote_existing }}
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_repository }}
          DOCKERHUB_REPOSITORY: ${{ steps.meta.outputs.dockerhub_repository }}
          PROMOTED_INDEX_DIGEST: ${{ needs.preflight.outputs.source_index_digest }}
          PROMOTED_AMD64_DIGEST: ${{ needs.preflight.outputs.amd64_digest }}
          PROMOTED_ARM64_DIGEST: ${{ needs.preflight.outputs.arm64_digest }}
          REVISION: ${{ steps.meta.outputs.revision }}
          RESOLVED_SHA: ${{ steps.meta.outputs.resolved_sha }}
        run: |
          mkdir -p /tmp/digests

          if [ "${PROMOTE_EXISTING:-false}" = "true" ]; then
            bash scripts/ghcr-release-promotion.sh mirror-promoted-digests
            exit 0
          fi

          for required_arch in amd64 arm64; do
            DIGEST_FILE="/tmp/oci-handoff/${required_arch}.digest"
            COMPRESSED_ARCHIVE="/tmp/oci-handoff/oci-${required_arch}.tar.zst"
            DECOMPRESSED_ARCHIVE="/tmp/oci-handoff/oci-${required_arch}.tar"

            if [ ! -f "$DIGEST_FILE" ] || [ ! -f "$COMPRESSED_ARCHIVE" ]; then
              echo "::error::Missing OCI archive or digest artifact for architecture '${required_arch}'."
              exit 1
            fi

            EXPECTED_DIGEST=$(tr -d '[:space:]' < "$DIGEST_FILE")
            if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid expected digest '${EXPECTED_DIGEST}' for architecture '${required_arch}'."
              exit 1
            fi

            zstd -d -f "$COMPRESSED_ARCHIVE" -o "$DECOMPRESSED_ARCHIVE"
            ACTUAL_DIGEST=$(skopeo inspect --format '{{.Digest}}' "oci-archive:${DECOMPRESSED_ARCHIVE}" | tr -d '[:space:]')
            if [ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]; then
              echo "::error::OCI archive digest mismatch for '${required_arch}': expected '${EXPECTED_DIGEST}', inspected '${ACTUAL_DIGEST}'."
              exit 1
            fi

            printf '%s\n' "$EXPECTED_DIGEST" > "/tmp/digests/${required_arch}.digest"
          done

          for required_arch in amd64 arm64; do
            ARCH_DIGEST=$(tr -d '[:space:]' < "/tmp/digests/${required_arch}.digest")
            DECOMPRESSED_ARCHIVE="/tmp/oci-handoff/oci-${required_arch}.tar"

            skopeo copy --preserve-digests \
              "oci-archive:${DECOMPRESSED_ARCHIVE}" \
              "docker://${IMAGE_REPOSITORY}@${ARCH_DIGEST}"

            if [ -n "$DOCKERHUB_REPOSITORY" ]; then
              skopeo copy --preserve-digests \
                "oci-archive:${DECOMPRESSED_ARCHIVE}" \
                "docker://docker.io/${DOCKERHUB_REPOSITORY}@${ARCH_DIGEST}"
            fi
          done

      - name: Merge and Push Multi-Platform OCI Index
        id: merge
        timeout-minutes: 5
        env:
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_repository }}
          DOCKERHUB_REPOSITORY: ${{ steps.meta.outputs.dockerhub_repository }}
          PRIMARY_URI: ${{ steps.meta.outputs.primary_uri }}
          REVISION: ${{ steps.meta.outputs.revision }}
          TAGS: ${{ steps.meta.outputs.tags }}
          RESOLVED_SHA: ${{ steps.meta.outputs.resolved_sha }}
        run: |
          RAW_REVISION="${REVISION:-${RESOLVED_SHA:-${GITHUB_SHA:-}}}"
          SOURCE_REVISION=$(printf '%s' "$RAW_REVISION" | tr '[:upper:]' '[:lower:]')
          if [[ ! "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Missing or invalid 40-character source revision '${SOURCE_REVISION}' for multi-platform OCI index metadata."
            exit 1
          fi

          for required_arch in amd64 arm64; do
            if [ ! -f "/tmp/digests/${required_arch}.digest" ]; then
              echo "::error::Missing verified digest file for architecture '${required_arch}'."
              exit 1
            fi
          done

          AMD64_DIGEST=$(tr -d '[:space:]' < /tmp/digests/amd64.digest)
          ARM64_DIGEST=$(tr -d '[:space:]' < /tmp/digests/arm64.digest)

          for arch_digest in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            if [[ ! "$arch_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid per-architecture digest '${arch_digest}'."
              exit 1
            fi
          done

          IFS=',' read -r -a ALL_TAGS <<< "$TAGS"
          GHCR_TAG_ARGS=()
          DOCKERHUB_TAG_ARGS=()
          DOCKERHUB_PRIMARY_URI=""
          ANNOTATION_ARGS=("--annotation" "index:org.opencontainers.image.revision=${SOURCE_REVISION}")

          for tag_ref in "${ALL_TAGS[@]}"; do
            [ -z "$tag_ref" ] && continue
            if [[ "$tag_ref" == ghcr.io/* ]]; then
              GHCR_TAG_ARGS+=("--tag" "$tag_ref")
            else
              DOCKERHUB_TAG_ARGS+=("--tag" "$tag_ref")
              if [ -z "$DOCKERHUB_PRIMARY_URI" ]; then
                DOCKERHUB_PRIMARY_URI="$tag_ref"
              fi
            fi
          done

          docker buildx imagetools create \
            "${GHCR_TAG_ARGS[@]}" \
            "${ANNOTATION_ARGS[@]}" \
            "${IMAGE_REPOSITORY}@${AMD64_DIGEST}" \
            "${IMAGE_REPOSITORY}@${ARM64_DIGEST}"

          INDEX_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$PRIMARY_URI")
          if [[ ! "$INDEX_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Failed to resolve valid sha256 multi-platform index digest for '${PRIMARY_URI}' (got '${INDEX_DIGEST}')."
            exit 1
          fi

          RAW_INDEX=$(docker buildx imagetools inspect --raw "$PRIMARY_URI")
          for expected_arch in amd64 arm64; do
            if ! printf '%s' "$RAW_INDEX" | jq -e --arg arch "$expected_arch" '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch)' >/dev/null; then
              echo "::error::Published multi-platform index '${PRIMARY_URI}' is missing linux/${expected_arch} manifest."
              exit 1
            fi
          done

          RECORDED_REVISION=$(printf '%s' "$RAW_INDEX" | jq -r '.annotations["org.opencontainers.image.revision"] // empty' | tr '[:upper:]' '[:lower:]')
          if [ "$RECORDED_REVISION" != "$SOURCE_REVISION" ]; then
            echo "::error::Published multi-platform index '${PRIMARY_URI}' revision annotation '${RECORDED_REVISION}' does not match verified source revision '${SOURCE_REVISION}'."
            exit 1
          fi

          DOCKERHUB_INDEX_DIGEST=""
          if [ -n "$DOCKERHUB_REPOSITORY" ] && [ "${#DOCKERHUB_TAG_ARGS[@]}" -gt 0 ]; then
            docker buildx imagetools create \
              "${DOCKERHUB_TAG_ARGS[@]}" \
              "${ANNOTATION_ARGS[@]}" \
              "${DOCKERHUB_REPOSITORY}@${AMD64_DIGEST}" \
              "${DOCKERHUB_REPOSITORY}@${ARM64_DIGEST}"

            DOCKERHUB_INDEX_DIGEST=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$DOCKERHUB_PRIMARY_URI")
            if [[ ! "$DOCKERHUB_INDEX_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Failed to resolve valid sha256 multi-platform index digest for '${DOCKERHUB_PRIMARY_URI}' (got '${DOCKERHUB_INDEX_DIGEST}')."
              exit 1
            fi

            DOCKERHUB_RAW_INDEX=$(docker buildx imagetools inspect --raw "$DOCKERHUB_PRIMARY_URI")
            for expected_arch in amd64 arm64; do
              if ! printf '%s' "$DOCKERHUB_RAW_INDEX" | jq -e --arg arch "$expected_arch" '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $arch)' >/dev/null; then
                echo "::error::Published multi-platform index '${DOCKERHUB_PRIMARY_URI}' is missing linux/${expected_arch} manifest."
                exit 1
              fi
            done

            DOCKERHUB_RECORDED_REVISION=$(printf '%s' "$DOCKERHUB_RAW_INDEX" | jq -r '.annotations["org.opencontainers.image.revision"] // empty' | tr '[:upper:]' '[:lower:]')
            if [ "$DOCKERHUB_RECORDED_REVISION" != "$SOURCE_REVISION" ]; then
              echo "::error::Published multi-platform index '${DOCKERHUB_PRIMARY_URI}' revision annotation '${DOCKERHUB_RECORDED_REVISION}' does not match verified source revision '${SOURCE_REVISION}'."
              exit 1
            fi
          fi

          echo "amd64_digest=${AMD64_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=${ARM64_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${INDEX_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_digest=${DOCKERHUB_INDEX_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate Multi-Platform Index SPDX SBOM
        env:
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_repository }}
          AMD64_DIGEST: ${{ steps.merge.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.merge.outputs.arm64_digest }}
          INDEX_DIGEST: ${{ steps.merge.outputs.digest }}
          REVISION: ${{ steps.meta.outputs.revision }}
          RESOLVED_SHA: ${{ steps.meta.outputs.resolved_sha }}
        run: |
          SOURCE_REVISION=$(printf '%s' "${REVISION:-${RESOLVED_SHA:-${GITHUB_SHA:-}}}" | tr '[:upper:]' '[:lower:]')
          for required_arch in amd64 arm64; do
            SBOM_FILE="/tmp/oci-handoff/sbom-${required_arch}.spdx.json"
            if [ ! -f "$SBOM_FILE" ] || ! jq -e '.spdxVersion and (.packages | type == "array")' "$SBOM_FILE" >/dev/null; then
              echo "::error::Missing or invalid SPDX JSON SBOM '${SBOM_FILE}' for multi-platform index synthesis."
              exit 1
            fi
          done
          CREATED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --slurpfile amd64 /tmp/oci-handoff/sbom-amd64.spdx.json \
            --slurpfile arm64 /tmp/oci-handoff/sbom-arm64.spdx.json \
            --arg repo "$IMAGE_REPOSITORY" \
            --arg index_digest "${INDEX_DIGEST#sha256:}" \
            --arg amd64_digest "${AMD64_DIGEST#sha256:}" \
            --arg arm64_digest "${ARM64_DIGEST#sha256:}" \
            --arg revision "$SOURCE_REVISION" \
            --arg created "$CREATED_AT" \
            '
              def prefix_spdx(p):
                if (type == "string") then
                  if . == "SPDXRef-DOCUMENT" then "SPDXRef-Root-" + p
                  elif startswith("SPDXRef-") then "SPDXRef-" + p + "-" + ltrimstr("SPDXRef-")
                  else . end
                else . end;
              def rewrite_pkgs(doc; p):
                [ (doc.packages // [])[] | .SPDXID = (.SPDXID | prefix_spdx(p)) ];
              def rewrite_rels(doc; p):
                [
                  (doc.relationships // [])[]
                  | .spdxElementId = (.spdxElementId | prefix_spdx(p))
                  | .relatedSpdxElement = (.relatedSpdxElement | prefix_spdx(p))
                ];
              ($amd64[0]) as $a |
              ($arm64[0]) as $b |
              {
                spdxVersion: "SPDX-2.3",
                dataLicense: "CC0-1.0",
                SPDXID: "SPDXRef-DOCUMENT",
                name: ($repo + "@sha256:" + $index_digest),
                documentNamespace: ("https://spdx.org/spdxdocs/wedding-website-index-" + $revision + "-" + $index_digest),
                creationInfo: {
                  created: $created,
                  creators: ["Tool: trivy-spdx-index-merger"]
                },
                documentDescribes: ["SPDXRef-Index"],
                packages: (
                  [
                    {
                      name: $repo,
                      SPDXID: "SPDXRef-Index",
                      versionInfo: $revision,
                      downloadLocation: "NOASSERTION",
                      filesAnalyzed: false,
                      checksums: [{ algorithm: "SHA256", checksumValue: $index_digest }]
                    },
                    {
                      name: ($repo + "-linux-amd64"),
                      SPDXID: "SPDXRef-Root-amd64",
                      versionInfo: $revision,
                      downloadLocation: "NOASSERTION",
                      filesAnalyzed: false,
                      checksums: [{ algorithm: "SHA256", checksumValue: $amd64_digest }]
                    },
                    {
                      name: ($repo + "-linux-arm64"),
                      SPDXID: "SPDXRef-Root-arm64",
                      versionInfo: $revision,
                      downloadLocation: "NOASSERTION",
                      filesAnalyzed: false,
                      checksums: [{ algorithm: "SHA256", checksumValue: $arm64_digest }]
                    }
                  ]
                  + rewrite_pkgs($a; "amd64")
                  + rewrite_pkgs($b; "arm64")
                ),
                relationships: (
                  [
                    {
                      spdxElementId: "SPDXRef-DOCUMENT",
                      relationshipType: "DESCRIBES",
                      relatedSpdxElement: "SPDXRef-Index"
                    },
                    {
                      spdxElementId: "SPDXRef-Root-amd64",
                      relationshipType: "VARIANT_OF",
                      relatedSpdxElement: "SPDXRef-Index"
                    },
                    {
                      spdxElementId: "SPDXRef-Root-arm64",
                      relationshipType: "VARIANT_OF",
                      relatedSpdxElement: "SPDXRef-Index"
                    }
                  ]
                  + rewrite_rels($a; "amd64")
                  + rewrite_rels($b; "arm64")
                )
              }
            ' > /tmp/oci-handoff/sbom-index.spdx.json

      - name: Attest amd64 Build Provenance
        timeout-minutes: 3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image_repository }}
          subject-digest: ${{ steps.merge.outputs.amd64_digest }}
          push-to-registry: true

      - name: Attest arm64 Build Provenance
        timeout-minutes: 3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image_repository }}
          subject-digest: ${{ steps.merge.outputs.arm64_digest }}
          push-to-registry: true

      - name: Attest Build Provenance
        timeout-minutes: 3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image_repository }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Attest amd64 SPDX SBOM
        timeout-minutes: 3
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image_repository }}
          subject-digest: ${{ steps.merge.outputs.amd64_digest }}
          sbom-path: /tmp/oci-handoff/sbom-amd64.spdx.json
          push-to-registry: true

      - name: Attest arm64 SPDX SBOM
        timeout-minutes: 3
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image_repository }}
          subject-digest: ${{ steps.merge.outputs.arm64_digest }}
          sbom-path: /tmp/oci-handoff/sbom-arm64.spdx.json
          push-to-registry: true

      - name: Attest Index SPDX SBOM
        timeout-minutes: 3
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image_repository }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          sbom-path: /tmp/oci-handoff/sbom-index.spdx.json
          push-to-registry: true

      - name: Attest Docker Hub amd64 Build Provenance (optional)
        if: steps.meta.outputs.dockerhub_repository != '' && steps.merge.outputs.dockerhub_digest != ''
        timeout-minutes: 3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ steps.meta.outputs.dockerhub_repository }}
          subject-digest: ${{ steps.merge.outputs.amd64_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest Docker Hub arm64 Build Provenance (optional)
        if: steps.meta.outputs.dockerhub_repository != '' && steps.merge.outputs.dockerhub_digest != ''
        timeout-minutes: 3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ steps.meta.outputs.dockerhub_repository }}
          subject-digest: ${{ steps.merge.outputs.arm64_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest Docker Hub Build Provenance (optional)
        if: steps.meta.outputs.dockerhub_repository != '' && steps.merge.outputs.dockerhub_digest != ''
        timeout-minutes: 3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: docker.io/${{ steps.meta.outputs.dockerhub_repository }}
          subject-digest: ${{ steps.merge.outputs.dockerhub_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest Docker Hub amd64 SPDX SBOM (optional)
        if: steps.meta.outputs.dockerhub_repository != '' && steps.merge.outputs.dockerhub_digest != ''
        timeout-minutes: 3
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ steps.meta.outputs.dockerhub_repository }}
          subject-digest: ${{ steps.merge.outputs.amd64_digest }}
          sbom-path: /tmp/oci-handoff/sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest Docker Hub arm64 SPDX SBOM (optional)
        if: steps.meta.outputs.dockerhub_repository != '' && steps.merge.outputs.dockerhub_digest != ''
        timeout-minutes: 3
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ steps.meta.outputs.dockerhub_repository }}
          subject-digest: ${{ steps.merge.outputs.arm64_digest }}
          sbom-path: /tmp/oci-handoff/sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest Docker Hub Index SPDX SBOM (optional)
        if: steps.meta.outputs.dockerhub_repository != '' && steps.merge.outputs.dockerhub_digest != ''
        timeout-minutes: 3
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ steps.meta.outputs.dockerhub_repository }}
          subject-digest: ${{ steps.merge.outputs.dockerhub_digest }}
          sbom-path: /tmp/oci-handoff/sbom-index.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Summary
        env:
          PRIMARY_URI: ${{ steps.meta.outputs.primary_uri }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          echo "### 🚀 Release Artifact Published" >> "$GITHUB_STEP_SUMMARY"
          echo "**Primary Image URI:** \`${PRIMARY_URI}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${TAG_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
