name: Publish Release Artifact

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Custom image tag (defaults to commit SHA)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: 'Custom image tag'
        required: false
        type: string
    outputs:
      image_uri:
        description: 'Primary published image URI'
        value: ${{ jobs.publish.outputs.image_uri }}
      image_tag:
        description: 'Published image tag'
        value: ${{ jobs.publish.outputs.image_tag }}
      image_digest:
        description: 'Published image digest'
        value: ${{ jobs.publish.outputs.image_digest }}

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build & Publish Immutable OCI Image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.meta.outputs.primary_uri }}
      image_tag: ${{ steps.meta.outputs.tag_name }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute Image Tag & Targets
        id: meta
        run: |
          RAW_TAG="${{ inputs.tag_name }}"
          if [ -z "$RAW_TAG" ]; then
            TAG_NAME="${{ github.sha }}"
          else
            TAG_NAME="$RAW_TAG"
          fi

          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          GHCR_PRIMARY="ghcr.io/${REPO_LOWER}:${TAG_NAME}"
          TAGS="${GHCR_PRIMARY}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}:latest"
          fi

          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            TAGS="${TAGS},${{ secrets.DOCKERHUB_USERNAME }}/wedding-website:${TAG_NAME},${{ secrets.DOCKERHUB_USERNAME }}/wedding-website:latest"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "primary_uri=${GHCR_PRIMARY}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Local Container Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.primary_uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_uri }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy Scan Results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push Docker Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@c0744595e72338575084a4bf85ed76e1eb521ddf # v2.2.3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          echo "### 🚀 Release Artifact Published" >> $GITHUB_STEP_SUMMARY
          echo "**Primary Image URI:** \`${{ steps.meta.outputs.primary_uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.meta.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
