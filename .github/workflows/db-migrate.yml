name: Database Migration

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      confirm:
        description: 'Confirm database migration execution'
        required: true
        type: boolean
        default: false
      commit_sha:
        description: 'Commit SHA to check out for migrations'
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: 'Target Environment'
        required: false
        default: 'production'
        type: string
      commit_sha:
        description: 'Commit SHA to check out for migrations'
        required: false
        type: string
      confirm:
        description: 'Confirm database migration execution'
        required: false
        type: boolean
        default: true
      caller_holds_lock:
        description: 'Whether the calling workflow already holds the deploy-env-<environment> concurrency lock'
        required: false
        type: boolean
        default: false
    secrets:
      DATABASE_URL:
        required: true
      POSTGRES_URL_NON_POOLING:
        required: false
    outputs:
      schema_compatibility_status:
        description: 'Schema compatibility check status'
        value: ${{ jobs.migrate.outputs.schema_compatibility_status }}

concurrency:
  group: ${{ inputs.caller_holds_lock && format('caller-db-migrate-{0}-{1}-{2}', inputs.environment || 'production', github.run_id, github.run_attempt) || format('deploy-env-{0}', inputs.environment || 'production') }}
  cancel-in-progress: false
  queue: max

jobs:
  preflight:
    name: Verify Migration Release Target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    outputs:
      target_sha: ${{ steps.verify_target.outputs.target_sha }}
    steps:
      - name: Validate Migration Inputs
        timeout-minutes: 1
        env:
          CONFIRM: ${{ inputs.confirm && 'true' || 'false' }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ "$CONFIRM" != "true" ]; then
            echo "::error::Database migration execution aborted for environment '${TARGET_ENV}': 'confirm' input must be set to true."
            echo "### 🛑 Database Migration Aborted (Unconfirmed)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Target Environment:** \`${TARGET_ENV}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Reason:** Manual dispatch requires \`confirm: true\` before mutating the target PostgreSQL database." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "${INPUT_COMMIT_SHA:-}" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid commit_sha '${INPUT_COMMIT_SHA}'. Must be a 40-character hexadecimal commit SHA."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Release Commit Ancestry & CI Status
        id: verify_target
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR_LOGIN: ${{ github.actor }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          CURRENT_SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-artifact.yml
        run: |
          RESOLVED_SHA="${INPUT_COMMIT_SHA:-${CURRENT_SHA}}"
          VERIFIED_ROW=$(bash ./scripts/verify-release-target.sh --target-sha "$RESOLVED_SHA")
          IFS='|' read -r TARGET_SHA VERIFICATION_SOURCE MATCHED_TAG VERIFIED_CI_RUN_ID <<< "$VERIFIED_ROW"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "Verified migration release commit ${TARGET_SHA} (source: ${VERIFICATION_SOURCE}, tag: ${MATCHED_TAG:-none}, CI run: ${VERIFIED_CI_RUN_ID})."

  migrate:
    name: Execute Database Migrations
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'production' }}
    outputs:
      schema_compatibility_status: ${{ steps.lint_migrations.outputs.schema_compatibility_status }}
    steps:
      - name: Verify Manual Migration Confirmation
        id: confirm_gate
        env:
          CONFIRM: ${{ inputs.confirm && 'true' || 'false' }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ "$CONFIRM" != "true" ]; then
            echo "::error::Database migration execution aborted for environment '${TARGET_ENV}': 'confirm' input must be set to true."
            echo "### 🛑 Database Migration Aborted (Unconfirmed)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Target Environment:** \`${TARGET_ENV}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Reason:** Manual dispatch requires \`confirm: true\` before mutating the target PostgreSQL database." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -n "${INPUT_COMMIT_SHA:-}" ] && [[ ! "$INPUT_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid commit_sha '${INPUT_COMMIT_SHA}'. Must be a 40-character hexadecimal commit SHA."
            exit 1
          fi

      - name: Record Target Environment (${{ inputs.environment || 'production' }})
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          echo "Target migration environment: ${TARGET_ENV}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Align Migration Workspace to Target Commit SHA
        if: needs.preflight.outputs.target_sha != '' || inputs.commit_sha != ''
        env:
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha || inputs.commit_sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "${HEAD_SHA,,}" != "${TARGET_SHA,,}" ]; then
            git checkout --detach "$TARGET_SHA"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run preflight migration linter
        id: lint_migrations
        run: |
          echo "Executing preflight schema compatibility linting..."
          npm run lint:migrations
          echo "schema_compatibility_status=compatible" >> $GITHUB_OUTPUT
          echo "### 🟢 Preflight Schema Compatibility Verified" >> $GITHUB_STEP_SUMMARY
          echo "- **Linter Check:** \`PASSED\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Compatibility Status:** \`COMPATIBLE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **N-1 Safe:** \`true\`" >> $GITHUB_STEP_SUMMARY

      - name: Verify DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          if [[ ! "$TARGET_ENV" =~ ^(production|staging|development)$ ]]; then
            echo "::error::Invalid target environment '${TARGET_ENV}'. Must be one of: production, staging, development."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing mandatory DATABASE_URL secret for environment '${TARGET_ENV}'."
            exit 1
          fi
          if [[ ! "$DATABASE_URL" =~ ^postgres(ql)?:// ]]; then
            echo "::error::Invalid format for DATABASE_URL. Must start with postgres:// or postgresql://"
            exit 1
          fi
          validate_pg_secret_env() {
            local var_name="$1"
            PG_SECRET_VAR="$var_name" node --input-type=module -e '
              import fs from "node:fs";
              import path from "node:path";
              import { pathToFileURL } from "node:url";
              const varName = process.env.PG_SECRET_VAR ?? "DATABASE_URL";
              const raw = (process.env[varName] ?? "").trim();
              const helperPath = path.resolve("src/lib/postgres-url.js");
              if (fs.existsSync(helperPath)) {
                const { parsePostgresUrl } = await import(pathToFileURL(helperPath).href);
                parsePostgresUrl(raw);
              } else {
                if (!/^(postgres|postgresql):\/\//.test(raw) || /[\x00-\x20\x7f#]/.test(raw)) {
                  process.exit(1);
                }
                const afterScheme = raw.replace(/^(postgres|postgresql):\/\//, "");
                const qIdx = afterScheme.indexOf("?");
                const beforeQ = qIdx === -1 ? afterScheme : afterScheme.slice(0, qIdx);
                const query = qIdx === -1 ? "" : afterScheme.slice(qIdx + 1);
                const sIdx = beforeQ.indexOf("/");
                const authority = sIdx === -1 ? beforeQ : beforeQ.slice(0, sIdx);
                const pathPart = sIdx === -1 ? "" : beforeQ.slice(sIdx);
                const atIdx = authority.indexOf("@");
                if (atIdx !== authority.lastIndexOf("@")) process.exit(1);
                const userinfo = atIdx === -1 ? null : authority.slice(0, atIdx);
                const hostPort = atIdx === -1 ? authority : authority.slice(atIdx + 1);
                const host = hostPort.startsWith("[") ? hostPort : hostPort.split(":")[0];
                if (!hostPort.startsWith("[") && hostPort.includes(":")) {
                  const portStr = hostPort.slice(hostPort.indexOf(":") + 1);
                  if (!/^[1-9]\d{0,4}$/.test(portStr) || Number(portStr) > 65535) process.exit(1);
                }
                const params = new URLSearchParams(query);
                const qHost = params.get("host") ?? "";
                if (params.has("host") && (!qHost || /^\/+$/.test(qHost))) process.exit(1);
                const validSocket = qHost.startsWith("/") && qHost.length > 1 && !/^\/+$/.test(qHost);
                let normalized = raw;
                if (!host) {
                  if (!validSocket) process.exit(1);
                  if (!pathPart || pathPart === "/") process.exit(1);
                  const scheme = raw.startsWith("postgresql://") ? "postgresql" : "postgres";
                  const portSuffix = hostPort.includes(":") ? ":" + hostPort.split(":")[1] : "";
                  normalized = `${scheme}://${userinfo !== null ? userinfo + "@" : ""}localhost${portSuffix}${pathPart}${qIdx === -1 ? "" : "?" + query}`;
                }
                const parsed = new URL(normalized);
                if (!parsed.hostname) process.exit(1);
              }
            ' 2>/dev/null
          }
          if ! validate_pg_secret_env DATABASE_URL; then
            echo "::error::Invalid format for DATABASE_URL. Must be a valid PostgreSQL URI with a non-empty host or ?host=/... Unix socket path."
            exit 1
          fi
          if [ -n "${POSTGRES_URL_NON_POOLING:-}" ]; then
            if [[ ! "$POSTGRES_URL_NON_POOLING" =~ ^postgres(ql)?:// ]]; then
              echo "::error::Invalid format for POSTGRES_URL_NON_POOLING. Must start with postgres:// or postgresql://"
              exit 1
            fi
            if ! validate_pg_secret_env POSTGRES_URL_NON_POOLING; then
              echo "::error::Invalid format for POSTGRES_URL_NON_POOLING. Must be a valid PostgreSQL URI with a non-empty host or ?host=/... Unix socket path."
              exit 1
            fi
          fi

      - name: Pre-flight schema migration check and summary
        id: status_check
        if: steps.confirm_gate.outcome == 'success'
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          PGOPTIONS: "-c lock_timeout=5000ms -c statement_timeout=30000ms"
        run: |
          if [ -z "${POSTGRES_URL_NON_POOLING:-}" ]; then
            unset POSTGRES_URL_NON_POOLING
          elif [ -f "src/lib/postgres-url.js" ]; then
            POSTGRES_URL_NON_POOLING="$(node --input-type=module -e '
              import path from "node:path";
              import { pathToFileURL } from "node:url";
              const { isValidPostgresUrl, normalizePostgresUrl } = await import(pathToFileURL(path.resolve("src/lib/postgres-url.js")).href);
              const raw = (process.env.POSTGRES_URL_NON_POOLING ?? "").trim();
              process.stdout.write(isValidPostgresUrl(raw) ? normalizePostgresUrl(raw) : raw);
            ')"
            export POSTGRES_URL_NON_POOLING
          fi
          echo "Verifying PostgreSQL TLS handshake and executing pre-flight Prisma migration status audit & SQL DDL summary..."
          if ! TLS_GATE_ERR="$(
            node --input-type=module -e '
              import fs from "node:fs";
              import path from "node:path";
              import { pathToFileURL } from "node:url";
              const helperPath = path.resolve("src/lib/postgres-url.js");
              if (fs.existsSync(helperPath)) {
                const { resolveDirectMigrationPostgresUrl, verifyPostgresTlsHandshake } = await import(
                  pathToFileURL(helperPath).href
                );
                const targetUrl = resolveDirectMigrationPostgresUrl(
                  process.env.DATABASE_URL ?? "",
                  process.env.POSTGRES_URL_NON_POOLING
                );
                try {
                  await verifyPostgresTlsHandshake(targetUrl);
                } catch (err) {
                  console.error(err instanceof Error ? err.message : String(err));
                  process.exit(1);
                }
              }
            ' 2>&1 >/dev/null
          )"; then
            echo "::error::Pre-flight PostgreSQL TLS handshake check failed: ${TLS_GATE_ERR}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## 🗄️ Pre-Flight Database Migration Summary"
                echo "- **Environment:** \`${TARGET_ENVIRONMENT:-production}\`"
                echo "- **Pre-Flight Gate:** \`FAILED\` ❌"
                echo "- **Error:** Pre-flight PostgreSQL TLS handshake check failed: \`${TLS_GATE_ERR}\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          npx tsx scripts/preflight-migration-summary.ts --require-db

      - name: Run Prisma Migrate Deploy
        id: migrate
        if: steps.confirm_gate.outcome == 'success'
        timeout-minutes: 5
        env:
          CONFIRM: ${{ inputs.confirm && 'true' || 'false' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          PGOPTIONS: "-c lock_timeout=5000ms -c statement_timeout=30000ms"
        run: |
          if [ "${CONFIRM:-false}" != "true" ]; then
            echo "::error::Database migration execution aborted: 'confirm' input must be set to true."
            exit 1
          fi
          if [ -z "${POSTGRES_URL_NON_POOLING:-}" ]; then
            unset POSTGRES_URL_NON_POOLING
          elif [ -f "src/lib/postgres-url.js" ]; then
            POSTGRES_URL_NON_POOLING="$(node --input-type=module -e '
              import path from "node:path";
              import { pathToFileURL } from "node:url";
              const { isValidPostgresUrl, normalizePostgresUrl } = await import(pathToFileURL(path.resolve("src/lib/postgres-url.js")).href);
              const raw = (process.env.POSTGRES_URL_NON_POOLING ?? "").trim();
              process.stdout.write(isValidPostgresUrl(raw) ? normalizePostgresUrl(raw) : raw);
            ')"
            export POSTGRES_URL_NON_POOLING
          fi
          if ! TLS_DEPLOY_ERR="$(
            node --input-type=module -e '
              import fs from "node:fs";
              import path from "node:path";
              import { pathToFileURL } from "node:url";
              const helperPath = path.resolve("src/lib/postgres-url.js");
              if (fs.existsSync(helperPath)) {
                const { resolveDirectMigrationPostgresUrl, verifyPostgresTlsHandshake } = await import(
                  pathToFileURL(helperPath).href
                );
                const targetUrl = resolveDirectMigrationPostgresUrl(
                  process.env.DATABASE_URL ?? "",
                  process.env.POSTGRES_URL_NON_POOLING
                );
                try {
                  await verifyPostgresTlsHandshake(targetUrl);
                } catch (err) {
                  console.error(err instanceof Error ? err.message : String(err));
                  process.exit(1);
                }
              }
            ' 2>&1 >/dev/null
          )"; then
            echo "::error::Pre-migration PostgreSQL TLS handshake check failed: ${TLS_DEPLOY_ERR}"
            exit 1
          fi
          echo "Executing database migrations..."
          npx prisma migrate deploy

      - name: Handle Migration Failure
        if: failure() && steps.confirm_gate.outcome == 'success'
        run: |
          echo "::error::Database migration failed during execution!"
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## ❌ Database Migration Failure Signaling & Rollback Guidance

          The database migration workflow failed during preflight checks or migration execution. To prevent schema instability and partial deployments:

          ### Diagnostic Steps
          1. **Preflight Linter (`lint:migrations`)**: If preflight schema linting failed, ensure all migration SQL statements in `prisma/migrations/` avoid destructive DDL operations (e.g. `DROP TABLE`, `DROP COLUMN`, `NOT NULL` column additions without defaults) or include `-- allow-destructive: <reason>` annotations.
          2. **Database Verification & Status**: Check database connectivity, `DATABASE_URL` secret formatting, and verify whether `npx prisma migrate status` reported schema drift or unapplied/failed migration state.
          3. **Migration Deploy & Session Timeouts**: Review workflow logs above for Prisma SQL error codes, lock timeout (`lock_timeout=5000ms`), or statement timeout (`statement_timeout=30000ms`) failures.

          ### Rollback & Remediation Procedure
          If the schema was partially applied or marked failed in `_prisma_migrations`:
          1. Inspect `_prisma_migrations` table in your target database.
          2. If a migration needs to be rolled back or marked resolved, execute the Prisma resolution command locally or via administrative CLI:
             ```bash
             # Mark a failed migration as rolled back:
             npx prisma migrate resolve --rolled-back "<failed_migration_name>"

             # OR mark a migration as applied if changes were manually verified:
             npx prisma migrate resolve --applied "<failed_migration_name>"
             ```
          3. Re-run `Database Migration` workflow only after confirming database state is healthy.
          4. Do **NOT** proceed with application deployment until migration issues are resolved.
          EOF
          exit 1

      - name: Summary
        if: success()
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          echo "### ✅ Database Migrations Successfully Applied" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Environment:** \`${TARGET_ENV}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Schema Compatibility Status:** \`COMPATIBLE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **N-1 Container Compatibility:** \`VERIFIED\`" >> "$GITHUB_STEP_SUMMARY"
