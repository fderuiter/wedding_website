name: Database Migration

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development
      confirm:
        description: 'Confirm database migration execution'
        required: true
        type: boolean
        default: true
  workflow_call:
    inputs:
      environment:
        description: 'Target Environment'
        required: false
        default: 'production'
        type: string
    secrets:
      DATABASE_URL:
        required: true

jobs:
  migrate:
    name: Execute Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run preflight migration linter
        id: lint_migrations
        run: |
          echo "Executing preflight schema compatibility linting..."
          npm run lint:migrations

      - name: Verify DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing mandatory DATABASE_URL secret for environment '${{ inputs.environment || 'production' }}'."
            exit 1
          fi
          if [[ ! "$DATABASE_URL" =~ ^postgres(ql)?:// ]]; then
            echo "::error::Invalid format for DATABASE_URL. Must start with postgres:// or postgresql://"
            exit 1
          fi

      - name: Check pending migrations
        id: status_check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Checking Prisma migration status..."
          npx prisma migrate status

      - name: Run Prisma Migrate Deploy
        id: migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGOPTIONS: "-c lock_timeout=5000ms -c statement_timeout=30000ms"
        run: |
          echo "Executing database migrations..."
          npx prisma migrate deploy

      - name: Handle Migration Failure
        if: failure()
        run: |
          echo "::error::Database migration failed during execution!"
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## ❌ Database Migration Failure Signaling & Rollback Guidance

          The database migration workflow failed during preflight checks or migration execution. To prevent schema instability and partial deployments:

          ### Diagnostic Steps
          1. **Preflight Linter (`lint:migrations`)**: If preflight schema linting failed, ensure all migration SQL statements in `prisma/migrations/` avoid destructive DDL operations (e.g. `DROP TABLE`, `DROP COLUMN`) or include `-- allow-destructive: <reason>` annotations.
          2. **Database Verification & Status**: Check database connectivity, `DATABASE_URL` secret formatting, and verify whether `npx prisma migrate status` reported schema drift or unapplied/failed migration state.
          3. **Migration Deploy & Session Timeouts**: Review workflow logs above for Prisma SQL error codes, lock timeout (`lock_timeout=5000ms`), or statement timeout (`statement_timeout=30000ms`) failures.

          ### Rollback & Remediation Procedure
          If the schema was partially applied or marked failed in `_prisma_migrations`:
          1. Inspect `_prisma_migrations` table in your target database.
          2. If a migration needs to be rolled back or marked resolved, execute the Prisma resolution command locally or via administrative CLI:
             ```bash
             # Mark a failed migration as rolled back:
             npx prisma migrate resolve --rolled-back "<failed_migration_name>"

             # OR mark a migration as applied if changes were manually verified:
             npx prisma migrate resolve --applied "<failed_migration_name>"
             ```
          3. Re-run `Database Migration` workflow only after confirming database state is healthy.
          4. Do **NOT** proceed with application deployment until migration issues are resolved.
          EOF
          exit 1

      - name: Summary
        if: success()
        run: |
          echo "### ✅ Database Migrations Successfully Applied" >> $GITHUB_STEP_SUMMARY
          echo "Target Environment: \`${{ inputs.environment || 'production' }}\`" >> $GITHUB_STEP_SUMMARY
