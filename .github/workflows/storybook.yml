name: Storybook Static Showcase

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      storybook_base_path:
        description: 'Pre-resolved GitHub Pages Storybook base path from caller'
        required: false
        type: string
    outputs:
      storybook_base_path:
        description: 'Resolved GitHub Pages Storybook base path'
        value: ${{ jobs.build.outputs.storybook_base_path }}
  workflow_dispatch:

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
  queue: max

jobs:
  build:
    name: Build & Audit Static Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      storybook_base_path: ${{ steps.base-path.outputs.storybook_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve Pages base path
        id: base-path
        timeout-minutes: 2
        env:
          INPUT_STORYBOOK_BASE: ${{ inputs.storybook_base_path }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${INPUT_STORYBOOK_BASE:-}" ]; then
            STORYBOOK_BASE=$(printf '%s' "$INPUT_STORYBOOK_BASE" | sed 's:/*$::')
            if [ -z "$STORYBOOK_BASE" ]; then
              STORYBOOK_BASE="/storybook"
            fi
          else
            PAGES_API_JSON=""
            if [ -n "${GH_REPO:-}" ] && [ -n "${GITHUB_TOKEN:-}" ]; then
              PAGES_API_JSON=$(curl -fsSL --connect-timeout 5 --max-time 15 \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GH_REPO}/pages" 2>/dev/null || true)
            fi
            RESOLVED_LINES=$(PAGES_API_JSON="$PAGES_API_JSON" node scripts/build-pages-bundle.mjs --resolve-base-paths)
            STORYBOOK_BASE=""
            while IFS='=' read -r key val; do
              case "$key" in
                storybook_base_path) STORYBOOK_BASE="$val" ;;
              esac
            done <<< "$RESOLVED_LINES"
          fi
          echo "storybook_base=${STORYBOOK_BASE}" >> "$GITHUB_OUTPUT"

      - name: Cache Storybook Webpack build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/webpack
            node_modules/.cache/storybook
          key: ${{ runner.os }}-storybook-${{ steps.base-path.outputs.storybook_base }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('.storybook/**', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-storybook-${{ steps.base-path.outputs.storybook_base }}-${{ hashFiles('package-lock.json') }}-

      - name: Build Storybook Static Showcase
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base-path.outputs.storybook_base }}
        run: npm run build-storybook

      - name: Cache Playwright Chromium browser
        id: playwright-chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium Browser
        if: steps.playwright-chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium OS Dependencies
        if: steps.playwright-chromium-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Audit Storybook stories runtime and WCAG 2.2 AA accessibility
        timeout-minutes: 10
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base-path.outputs.storybook_base }}
        run: npm run test:e2e:storybook

      - name: Upload Storybook A11y Violations
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-a11y-violations
          path: test-results/storybook-a11y-violations.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Storybook Playwright Traces
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-storybook-traces
          path: test-results/playwright-storybook/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate and Verify Storybook Bundle Checksums
        run: |
          bash scripts/release-integrity.sh generate-tree-sums storybook-static
          bash scripts/release-integrity.sh verify-tree-sums storybook-static

      - name: Upload Storybook Static Showcase Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: storybook-static/
          if-no-files-found: error
          retention-days: 7
  attest-storybook:
    name: Attest Storybook Bundle Provenance
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download Storybook Static Showcase Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: /tmp/storybook-static

      - name: Verify Storybook SHA256SUMS Before Signing
        run: |
          if [ -n "$(find /tmp/storybook-static -type l -print -quit 2>/dev/null || true)" ]; then
            echo "::error::Symbolic links are forbidden inside storybook-static."
            exit 1
          fi
          if [ ! -s /tmp/storybook-static/SHA256SUMS ]; then
            echo "::error::Missing or empty /tmp/storybook-static/SHA256SUMS."
            exit 1
          fi
          (
            cd /tmp/storybook-static
            sha256sum --check --strict SHA256SUMS
          )
          ACTUAL_FILES=$(cd /tmp/storybook-static && find . -type f ! -path './SHA256SUMS' -print | sed 's|^\./||' | LC_ALL=C sort)
          MANIFEST_FILES=$(sed 's/^[a-f0-9]\{64\}  //' /tmp/storybook-static/SHA256SUMS | LC_ALL=C sort)
          if [ "$ACTUAL_FILES" != "$MANIFEST_FILES" ]; then
            echo "::error::Unindexed or mismatched files detected in storybook-static."
            exit 1
          fi

      - name: Attest Storybook Bundle Checksums Provenance
        timeout-minutes: 3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/storybook-static/SHA256SUMS
