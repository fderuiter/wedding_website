name: Storybook Static Showcase

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      storybook_base_path:
        description: 'Resolved GitHub Pages Storybook base path'
        value: ${{ jobs.build.outputs.storybook_base_path }}
  workflow_dispatch:

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
  queue: max

jobs:
  build:
    name: Build & Audit Static Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      storybook_base_path: ${{ steps.base-path.outputs.storybook_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Resolve Pages base path
        id: base-path
        timeout-minutes: 2
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          OWNER="${GH_REPO%%/*}"
          REPO="${GH_REPO#*/}"
          PAGES_BASE="/${REPO}"
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ] || [ -f "CNAME" ] || [ -f "public/CNAME" ] || [ -f "docs-portal/public/CNAME" ]; then
            PAGES_BASE=""
          elif PAGES_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/pages" 2>/dev/null); then
            RESOLVED_BASE=$(printf '%s' "$PAGES_JSON" | node -e '
              const fs = require("node:fs");
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              if (data.cname) {
                process.stdout.write("");
              } else if (data.html_url) {
                const pathname = new URL(data.html_url).pathname.replace(/\/+$/, "");
                process.stdout.write(pathname);
              }
            ')
            PAGES_BASE="$RESOLVED_BASE"
          fi
          NORMALIZED_PAGES_BASE=$(printf '%s' "$PAGES_BASE" | sed 's:/*$::')
          STORYBOOK_BASE="${NORMALIZED_PAGES_BASE}/storybook"
          echo "pages_base=${NORMALIZED_PAGES_BASE}" >> "$GITHUB_OUTPUT"
          echo "storybook_base=${STORYBOOK_BASE}" >> "$GITHUB_OUTPUT"

      - name: Cache Storybook Webpack build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/webpack
            node_modules/.cache/storybook
          key: ${{ runner.os }}-storybook-${{ steps.base-path.outputs.storybook_base }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('.storybook/**', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-storybook-${{ steps.base-path.outputs.storybook_base }}-${{ hashFiles('package-lock.json') }}-

      - name: Build Storybook Static Showcase
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base-path.outputs.storybook_base }}
        run: npm run build-storybook

      - name: Cache Playwright Chromium browser
        id: playwright-chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium Browser
        if: steps.playwright-chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium OS Dependencies
        if: steps.playwright-chromium-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Audit Storybook stories runtime and WCAG 2.2 AA accessibility
        timeout-minutes: 10
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base-path.outputs.storybook_base }}
        run: npm run test:e2e:storybook

      - name: Upload Storybook A11y Violations
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-a11y-violations
          path: test-results/storybook-a11y-violations.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Storybook Playwright Traces
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-storybook-traces
          path: test-results/playwright-storybook/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Storybook Static Showcase Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: storybook-static/
          if-no-files-found: error
          retention-days: 7
