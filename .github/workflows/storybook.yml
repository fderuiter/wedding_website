name: Storybook Static Showcase

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: storybook
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build Static Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Storybook Webpack build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/webpack
            node_modules/.cache/storybook
          key: ${{ runner.os }}-storybook-${{ hashFiles('package-lock.json') }}-${{ hashFiles('.storybook/**', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-storybook-${{ hashFiles('package-lock.json') }}-

      - name: Build Storybook Static Showcase
        run: npm run build-storybook

      - name: Upload Storybook Static Showcase Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: storybook-static/
          if-no-files-found: error
          retention-days: 7

