permissions:
  contents: read

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      db_image: ${{ steps.resolve-db-image.outputs.db_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unified Static Quality Checks
        run: npm run check:static -- --skip-doc-sync --skip-action-pins

      - name: Security Dependency Audit
        timeout-minutes: 5
        run: npm run check:audit

      - name: Check Third-Party Action Pin Commit SHAs
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check:action-pins -- --verify-upstream

      - name: Export Verified PostgreSQL Service Image Digest
        id: resolve-db-image
        run: |
          DB_IMAGE=$(node -e '
            const fs = require("fs");
            const { parseDocument } = require("yaml");
            const doc = parseDocument(fs.readFileSync("docker-compose.yml", "utf8"), { version: "1.2", strict: true });
            const image = String(doc.getIn(["services", "db", "image"]) || "").trim();
            if (!/^postgres:[^\s@]+@sha256:[a-f0-9]{64}$/.test(image)) {
              console.error("Invalid or unpinned services.db.image in docker-compose.yml:", image);
              process.exit(1);
            }
            process.stdout.write(image);
          ')
          echo "db_image=${DB_IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Cache TypeScript and ESLint incremental state
        id: ts-eslint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
            tsconfig.build.tsbuildinfo
            tsconfig.scripts.tsbuildinfo
            tsconfig.e2e.tsbuildinfo
            tsconfig.test.tsbuildinfo
          key: ${{ runner.os }}-ts-eslint-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'eslint.config.mjs', 'eslint-rules/**', 'prisma/schema.prisma') }}-${{ hashFiles('next.config.ts', 'playwright*.config.ts', 'prisma.config.ts', '*.mts', '*.js', '*.mjs', '*.cjs', 'src/**', 'scripts/**', 'e2e/**', '.storybook/**', 'docs-portal/**', '.githooks/**', 'docker/**') }}
          restore-keys: |
            ${{ runner.os }}-ts-eslint-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'eslint.config.mjs', 'eslint-rules/**', 'prisma/schema.prisma') }}-

      - name: Run Parallel Typecheck, ESLint, and Knip Analysis
        timeout-minutes: 10
        env:
          CACHE_HIT: ${{ steps.ts-eslint-cache.outputs.cache-hit }}
        run: |
          node -e '
            const fs = require("fs");
            const target = process.env.CACHE_HIT === "true" ? new Date() : new Date("2000-01-01T00:00:00Z");
            for (const file of fs.readdirSync(".")) {
              if (file.endsWith(".tsbuildinfo") && fs.lstatSync(file).isFile()) {
                fs.utimesSync(file, target, target);
              }
            }
          '

          LOG_DIR=$(mktemp -d)
          trap 'rm -rf "$LOG_DIR"' EXIT

          npm run typecheck >"$LOG_DIR/typecheck.log" 2>&1 &
          PID_TYPECHECK=$!
          npm run lint >"$LOG_DIR/lint.log" 2>&1 &
          PID_LINT=$!
          npm run lint:unused >"$LOG_DIR/knip.log" 2>&1 &
          PID_KNIP=$!

          FAILED=0
          for ENTRY in "TypeScript Typecheck:$PID_TYPECHECK:$LOG_DIR/typecheck.log" \
                       "ESLint Code Linting:$PID_LINT:$LOG_DIR/lint.log" \
                       "Knip Unused Export Analysis:$PID_KNIP:$LOG_DIR/knip.log"; do
            LABEL="${ENTRY%%:*}"
            REST="${ENTRY#*:}"
            PID="${REST%%:*}"
            LOG_FILE="${REST#*:}"
            if ! wait "$PID"; then
              echo "::group::❌ $LABEL"
              cat "$LOG_FILE"
              echo "::endgroup::"
              kill "$PID_TYPECHECK" "$PID_LINT" "$PID_KNIP" 2>/dev/null || true
              FAILED=1
              break
            fi
            echo "::group::✅ $LABEL"
            cat "$LOG_FILE"
            echo "::endgroup::"
          done

          wait 2>/dev/null || true
          exit "$FAILED"

      - name: Verify Documentation and Architecture Sync
        id: verify-docs
        timeout-minutes: 10
        run: |
          DOC_LOG_DIR=$(mktemp -d)
          trap 'rm -rf "$DOC_LOG_DIR"' EXIT

          npx tsx scripts/generate-openapi.ts >"$DOC_LOG_DIR/openapi.log" 2>&1 &
          PID_OPENAPI=$!
          npx tsx scripts/generate-docs.ts --skip-openapi >"$DOC_LOG_DIR/docs.log" 2>&1 &
          PID_DOCS=$!

          GEN_FAILED=0
          if ! wait "$PID_OPENAPI"; then
            cat "$DOC_LOG_DIR/openapi.log"
            kill "$PID_DOCS" 2>/dev/null || true
            GEN_FAILED=1
          else
            cat "$DOC_LOG_DIR/openapi.log"
          fi
          if ! wait "$PID_DOCS"; then
            cat "$DOC_LOG_DIR/docs.log"
            GEN_FAILED=1
          else
            cat "$DOC_LOG_DIR/docs.log"
          fi
          if [ "$GEN_FAILED" -ne 0 ]; then
            exit 1
          fi

          # Capture status before creating any files
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "$STATUS" > raw_drift.txt
            awk '{print $2}' raw_drift.txt > drift_files.txt
            echo "Drift detected in the following files:"
            cat drift_files.txt
            exit 1
          fi

      - name: Package Documentation Drift Status
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.verify-docs.outcome != 'skipped'
        env:
          VERIFY_DOCS_OUTCOME: ${{ steps.verify-docs.outcome }}
        run: |
          mkdir -p /tmp/doc-drift
          printf '%s\n' "$VERIFY_DOCS_OUTCOME" > /tmp/doc-drift/outcome.txt
          if [ -f "drift_files.txt" ]; then
            cp drift_files.txt /tmp/doc-drift/drift_files.txt
          fi

      - name: Upload Documentation Drift Status Artifact
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.verify-docs.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-drift-status
          path: /tmp/doc-drift/
          retention-days: 1
          if-no-files-found: ignore

      - name: Write Documentation Drift Report to Job Summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          VERIFY_DOCS_OUTCOME: ${{ steps.verify-docs.outcome }}
        run: |
          if [ "$VERIFY_DOCS_OUTCOME" = "failure" ]; then
            if [ -f "drift_files.txt" ]; then
              {
                echo "### ⚠️ Documentation Drift Detected"
                echo ""
                echo "The committed documentation files do not match the current codebase. The following files are out of sync:"
                echo ""
                while IFS= read -r file || [ -n "$file" ]; do
                  [ -z "$file" ] && continue
                  echo "- \`$file\`"
                done < drift_files.txt
                echo ""
                echo "**To resolve this locally, run the following commands and commit the changes:**"
                echo ""
                echo '```bash'
                echo "npx tsx scripts/generate-openapi.ts"
                echo "npx tsx scripts/generate-docs.ts"
                files_to_add=$(tr '\n' ' ' < drift_files.txt | xargs)
                echo "git add $files_to_add"
                echo 'git commit -m "docs: sync documentation with codebase"'
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### ⚠️ Documentation Generation Failed"
                echo ""
                echo "The documentation generation scripts failed to execute. Please check the workflow logs for details on missing schemas or syntax errors."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Build static documentation portal
        env:
          VITEPRESS_BASE: /wedding_website/
          SKIP_DOC_SYNC: 'true'
        run: npm run docs:build

      - name: Upload Static Documentation Portal Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-portal-static
          path: docs-portal/.vitepress/dist/
          if-no-files-found: error
          retention-days: 7

  doc-drift-comment:
    needs: [verify]
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Download Documentation Drift Status Artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: doc-drift-status
          path: /tmp/doc-drift

      - name: Report Documentation Drift
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const signature = '<!-- doc-drift-comment -->';
            const outcomePath = '/tmp/doc-drift/outcome.txt';
            const driftFilesPath = '/tmp/doc-drift/drift_files.txt';
            if (!fs.existsSync(outcomePath)) {
              return;
            }
            const outcome = fs.readFileSync(outcomePath, 'utf8').trim();

            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });
              const existing = comments.find(c => c.body && c.body.includes(signature));

              if (outcome === 'failure') {
                let commentBody = '';
                if (fs.existsSync(driftFilesPath)) {
                  const filesList = fs
                    .readFileSync(driftFilesPath, 'utf8')
                    .split(/\r?\n/)
                    .map(line => line.trim())
                    .filter(line => /^[a-zA-Z0-9_./-]+$/.test(line) && !line.includes('..'));
                  const driftedFilesMarkdown = filesList.map(line => `- \`${line}\``).join('\n');
                  const filesForGitAdd = filesList.join(' ');

                  commentBody = `${signature}\n### ⚠️ Documentation Drift Detected\n\nThe committed documentation files do not match the current codebase. The following files are out of sync:\n\n${driftedFilesMarkdown}\n\n**To resolve this locally, run the following commands and commit the changes:**\n\n\`\`\`bash\nnpx tsx scripts/generate-openapi.ts\nnpx tsx scripts/generate-docs.ts\ngit add ${filesForGitAdd}\ngit commit -m "docs: sync documentation with codebase"\n\`\`\`\n`;
                } else {
                  commentBody = `${signature}\n### ⚠️ Documentation Generation Failed\n\nThe documentation generation scripts failed to execute. Please check the workflow logs for details on missing schemas or syntax errors.\n`;
                }

                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body: commentBody
                  });
                } else {
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: commentBody
                  });
                }
              } else if (outcome === 'success' && existing) {
                const resolveBody = `${signature}\n### ✅ Documentation is now in sync!\n\nAll architecture and API files match the codebase.`;
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: resolveBody
                });
              }
            } catch (err) {
              console.warn('Failed to report documentation drift via GitHub API:', err);
            }

  unit-test:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      db:
        image: ${{ needs.verify.outputs.db_image }}
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding123
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        env:
          SKIP_NEXT_TYPEGEN: 'true'
        run: npm ci
      - name: Cache Jest transform state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/jest
          key: ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', 'jest*.js', 'jest*.mjs', 'jest*.cjs', 'jsdom-env.cjs', 'next.config.ts', 'prisma/schema.prisma') }}-${{ hashFiles('src/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', 'jest*.js', 'jest*.mjs', 'jest*.cjs', 'jsdom-env.cjs', 'next.config.ts', 'prisma/schema.prisma') }}-
      - name: Verify Prisma Migration Sync
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
          POSTGRES_URL_NON_POOLING: postgresql://wedding:wedding123@localhost:5432/wedding_shadow?schema=public
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const adminUrl = new URL(process.env.POSTGRES_URL_NON_POOLING);
            const shadowDb = decodeURIComponent(adminUrl.pathname.replace(/^\//, ""));
            adminUrl.pathname = "/postgres";
            adminUrl.search = "";
            const client = new pg.Client({ connectionString: adminUrl.toString() });
            await client.connect();
            try {
              const res = await client.query("SELECT 1 FROM pg_database WHERE datname = $1", [shadowDb]);
              if (res.rowCount === 0) {
                const escaped = shadowDb.replace(/"/g, "\"\"");
                await client.query(`CREATE DATABASE "${escaped}"`);
              }
            } finally {
              await client.end();
            }
          '
          if ! npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code; then
            echo "::error::Prisma migration drift detected between prisma/migrations/ and prisma/schema.prisma."
            echo "To resolve schema drift, run 'npm run migrate:dev -- --name <migration_name>' locally against PostgreSQL (with POSTGRES_URL_NON_POOLING pointing to a shadow database via prisma.config.ts) and commit the generated migration file."
            exit 1
          fi
      - name: Run unit & integration tests
        env:
          CI_REQUIRE_DB: 'true'
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
          TEST_DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
        run: npm run test:cov
      - name: Upload Test Coverage
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-report
          path: coverage/
          retention-days: 7
      - name: Upload Jest A11y Violations
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jest-a11y-violations
          path: test-results/jest-a11y-violations.json
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        env:
          SKIP_NEXT_TYPEGEN: 'true'
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub Runtime for BuildKit Cache
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Cache BuildKit APT and npm mounts (amd64)
        id: buildkit-deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildkit-mounts/deps
          key: buildkit-deps-amd64-${{ hashFiles('Dockerfile', 'package-lock.json', 'docker/prisma-cli/package-lock.json', 'docker/prisma-cli/engine-digests.json', '.npmrc') }}
          restore-keys: |
            buildkit-deps-amd64-

      - name: Cache BuildKit Next.js mount (amd64)
        id: buildkit-next-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildkit-mounts/next
          key: buildkit-next-amd64-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.ts', 'postcss.config.mjs', 'tsconfig.json', 'tsconfig.build.json', 'prisma/schema.prisma', 'src/**') }}
          restore-keys: |
            buildkit-next-amd64-${{ hashFiles('package-lock.json') }}-
            buildkit-next-amd64-

      - name: Hydrate BuildKit Cache Mounts (amd64)
        env:
          TARGET_PLATFORM: linux/amd64
          MOUNT_CACHE_DIR: /tmp/buildkit-mounts
        run: |
          BASE_IMAGE=$(awk '/^FROM / {print $2; exit}' Dockerfile)
          CTX_DIR=$(mktemp -d)
          trap 'rm -rf "$CTX_DIR"' EXIT
          validate_cache_archive() {
            local archive="$1"
            local allowed_regex="$2"
            if tar -tvf "$archive" | awk '{print substr($1,1,1)}' | grep -Eq '^[lhbcps]'; then
              echo "::error::Cache archive '${archive}' contains disallowed link or device entries."
              exit 1
            fi
            while IFS= read -r member; do
              [ -z "$member" ] && continue
              local normalized="${member#./}"
              if [[ "$member" == /* ]] || [[ "$normalized" == *".."* ]] || [[ ! "$normalized" =~ $allowed_regex ]]; then
                echo "::error::Cache archive '${archive}' contains unexpected path '${member}'."
                exit 1
              fi
            done < <(tar -tf "$archive")
          }
          HAS_ARCHIVE=false
          if [ -f "$MOUNT_CACHE_DIR/deps/mounts.tar" ]; then
            validate_cache_archive "$MOUNT_CACHE_DIR/deps/mounts.tar" '^(var(/cache(/apt(/.*)?)?|/lib(/apt(/.*)?)?)?|root(/\.npm(/.*)?)?)$'
            cp "$MOUNT_CACHE_DIR/deps/mounts.tar" "$CTX_DIR/deps.tar"
            HAS_ARCHIVE=true
          fi
          if [ -f "$MOUNT_CACHE_DIR/next/mounts.tar" ]; then
            validate_cache_archive "$MOUNT_CACHE_DIR/next/mounts.tar" '^app(/\.next(/cache(/.*)?)?)?$'
            cp "$MOUNT_CACHE_DIR/next/mounts.tar" "$CTX_DIR/next.tar"
            HAS_ARCHIVE=true
          fi
          if [ "$HAS_ARCHIVE" = "false" ]; then
            echo "No persisted BuildKit cache mounts found; skipping hydration."
            exit 0
          fi
          printf '%s\n' \
            '# syntax=docker/dockerfile:1' \
            "FROM ${BASE_IMAGE}" \
            'ARG CACHEBUST=1' \
            'RUN --mount=type=bind,target=/ctx \' \
            '    --mount=type=cache,target=/var/cache/apt,sharing=locked \' \
            '    --mount=type=cache,target=/var/lib/apt,sharing=locked \' \
            '    --mount=type=cache,target=/root/.npm,sharing=locked \' \
            '    --mount=type=cache,target=/app/.next/cache,sharing=locked \' \
            '    echo "$CACHEBUST" >/dev/null && \' \
            '    if [ -f /ctx/deps.tar ]; then mkdir -p /var/cache/apt /var/lib/apt /root/.npm && tar --no-same-owner --no-same-permissions -xf /ctx/deps.tar -C / var/cache/apt var/lib/apt root/.npm; fi && \' \
            '    if [ -f /ctx/next.tar ]; then mkdir -p /app/.next/cache && tar --no-same-owner --no-same-permissions -xf /ctx/next.tar -C / app/.next/cache; fi' \
            | docker buildx build \
              --platform "$TARGET_PLATFORM" \
              --build-arg "CACHEBUST=$(date +%s%N)" \
              --output type=cacheonly \
              -f - "$CTX_DIR"

      - name: Build OCI Container Image (amd64)
        timeout-minutes: 20
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: wedding-website:latest
          cache-from: type=gha,scope=app-amd64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=app-amd64,mode=max' || '' }}

      - name: Persist BuildKit Cache Mounts (amd64)
        if: steps.buildkit-deps-cache.outputs.cache-hit != 'true' || steps.buildkit-next-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          TARGET_PLATFORM: linux/amd64
          MOUNT_CACHE_DIR: /tmp/buildkit-mounts
          DEPS_CACHE_HIT: ${{ steps.buildkit-deps-cache.outputs.cache-hit }}
          NEXT_CACHE_HIT: ${{ steps.buildkit-next-cache.outputs.cache-hit }}
        run: bash scripts/persist-buildkit-mounts.sh

      - name: Scan OCI Container Image with Trivy (amd64)
        timeout-minutes: 5
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wedding-website:latest
          format: 'table'
          ignore-unfixed: 'true'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'

      - name: Extract Standalone Output from Container Image
        run: |
          rm -rf .next
          mkdir -p .next/standalone
          CID=$(docker create wedding-website:latest)
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/app/." .next/standalone/
          rm -f .next/standalone/node_modules/.bin/prisma
          cp -r .next/standalone/.next/static .next/static

      - name: Verify Standalone Output Portability
        run: npm run check:standalone -- --standalone-only

      - name: Run Standalone Execution Smoke Test
        run: npm run test:standalone

      - name: Run OCI Container & Clean Database Smoke Test
        env:
          SKIP_IMAGE_BUILD: 'true'
          GHA_CACHE_SCOPE: app-amd64
        run: npm run test:container -- --container-migration

      - name: Upload Next.js Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build-artifact
          retention-days: 7
          include-hidden-files: true
          path: |
            .next/
            public/
            prisma/
            node_modules/.prisma
            node_modules/@prisma

  container-arm64:
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub Runtime for BuildKit Cache
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Cache BuildKit APT and npm mounts (arm64)
        id: buildkit-deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildkit-mounts/deps
          key: buildkit-deps-arm64-${{ hashFiles('Dockerfile', 'package-lock.json', 'docker/prisma-cli/package-lock.json', 'docker/prisma-cli/engine-digests.json', '.npmrc') }}
          restore-keys: |
            buildkit-deps-arm64-

      - name: Cache BuildKit Next.js mount (arm64)
        id: buildkit-next-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildkit-mounts/next
          key: buildkit-next-arm64-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.ts', 'postcss.config.mjs', 'tsconfig.json', 'tsconfig.build.json', 'prisma/schema.prisma', 'src/**') }}
          restore-keys: |
            buildkit-next-arm64-${{ hashFiles('package-lock.json') }}-
            buildkit-next-arm64-

      - name: Hydrate BuildKit Cache Mounts (arm64)
        env:
          TARGET_PLATFORM: linux/arm64
          MOUNT_CACHE_DIR: /tmp/buildkit-mounts
        run: |
          BASE_IMAGE=$(awk '/^FROM / {print $2; exit}' Dockerfile)
          CTX_DIR=$(mktemp -d)
          trap 'rm -rf "$CTX_DIR"' EXIT
          validate_cache_archive() {
            local archive="$1"
            local allowed_regex="$2"
            if tar -tvf "$archive" | awk '{print substr($1,1,1)}' | grep -Eq '^[lhbcps]'; then
              echo "::error::Cache archive '${archive}' contains disallowed link or device entries."
              exit 1
            fi
            while IFS= read -r member; do
              [ -z "$member" ] && continue
              local normalized="${member#./}"
              if [[ "$member" == /* ]] || [[ "$normalized" == *".."* ]] || [[ ! "$normalized" =~ $allowed_regex ]]; then
                echo "::error::Cache archive '${archive}' contains unexpected path '${member}'."
                exit 1
              fi
            done < <(tar -tf "$archive")
          }
          HAS_ARCHIVE=false
          if [ -f "$MOUNT_CACHE_DIR/deps/mounts.tar" ]; then
            validate_cache_archive "$MOUNT_CACHE_DIR/deps/mounts.tar" '^(var(/cache(/apt(/.*)?)?|/lib(/apt(/.*)?)?)?|root(/\.npm(/.*)?)?)$'
            cp "$MOUNT_CACHE_DIR/deps/mounts.tar" "$CTX_DIR/deps.tar"
            HAS_ARCHIVE=true
          fi
          if [ -f "$MOUNT_CACHE_DIR/next/mounts.tar" ]; then
            validate_cache_archive "$MOUNT_CACHE_DIR/next/mounts.tar" '^app(/\.next(/cache(/.*)?)?)?$'
            cp "$MOUNT_CACHE_DIR/next/mounts.tar" "$CTX_DIR/next.tar"
            HAS_ARCHIVE=true
          fi
          if [ "$HAS_ARCHIVE" = "false" ]; then
            echo "No persisted BuildKit cache mounts found; skipping hydration."
            exit 0
          fi
          printf '%s\n' \
            '# syntax=docker/dockerfile:1' \
            "FROM ${BASE_IMAGE}" \
            'ARG CACHEBUST=1' \
            'RUN --mount=type=bind,target=/ctx \' \
            '    --mount=type=cache,target=/var/cache/apt,sharing=locked \' \
            '    --mount=type=cache,target=/var/lib/apt,sharing=locked \' \
            '    --mount=type=cache,target=/root/.npm,sharing=locked \' \
            '    --mount=type=cache,target=/app/.next/cache,sharing=locked \' \
            '    echo "$CACHEBUST" >/dev/null && \' \
            '    if [ -f /ctx/deps.tar ]; then mkdir -p /var/cache/apt /var/lib/apt /root/.npm && tar --no-same-owner --no-same-permissions -xf /ctx/deps.tar -C / var/cache/apt var/lib/apt root/.npm; fi && \' \
            '    if [ -f /ctx/next.tar ]; then mkdir -p /app/.next/cache && tar --no-same-owner --no-same-permissions -xf /ctx/next.tar -C / app/.next/cache; fi' \
            | docker buildx build \
              --platform "$TARGET_PLATFORM" \
              --build-arg "CACHEBUST=$(date +%s%N)" \
              --output type=cacheonly \
              -f - "$CTX_DIR"

      - name: Build Native ARM64 OCI Container Image
        timeout-minutes: 20
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: wedding-website:latest
          cache-from: type=gha,scope=app-arm64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=app-arm64,mode=max' || '' }}

      - name: Persist BuildKit Cache Mounts (arm64)
        if: steps.buildkit-deps-cache.outputs.cache-hit != 'true' || steps.buildkit-next-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        env:
          TARGET_PLATFORM: linux/arm64
          MOUNT_CACHE_DIR: /tmp/buildkit-mounts
          DEPS_CACHE_HIT: ${{ steps.buildkit-deps-cache.outputs.cache-hit }}
          NEXT_CACHE_HIT: ${{ steps.buildkit-next-cache.outputs.cache-hit }}
        run: bash scripts/persist-buildkit-mounts.sh

      - name: Scan Native ARM64 OCI Container Image with Trivy
        timeout-minutes: 5
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wedding-website:latest
          format: 'table'
          ignore-unfixed: 'true'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'

      - name: Run Native ARM64 OCI Container & Clean Database Smoke Test
        env:
          SKIP_IMAGE_BUILD: 'true'
          GHA_CACHE_SCOPE: app-arm64
        run: node scripts/test-container.mjs --container-migration

  storybook-build:
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/storybook.yml

  static-export-build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      demo_base_path: ${{ steps.base-path.outputs.demo_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        env:
          SKIP_NEXT_TYPEGEN: 'true'
        run: npm ci
      - name: Resolve Pages base path
        id: base-path
        timeout-minutes: 2
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          OWNER="${GH_REPO%%/*}"
          REPO="${GH_REPO#*/}"
          PAGES_BASE="/${REPO}"
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ] || [ -f "CNAME" ] || [ -f "public/CNAME" ] || [ -f "docs-portal/public/CNAME" ]; then
            PAGES_BASE=""
          elif PAGES_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPO}/pages" 2>/dev/null); then
            RESOLVED_BASE=$(printf '%s' "$PAGES_JSON" | node -e '
              const fs = require("node:fs");
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              if (data.cname) {
                process.stdout.write("");
              } else if (data.html_url) {
                const pathname = new URL(data.html_url).pathname.replace(/\/+$/, "");
                process.stdout.write(pathname);
              }
            ')
            PAGES_BASE="$RESOLVED_BASE"
          fi
          NORMALIZED_PAGES_BASE=$(printf '%s' "$PAGES_BASE" | sed 's:/*$::')
          DEMO_BASE="${NORMALIZED_PAGES_BASE}/demo"
          echo "pages_base=${NORMALIZED_PAGES_BASE}" >> "$GITHUB_OUTPUT"
          echo "demo_base=${DEMO_BASE}" >> "$GITHUB_OUTPUT"
      - name: Cache Next.js static export build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next-export/cache
          key: ${{ runner.os }}-next-export-${{ steps.base-path.outputs.demo_base }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.ts', 'postcss.config.mjs', 'tsconfig.json', 'tsconfig.build.json', 'scripts/build-export.mjs', 'public/**', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-export-${{ steps.base-path.outputs.demo_base }}-${{ hashFiles('package-lock.json') }}-
      - name: Build static HTML showcase
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base-path.outputs.demo_base }}
        run: |
          set -o pipefail
          npm run build:export 2>&1 | tee static-export-build.log
          if grep -Fq "[PageQueryError]" static-export-build.log; then
            echo "Error: Static export emitted [PageQueryError] diagnostics during prerendering!"
            rm -f static-export-build.log
            exit 1
          fi
          rm -f static-export-build.log
      - name: Verify exported HTML output
        run: |
          if [ ! -s "out/index.html" ]; then
            echo "Error: Expected non-empty static HTML entrypoint 'out/index.html' was not generated!"
            exit 1
          fi
          for route in photos things-to-do wedding-party registry; do
            if [ ! -s "out/${route}.html" ] && [ ! -s "out/${route}/index.html" ]; then
              echo "Error: Expected non-empty static HTML output for '/${route}' was not generated!"
              exit 1
            fi
          done
      - name: Cache Playwright Chromium browser
        id: playwright-chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium Browser
        if: steps.playwright-chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium OS Dependencies
        if: steps.playwright-chromium-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium
      - name: Audit static HTML showcase runtime and WCAG 2.2 AA accessibility
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base-path.outputs.demo_base }}
        run: npm run test:e2e:static
      - name: Upload Static Showcase A11y Violations
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-a11y-violations
          path: test-results/static-a11y-violations.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Static Showcase Playwright Traces
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-static-traces
          path: test-results/playwright-static/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Static Demo Showcase Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-static
          path: out/
          if-no-files-found: error
          retention-days: 7

  e2e-test:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GUEST_SESSION_SECRET: test-guest-session-secret-key-at-least-32-chars
    services:
      db:
        image: ${{ needs.verify.outputs.db_image }}
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding123
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download Next.js Build Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build-artifact
      - name: Verify restored Prisma Client from build artifact
        run: |
          test -d node_modules/.prisma/client
          test -d node_modules/@prisma/client
      - name: Cache Playwright Chromium browser
        id: playwright-chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium Browser
        if: steps.playwright-chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium OS Dependencies
        if: steps.playwright-chromium-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium
      - name: Migrate & Seed Test Database
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
          ADMIN_PASSWORD: scrypt:d2VkZGluZy1lMmUtc2FsdA==:q++ok9TyDBa8bSKUlVR+j/tjiVTGj95CWT5HK8KkpIHzWRnv2t2hAhDz2PkdPUDsMO+ulGpXGCFQAqDKwK7Lxw==
        run: |
          npx prisma migrate deploy
          npm run db:seed
      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
          ADMIN_PASSWORD: scrypt:d2VkZGluZy1lMmUtc2FsdA==:q++ok9TyDBa8bSKUlVR+j/tjiVTGj95CWT5HK8KkpIHzWRnv2t2hAhDz2PkdPUDsMO+ulGpXGCFQAqDKwK7Lxw==
          GUEST_PASSCODE: playwright-e2e-guest-passcode
          GUEST_SESSION_SECRET: test-guest-session-secret-key-at-least-32-chars
        run: npx playwright test
      - name: Upload Playwright A11y Violations
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-a11y-violations
          path: test-results/playwright-a11y-violations.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Playwright Failure Traces
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

  a11y-report:
    needs: [unit-test, e2e-test, static-export-build, storybook-build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Download Jest A11y Violations
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jest-a11y-violations
          path: test-results
      - name: Download Playwright A11y Violations
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playwright-a11y-violations
          path: test-results
      - name: Download Static Showcase A11y Violations
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-a11y-violations
          path: test-results
      - name: Download Storybook A11y Violations
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-a11y-violations
          path: test-results
      - name: Generate A11y Report
        run: node scripts/a11y-report.mjs --include-static --include-storybook --require-complete
      - name: Upload A11y Summary Artifact
        if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-summary
          path: test-results/a11y-summary.md
          retention-days: 1
          if-no-files-found: ignore
      - name: Write A11y Report to Job Summary
        if: always() && !cancelled()
        run: |
          if [ -f "test-results/a11y-summary.md" ]; then
            cat test-results/a11y-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify Upstream Accessibility Suite Jobs
        if: always() && !cancelled()
        env:
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          E2E_TEST_RESULT: ${{ needs.e2e-test.result }}
          STATIC_EXPORT_BUILD_RESULT: ${{ needs.static-export-build.result }}
          STORYBOOK_BUILD_RESULT: ${{ needs.storybook-build.result }}
        run: |
          FAILED_SUITES=()
          for pair in \
            "unit-test:${UNIT_TEST_RESULT}" \
            "e2e-test:${E2E_TEST_RESULT}" \
            "static-export-build:${STATIC_EXPORT_BUILD_RESULT}" \
            "storybook-build:${STORYBOOK_BUILD_RESULT}"; do
            JOB_NAME="${pair%%:*}"
            JOB_RESULT="${pair#*:}"
            if [ "$JOB_RESULT" != "success" ]; then
              FAILED_SUITES+=("${JOB_NAME} (${JOB_RESULT:-unknown})")
            fi
          done
          if [ "${#FAILED_SUITES[@]}" -gt 0 ]; then
            echo "::error::Upstream accessibility suite job(s) did not succeed: ${FAILED_SUITES[*]}"
            exit 1
          fi

  a11y-report-comment:
    needs: [a11y-report]
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Download A11y Summary Artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: a11y-summary
          path: /tmp/a11y-summary

      - name: Post A11y Report to PR
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const signature = '<!-- a11y-report -->';
            const reportPath = '/tmp/a11y-summary/a11y-summary.md';

            try {
              if (!fs.existsSync(reportPath)) {
                return;
              }
              const stat = fs.lstatSync(reportPath);
              if (!stat.isFile() || stat.isSymbolicLink() || stat.size > 65536) {
                console.warn('Skipping invalid or oversized a11y-summary.md artifact.');
                return;
              }
              const ALLOWED_LINE_RE = /^(?:|## Accessibility Health Summary|### (?:Component Level \(Jest\)|Page Level \(Playwright\)|Static Showcase \(Playwright Light & Dark\)|Storybook Showcase \(Playwright Light & Dark\))|✅ [^\r\n<>]{1,300}|❌ Found \d+ violations in (?:components|pages|static showcase|storybook showcase)\.|⚠️ Incomplete: [^\r\n<>]{1,300}|- \*\*[^\r\n<>]{1,300}\*\*(?: \(`[^\r\n<>`]{1,500}`\))?: [^\r\n<>]{1,2000} \([^\r\n<>]{1,200}\)|\*\*Status:\*\* Incomplete \([a-z0-9, -]{1,120} results missing\)|\*\*Total Accessibility Violations:\*\* \d+)$/u;
              const rawLines = fs
                .readFileSync(reportPath, 'utf8')
                .replace(/\r\n?/g, '\n')
                .split('\n');
              const safeLines = rawLines.filter(
                line =>
                  ALLOWED_LINE_RE.test(line) &&
                  !/(?:^|[^\\])\]\s*\(/.test(line) &&
                  !/(?:^|[^\\])!\[/.test(line)
              );
              if (!safeLines.includes('## Accessibility Health Summary')) {
                console.warn('Skipping malformed a11y-summary.md artifact.');
                return;
              }
              const sanitizedReport = `${safeLines.join('\n').trim()}\n`;
              const commentBody = `${signature}\n${sanitizedReport}`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });
              const existing = comments.find(c => c.body && c.body.includes(signature));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: commentBody
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: commentBody
                });
              }
            } catch (err) {
              console.warn('Failed to post A11y report via GitHub API:', err);
            }

  pages-verify:
    needs: [verify, static-export-build, storybook-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download Static Documentation Portal Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-portal-static
          path: docs-portal/.vitepress/dist
      - name: Download Static Demo Showcase Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-static
          path: docs-portal/.vitepress/dist/demo
      - name: Download Storybook Static Showcase Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: docs-portal/.vitepress/dist/storybook
      - name: Verify Storybook Static Showcase Checksums
        run: bash scripts/release-integrity.sh verify-tree-sums docs-portal/.vitepress/dist/storybook
      - name: Assemble and verify unified Pages bundle files
        run: |
          touch docs-portal/.vitepress/dist/.nojekyll
          for required_file in \
            docs-portal/.vitepress/dist/index.html \
            docs-portal/.vitepress/dist/demo/index.html \
            docs-portal/.vitepress/dist/storybook/index.html \
            docs-portal/.vitepress/dist/.nojekyll; do
            if [ ! -f "$required_file" ]; then
              echo "Error: Missing required Pages artifact file: $required_file" >&2
              exit 1
            fi
          done
      - name: Cache Playwright Chromium browser
        id: playwright-chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium Browser
        if: steps.playwright-chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium OS Dependencies
        if: steps.playwright-chromium-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium
      - name: Verify unified GitHub Pages showcase bundle
        run: npm run pages:verify
      - name: Generate and verify unified Pages bundle checksums
        run: |
          bash scripts/release-integrity.sh generate-tree-sums docs-portal/.vitepress/dist
          bash scripts/release-integrity.sh verify-tree-sums docs-portal/.vitepress/dist
      - name: Upload Unified Pages Bundle Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-bundle
          path: docs-portal/.vitepress/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  ci-complete:
    needs:
      - verify
      - unit-test
      - build
      - container-arm64
      - storybook-build
      - static-export-build
      - e2e-test
      - a11y-report
      - pages-verify
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify All CI Quality Gates Succeeded
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CONTAINER_ARM64_RESULT: ${{ needs.container-arm64.result }}
          STORYBOOK_BUILD_RESULT: ${{ needs.storybook-build.result }}
          STATIC_EXPORT_BUILD_RESULT: ${{ needs.static-export-build.result }}
          E2E_TEST_RESULT: ${{ needs.e2e-test.result }}
          A11Y_REPORT_RESULT: ${{ needs.a11y-report.result }}
          PAGES_VERIFY_RESULT: ${{ needs.pages-verify.result }}
        run: |
          FAILED_JOBS=()
          for pair in \
            "verify:${VERIFY_RESULT}" \
            "unit-test:${UNIT_TEST_RESULT}" \
            "build:${BUILD_RESULT}" \
            "container-arm64:${CONTAINER_ARM64_RESULT}" \
            "storybook-build:${STORYBOOK_BUILD_RESULT}" \
            "static-export-build:${STATIC_EXPORT_BUILD_RESULT}" \
            "e2e-test:${E2E_TEST_RESULT}" \
            "a11y-report:${A11Y_REPORT_RESULT}" \
            "pages-verify:${PAGES_VERIFY_RESULT}"; do
            JOB_NAME="${pair%%:*}"
            JOB_RESULT="${pair#*:}"
            echo "${JOB_NAME}: ${JOB_RESULT}"
            if [ "$JOB_RESULT" != "success" ]; then
              FAILED_JOBS+=("${JOB_NAME} (${JOB_RESULT:-unknown})")
            fi
          done
          if [ "${#FAILED_JOBS[@]}" -gt 0 ]; then
            echo "::error::CI verification gate failed. Non-passing jobs: ${FAILED_JOBS[*]}"
            exit 1
          fi
          echo "All 9 CI verification jobs succeeded."

  attest-bundles:
    name: Attest Static Showcase Bundle Provenance
    needs: [ci-complete, storybook-build, pages-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download Storybook Static Showcase Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: /tmp/storybook-static

      - name: Download Unified Pages Bundle Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-bundle
          path: /tmp/pages-bundle

      - name: Verify Bundle SHA256SUMS Before Signing
        run: |
          for bundle_dir in /tmp/storybook-static /tmp/pages-bundle; do
            if [ -n "$(find "$bundle_dir" -type l -print -quit 2>/dev/null || true)" ]; then
              echo "::error::Symbolic links are forbidden inside '${bundle_dir}'."
              exit 1
            fi
            if [ ! -s "${bundle_dir}/SHA256SUMS" ]; then
              echo "::error::Missing or empty '${bundle_dir}/SHA256SUMS'."
              exit 1
            fi
            (
              cd "$bundle_dir"
              sha256sum --check --strict SHA256SUMS
            )
            ACTUAL_FILES=$(cd "$bundle_dir" && find . -type f ! -path './SHA256SUMS' -print | sed 's|^\./||' | LC_ALL=C sort)
            MANIFEST_FILES=$(sed 's/^[a-f0-9]\{64\}  //' "${bundle_dir}/SHA256SUMS" | LC_ALL=C sort)
            if [ "$ACTUAL_FILES" != "$MANIFEST_FILES" ]; then
              echo "::error::Unindexed or mismatched files detected in '${bundle_dir}'."
              exit 1
            fi
          done

      - name: Attest Static Showcase Bundle Checksums Provenance
        timeout-minutes: 3
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            /tmp/storybook-static/SHA256SUMS
            /tmp/pages-bundle/SHA256SUMS

  prepare-docs:
    needs: [ci-complete, static-export-build, storybook-build, pages-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      is_latest: ${{ steps.freshness.outputs.is_latest }}
      main_head_sha: ${{ steps.freshness.outputs.main_head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Main Branch Tip Freshness
        id: freshness
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$CURRENT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid github.sha '${CURRENT_SHA}'. Expected a 40-character commit SHA."
            exit 1
          fi

          GIT_AUTH_ARGS=()
          ORIGIN_URL=$(git remote get-url origin 2>/dev/null || true)
          if [ -n "${GITHUB_TOKEN:-}" ] && [[ "$ORIGIN_URL" =~ ^https?://[^/]+ ]]; then
            ORIGIN_SERVER="${BASH_REMATCH[0]}"
            BASIC_TOKEN=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\r\n')
            GIT_AUTH_ARGS=(-c "http.${ORIGIN_SERVER}/.extraheader=AUTHORIZATION: basic ${BASIC_TOKEN}")
          fi

          if ! git remote get-url origin >/dev/null 2>&1; then
            echo "::error::Missing git remote 'origin' required to verify origin/main HEAD."
            exit 1
          fi

          git "${GIT_AUTH_ARGS[@]}" fetch --depth=1 --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if ! MAIN_HEAD_SHA=$(git rev-parse --verify refs/remotes/origin/main 2>/dev/null); then
            echo "::error::Unable to resolve refs/remotes/origin/main after fetch."
            exit 1
          fi

          echo "main_head_sha=${MAIN_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${CURRENT_SHA,,}" != "${MAIN_HEAD_SHA,,}" ]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping GitHub Pages deployment for stale commit ${CURRENT_SHA} because origin/main HEAD has advanced to ${MAIN_HEAD_SHA}."
            exit 0
          fi

          echo "is_latest=true" >> "$GITHUB_OUTPUT"
          echo "Verified ${CURRENT_SHA} matches origin/main HEAD."
      - name: Setup Pages
        id: pages
        if: steps.freshness.outputs.is_latest == 'true'
        timeout-minutes: 3
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Check Pages base path alignment
        id: base-check
        if: steps.freshness.outputs.is_latest == 'true'
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BUILT_DEMO_BASE: ${{ needs.static-export-build.outputs.demo_base_path }}
          BUILT_STORYBOOK_BASE: ${{ needs.storybook-build.outputs.storybook_base_path }}
        run: |
          NORMALIZED_PAGES_BASE=$(printf '%s' "$PAGES_BASE_PATH" | sed 's:/*$::')
          if [ -z "$NORMALIZED_PAGES_BASE" ]; then
            EXPECTED_PORTAL_BASE="/"
          else
            EXPECTED_PORTAL_BASE="${NORMALIZED_PAGES_BASE}/"
          fi
          EXPECTED_DEMO_BASE="${NORMALIZED_PAGES_BASE}/demo"
          EXPECTED_STORYBOOK_BASE="${NORMALIZED_PAGES_BASE}/storybook"
          echo "expected_portal_base=${EXPECTED_PORTAL_BASE}" >> "$GITHUB_OUTPUT"
          echo "expected_demo_base=${EXPECTED_DEMO_BASE}" >> "$GITHUB_OUTPUT"
          echo "expected_storybook_base=${EXPECTED_STORYBOOK_BASE}" >> "$GITHUB_OUTPUT"
          if [ "$EXPECTED_PORTAL_BASE" = "/wedding_website/" ] && [ "$BUILT_DEMO_BASE" = "$EXPECTED_DEMO_BASE" ] && [ "$BUILT_STORYBOOK_BASE" = "$EXPECTED_STORYBOOK_BASE" ]; then
            echo "reuse_bundle=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse_bundle=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download Verified Pages Bundle Artifact
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-bundle
          path: docs-portal/.vitepress/dist
      - name: Verify Reused Pages Bundle Checksums
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle == 'true'
        run: bash scripts/release-integrity.sh verify-tree-sums docs-portal/.vitepress/dist
      - name: Setup Node.js for fallback Pages rebuild
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies for fallback Pages rebuild
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle != 'true'
        env:
          SKIP_NEXT_TYPEGEN: 'true'
        run: npm ci
      - name: Build documentation portal for custom base path
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle != 'true'
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}
          SKIP_DOC_SYNC: 'true'
        run: npm run docs:build
      - name: Download Static Demo Showcase Artifact
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-static
          path: docs-portal/.vitepress/dist/demo
      - name: Align demo base path with Pages configuration
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle != 'true'
        timeout-minutes: 10
        env:
          EXPECTED_DEMO_BASE: ${{ steps.base-check.outputs.expected_demo_base }}
          BUILT_DEMO_BASE: ${{ needs.static-export-build.outputs.demo_base_path }}
        run: |
          if [ "$BUILT_DEMO_BASE" != "$EXPECTED_DEMO_BASE" ]; then
            echo "Rebuilding static demo for Pages base path: ${EXPECTED_DEMO_BASE}"
            NEXT_PUBLIC_BASE_PATH="$EXPECTED_DEMO_BASE" npm run build:export
            npx playwright install --with-deps chromium
            NEXT_PUBLIC_BASE_PATH="$EXPECTED_DEMO_BASE" npm run test:e2e:static
            rm -rf docs-portal/.vitepress/dist/demo
            mkdir -p docs-portal/.vitepress/dist/demo
            cp -R out/. docs-portal/.vitepress/dist/demo/
            rm -rf out
          fi
      - name: Download Storybook Static Showcase Artifact
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: docs-portal/.vitepress/dist/storybook
      - name: Verify Downloaded Storybook Static Showcase Checksums
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle != 'true'
        run: bash scripts/release-integrity.sh verify-tree-sums docs-portal/.vitepress/dist/storybook
      - name: Align Storybook base path with Pages configuration
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle != 'true'
        timeout-minutes: 10
        env:
          EXPECTED_STORYBOOK_BASE: ${{ steps.base-check.outputs.expected_storybook_base }}
          BUILT_STORYBOOK_BASE: ${{ needs.storybook-build.outputs.storybook_base_path }}
        run: |
          if [ "$BUILT_STORYBOOK_BASE" != "$EXPECTED_STORYBOOK_BASE" ]; then
            echo "Rebuilding static Storybook for Pages base path: ${EXPECTED_STORYBOOK_BASE}"
            NEXT_PUBLIC_BASE_PATH="$EXPECTED_STORYBOOK_BASE" npm run build-storybook
            npx playwright install --with-deps chromium
            NEXT_PUBLIC_BASE_PATH="$EXPECTED_STORYBOOK_BASE" npm run test:e2e:storybook
            bash scripts/release-integrity.sh generate-tree-sums storybook-static
            bash scripts/release-integrity.sh verify-tree-sums storybook-static
            rm -rf docs-portal/.vitepress/dist/storybook
            mkdir -p docs-portal/.vitepress/dist/storybook
            cp -R storybook-static/. docs-portal/.vitepress/dist/storybook/
            rm -rf storybook-static
          fi
      - name: Verify Fallback Storybook Checksums & Generate Pages Bundle Checksums
        if: steps.freshness.outputs.is_latest == 'true' && steps.base-check.outputs.reuse_bundle != 'true'
        run: |
          bash scripts/release-integrity.sh verify-tree-sums docs-portal/.vitepress/dist/storybook
          touch docs-portal/.vitepress/dist/.nojekyll
          bash scripts/release-integrity.sh generate-tree-sums docs-portal/.vitepress/dist
      - name: Add .nojekyll and verify unified Pages bundle
        if: steps.freshness.outputs.is_latest == 'true'
        run: |
          bash scripts/release-integrity.sh verify-tree-sums docs-portal/.vitepress/dist
          for required_file in \
            docs-portal/.vitepress/dist/index.html \
            docs-portal/.vitepress/dist/demo/index.html \
            docs-portal/.vitepress/dist/storybook/index.html \
            docs-portal/.vitepress/dist/.nojekyll; do
            if [ ! -f "$required_file" ]; then
              echo "Error: Missing required Pages artifact file: $required_file" >&2
              exit 1
            fi
          done
      - name: Upload Pages artifact
        if: steps.freshness.outputs.is_latest == 'true'
        timeout-minutes: 5
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-portal/.vitepress/dist

  deploy-docs:
    needs: [ci-complete, prepare-docs]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.prepare-docs.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 5
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

