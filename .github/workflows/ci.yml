permissions:
  contents: read

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Verify Environment Variables Documentation
        run: npm run check:env-docs

      - name: Verify Deployment Runbooks
        run: npm run check:runbooks

      - name: Verify Setup & Contributor Guides Contract
        run: npm run check:setup-guides

      - name: Check Personal/Template Identifier Isolation
        run: npm run check:identifiers

      - name: Check Third-Party Action Pin Commit SHAs
        run: npm run check:action-pins

      - name: Check Documentation Relative Links
        run: npm run check:links

      - name: Verify Specification Route & Symbol Contracts
        run: npm run check:spec-contracts

      - name: Validate Prisma Schema
        run: npm run check:prisma

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Code Linting
        run: npm run lint

      - name: Knip Unused Export Analysis
        run: npm run lint:unused

      - name: Verify Migration Compatibility
        run: npm run lint:migrations

      - name: Verify Documentation and Architecture Sync
        id: verify-docs
        run: |
          npx tsx scripts/generate-openapi.ts
          npx tsx scripts/generate-docs.ts
          
          # Capture status before creating any files
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "$STATUS" > raw_drift.txt
            awk '{print $2}' raw_drift.txt > drift_files.txt
            echo "Drift detected in the following files:"
            cat drift_files.txt
            exit 1
          fi

      - name: Report Documentation Drift
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.verify-docs.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const signature = '<!-- doc-drift-comment -->';
            
            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              const existing = comments.data.find(c => c.body.includes(signature));
              
              if ('${{ steps.verify-docs.outcome }}' === 'failure') {
                let commentBody = '';
                if (fs.existsSync('drift_files.txt')) {
                  const filesList = fs.readFileSync('drift_files.txt', 'utf8').trim().split('\n');
                  const driftedFilesMarkdown = filesList.map(line => `- \`${line}\``).join('\n');
                  const filesForGitAdd = filesList.join(' ');
                  
                  commentBody = `${signature}\n### ⚠️ Documentation Drift Detected\n\nThe committed documentation files do not match the current codebase. The following files are out of sync:\n\n${driftedFilesMarkdown}\n\n**To resolve this locally, run the following commands and commit the changes:**\n\n\`\`\`bash\nnpx tsx scripts/generate-openapi.ts\nnpx tsx scripts/generate-docs.ts\ngit add ${filesForGitAdd}\ngit commit -m "docs: sync documentation with codebase"\n\`\`\`\n`;
                } else {
                  commentBody = `${signature}\n### ⚠️ Documentation Generation Failed\n\nThe documentation generation scripts failed to execute. Please check the workflow logs for details on missing schemas or syntax errors.\n`;
                }
                
                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body: commentBody
                  });
                } else {
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: commentBody
                  });
                }
              } else if ('${{ steps.verify-docs.outcome }}' === 'success' && existing) {
                const resolveBody = `${signature}\n### ✅ Documentation is now in sync!\n\nAll architecture and API files match the codebase.`;
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: resolveBody
                });
              }
            } catch (err) {
              console.warn('Failed to report documentation drift via GitHub API:', err);
            }

      - name: Write Documentation Drift Report to Job Summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if [ "${{ steps.verify-docs.outcome }}" = "failure" ]; then
            if [ -f "drift_files.txt" ]; then
              {
                echo "### ⚠️ Documentation Drift Detected"
                echo ""
                echo "The committed documentation files do not match the current codebase. The following files are out of sync:"
                echo ""
                while IFS= read -r file || [ -n "$file" ]; do
                  [ -z "$file" ] && continue
                  echo "- \`$file\`"
                done < drift_files.txt
                echo ""
                echo "**To resolve this locally, run the following commands and commit the changes:**"
                echo ""
                echo '```bash'
                echo "npx tsx scripts/generate-openapi.ts"
                echo "npx tsx scripts/generate-docs.ts"
                files_to_add=$(tr '\n' ' ' < drift_files.txt | xargs)
                echo "git add $files_to_add"
                echo 'git commit -m "docs: sync documentation with codebase"'
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### ⚠️ Documentation Generation Failed"
                echo ""
                echo "The documentation generation scripts failed to execute. Please check the workflow logs for details on missing schemas or syntax errors."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Build static documentation portal
        env:
          VITEPRESS_BASE: /wedding_website/
        run: npm run docs:build

  unit-test:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding123
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit & integration tests
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
        run: npm test
      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-report
          path: coverage/
      - name: Upload Jest A11y Violations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jest-a11y-violations
          path: test-results/jest-a11y-violations.json
          if-no-files-found: warn

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build project
        run: npm run build

      - name: Copy standalone static assets
        run: |
          rm -rf .next/standalone/.next/static .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          rm -f .next/standalone/public/mockServiceWorker.js
      - name: Run Standalone Execution Smoke Test
        run: npm run test:standalone

      - name: Verify Standalone Output Portability
        run: npm run check:standalone

      - name: Security Dependency Audit
        run: npm run check:audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run OCI Container & Clean Database Smoke Test
        run: npm run test:container

      - name: Tag and Export Docker Container Image
        run: |
          docker tag wedding-website:latest wedding-website:latest
          docker save wedding-website:latest -o /tmp/wedding-website-image.tar

      - name: Upload Docker Container Image Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wedding-website-container
          path: /tmp/wedding-website-image.tar
          retention-days: 1

      - name: Upload Next.js Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build-artifact
          retention-days: 7
          include-hidden-files: true
          path: |
            .next/
            public/
            prisma/
            node_modules/.prisma
            node_modules/@prisma

  storybook-build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache Storybook Webpack build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/webpack
            node_modules/.cache/storybook
          key: ${{ runner.os }}-storybook-${{ hashFiles('package-lock.json') }}-${{ hashFiles('.storybook/**', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-storybook-${{ hashFiles('package-lock.json') }}-
      - name: Build static Storybook showcase
        run: npm run build-storybook

  e2e-test:
    needs: [build, unit-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GUEST_SESSION_SECRET: test-guest-session-secret-key-at-least-32-chars
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding123
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download Next.js Build Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build-artifact
      - name: Download Jest A11y Violations
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jest-a11y-violations
          path: test-results
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install Playwright Operating System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: Migrate & Seed Test Database
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
          ADMIN_PASSWORD: scrypt:d2VkZGluZy1lMmUtc2FsdA==:q++ok9TyDBa8bSKUlVR+j/tjiVTGj95CWT5HK8KkpIHzWRnv2t2hAhDz2PkdPUDsMO+ulGpXGCFQAqDKwK7Lxw==
        run: |
          npx prisma migrate deploy
          npm run db:seed
      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
          ADMIN_PASSWORD: scrypt:d2VkZGluZy1lMmUtc2FsdA==:q++ok9TyDBa8bSKUlVR+j/tjiVTGj95CWT5HK8KkpIHzWRnv2t2hAhDz2PkdPUDsMO+ulGpXGCFQAqDKwK7Lxw==
          GUEST_PASSCODE: playwright-e2e-guest-passcode
          GUEST_SESSION_SECRET: test-guest-session-secret-key-at-least-32-chars
        run: npx playwright test

      - name: Generate A11y Report
        if: always()
        run: node scripts/a11y-report.mjs

      - name: Post A11y Report to PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const signature = '<!-- a11y-report -->';
            const reportPath = 'test-results/a11y-summary.md';

            try {
              if (fs.existsSync(reportPath)) {
                const report = fs.readFileSync(reportPath, 'utf8');
                const commentBody = report.includes(signature) ? report : `${signature}\n${report}`;
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100
                });
                const existing = comments.find(c => c.body && c.body.includes(signature));

                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body: commentBody
                  });
                } else {
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: commentBody
                  });
                }
              }
            } catch (err) {
              console.warn('Failed to post A11y report via GitHub API:', err);
            }

      - name: Write A11y Report to Job Summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if [ -f "test-results/a11y-summary.md" ]; then
            cat test-results/a11y-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Download Docker Container Image Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wedding-website-container
          path: /tmp

      - name: Load Docker Image
        run: |
          if [ -f /tmp/wedding-website-image.tar ]; then
            docker load -i /tmp/wedding-website-image.tar
            rm -f /tmp/wedding-website-image.tar
          elif [ -f wedding-website-image.tar ]; then
            docker load -i wedding-website-image.tar
            rm -f wedding-website-image.tar
          else
            echo "Error: Docker image archive not found!"
            exit 1
          fi

      - name: Start local test database and application container
        timeout-minutes: 10
        env:
          DB_USER: wedding
          DB_PASSWORD: wedding123
          DB_NAME: wedding
          DB_PORT: "5433"
          ADMIN_PASSWORD: scrypt:d2VkZGluZy1lMmUtc2FsdA==:q++ok9TyDBa8bSKUlVR+j/tjiVTGj95CWT5HK8KkpIHzWRnv2t2hAhDz2PkdPUDsMO+ulGpXGCFQAqDKwK7Lxw==
          GUEST_PASSCODE: playwright-e2e-guest-passcode
          GUEST_SESSION_SECRET: test-guest-session-secret-key-at-least-32-chars
          E2E_TEST: "true"
        run: |
          lsof -ti:3000 | xargs kill -9 2>/dev/null || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d app

      - name: Wait for application container to be ready
        timeout-minutes: 2
        run: |
          echo "Waiting for application container on port 3000..."
          timeout 120 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "Application container is responsive!"

      - name: Seed local test container database
        timeout-minutes: 1
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5433/wedding
          ADMIN_PASSWORD: scrypt:d2VkZGluZy1lMmUtc2FsdA==:q++ok9TyDBa8bSKUlVR+j/tjiVTGj95CWT5HK8KkpIHzWRnv2t2hAhDz2PkdPUDsMO+ulGpXGCFQAqDKwK7Lxw==
        run: |
          npm run db:seed

      - name: Run Playwright smoke tests against container
        timeout-minutes: 3
        env:
          TEST_CONTAINER: "true"
          ADMIN_PASSWORD: scrypt:d2VkZGluZy1lMmUtc2FsdA==:q++ok9TyDBa8bSKUlVR+j/tjiVTGj95CWT5HK8KkpIHzWRnv2t2hAhDz2PkdPUDsMO+ulGpXGCFQAqDKwK7Lxw==
          GUEST_PASSCODE: playwright-e2e-guest-passcode
          GUEST_SESSION_SECRET: test-guest-session-secret-key-at-least-32-chars
        run: npx playwright test

      - name: Print container logs on failure
        if: failure()
        env:
          DB_PASSWORD: wedding123
          ADMIN_PASSWORD: scrypt:d2VkZGluZy1lMmUtc2FsdA==:q++ok9TyDBa8bSKUlVR+j/tjiVTGj95CWT5HK8KkpIHzWRnv2t2hAhDz2PkdPUDsMO+ulGpXGCFQAqDKwK7Lxw==
          GUEST_PASSCODE: playwright-e2e-guest-passcode
          GUEST_SESSION_SECRET: test-guest-session-secret-key-at-least-32-chars
        run: |
          echo "=== App Container Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs app || true
          echo "=== DB Container Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs db || true

      - name: Clean up containers
        if: always()
        env:
          DB_PASSWORD: wedding123
          ADMIN_PASSWORD: scrypt:d2VkZGluZy1lMmUtc2FsdA==:q++ok9TyDBa8bSKUlVR+j/tjiVTGj95CWT5HK8KkpIHzWRnv2t2hAhDz2PkdPUDsMO+ulGpXGCFQAqDKwK7Lxw==
          GUEST_PASSCODE: playwright-e2e-guest-passcode
          GUEST_SESSION_SECRET: test-guest-session-secret-key-at-least-32-chars
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v || true

  deploy-docs:
    needs: verify
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build documentation portal
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run docs:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-portal/.vitepress/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

