  a11y-report:
    needs: [unit-test, e2e-test, static-export-build]
    if: '!cancelled()'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Download Jest A11y Violations
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jest-a11y-violations
          path: test-results
      - name: Download Playwright A11y Violations
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playwright-a11y-violations
          path: test-results
      - name: Download Static Showcase A11y Violations
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-a11y-violations
          path: test-results
      - name: Generate A11y Report
        run: node scripts/a11y-report.mjs --include-static
      - name: Post A11y Report to PR
        if: "!cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const signature = '<!-- a11y-report -->';
            const reportPath = 'test-results/a11y-summary.md';

            try {
              if (fs.existsSync(reportPath)) {
                const report = fs.readFileSync(reportPath, 'utf8');
                const commentBody = report.includes(signature) ? report : `${signature}\n${report}`;
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100
                });
                const existing = comments.find(c => c.body && c.body.includes(signature));

                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body: commentBody
                  });
                } else {
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: commentBody
                  });
                }
              }
            } catch (err) {
              console.warn('Failed to post A11y report via GitHub API:', err);
            }
      - name: Write A11y Report to Job Summary
        if: '!cancelled()'
        run: |
          if [ -f "test-results/a11y-summary.md" ]; then
            cat test-results/a11y-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  pages-verify:
