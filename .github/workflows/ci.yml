permissions:
  contents: read

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Verify Environment Variables Documentation
        run: npm run check:env-docs

      - name: Check Personal/Template Identifier Isolation
        run: npm run check:identifiers

      - name: Check Documentation Relative Links
        run: npm run check:links

      - name: Validate Prisma Schema
        run: npm run check:prisma

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Code Linting
        run: npm run lint

      - name: Knip Unused Export Analysis
        run: npm run lint:unused

      - name: Verify Migration Compatibility
        run: npm run lint:migrations

      - name: Verify Documentation and Architecture Sync
        id: verify-docs
        run: |
          npx tsx scripts/generate-openapi.ts
          npx tsx scripts/generate-docs.ts
          
          # Capture status before creating any files
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "$STATUS" > raw_drift.txt
            awk '{print $2}' raw_drift.txt > drift_files.txt
            echo "Drift detected in the following files:"
            cat drift_files.txt
            exit 1
          fi

      - name: Report Documentation Drift
        if: always() && github.event_name == 'pull_request' && steps.verify-docs.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const signature = '<!-- doc-drift-comment -->';
            
            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              const existing = comments.data.find(c => c.body.includes(signature));
              
              if ('${{ steps.verify-docs.outcome }}' === 'failure') {
                let commentBody = '';
                if (fs.existsSync('drift_files.txt')) {
                  const filesList = fs.readFileSync('drift_files.txt', 'utf8').trim().split('\n');
                  const driftedFilesMarkdown = filesList.map(line => `- \`${line}\``).join('\n');
                  const filesForGitAdd = filesList.join(' ');
                  
                  commentBody = `${signature}\n### ⚠️ Documentation Drift Detected\n\nThe committed documentation files do not match the current codebase. The following files are out of sync:\n\n${driftedFilesMarkdown}\n\n**To resolve this locally, run the following commands and commit the changes:**\n\n\`\`\`bash\nnpx tsx scripts/generate-openapi.ts\nnpx tsx scripts/generate-docs.ts\ngit add ${filesForGitAdd}\ngit commit -m "docs: sync documentation with codebase"\n\`\`\`\n`;
                } else {
                  commentBody = `${signature}\n### ⚠️ Documentation Generation Failed\n\nThe documentation generation scripts failed to execute. Please check the workflow logs for details on missing schemas or syntax errors.\n`;
                }
                
                if (existing) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                    body: commentBody
                  });
                } else {
                  await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: commentBody
                  });
                }
              } else if ('${{ steps.verify-docs.outcome }}' === 'success' && existing) {
                const resolveBody = `${signature}\n### ✅ Documentation is now in sync!\n\nAll architecture and API files match the codebase.`;
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: resolveBody
                });
              }
            } catch (err) {
              console.warn('Failed to report documentation drift via GitHub API:', err);
            }

  unit-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding123
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit & integration tests
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
        run: npm test
      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: coverage/

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build project
        run: npm run build

      - name: Copy standalone static assets
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - name: Run Standalone Execution Smoke Test
        run: npm run test:standalone

      - name: Verify Standalone Output Portability
        run: npm run check:standalone

      - name: Security Dependency Audit
        run: npm run check:audit || echo "::warning::High or critical vulnerabilities detected by npm audit"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run OCI Container & Clean Database Smoke Test
        run: npm run test:container

      - name: Upload Next.js Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-artifact
          retention-days: 7
          path: |
            .next/
            public/
            prisma/
            node_modules/.prisma
            node_modules/@prisma

  e2e-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding123
          POSTGRES_DB: wedding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download Next.js Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build-artifact
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Migrate & Seed Test Database
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
        run: |
          npx prisma migrate deploy
          npm run db:seed
      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding_test?schema=public
          GUEST_PASSCODE: wedding2026
        run: npx playwright test

      - name: Generate A11y Report
        if: always()
        run: node scripts/a11y-report.mjs

      - name: Post A11y Report to PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const fs = require('fs');
              const reportPath = 'test-results/a11y-summary.md';
              if (fs.existsSync(reportPath)) {
                const body = fs.readFileSync(reportPath, 'utf8');
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
              }
            } catch (err) {
              console.warn('Failed to post A11y report via GitHub API:', err);
            }

      - name: Write A11y Report to Job Summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if [ -f "test-results/a11y-summary.md" ]; then
            cat test-results/a11y-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start local test database and application container
        timeout-minutes: 5
        env:
          DB_PORT: "5433"
        run: |
          docker compose up --build -d app

      - name: Wait for application container to be ready
        timeout-minutes: 2
        run: |
          echo "Waiting for application container on port 3000..."
          timeout 120 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "Application container is responsive!"

      - name: Seed local test container database
        timeout-minutes: 1
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5433/wedding
        run: |
          npm run db:seed

      - name: Run Playwright smoke tests against container
        timeout-minutes: 3
        env:
          TEST_CONTAINER: "true"
        run: npx playwright test

      - name: Print container logs on failure
        if: failure()
        run: |
          echo "=== App Container Logs ==="
          docker compose logs app || true
          echo "=== DB Container Logs ==="
          docker compose logs db || true

      - name: Clean up containers
        if: always()
        run: docker compose down -v || true
