name: Release Pipeline

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment (all: staging then production gate, staging, production)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - staging
          - production
      image_digest:
        description: 'Optional immutable OCI image digest (sha256:<64-hex>) to pin for manual deployment'
        required: false
        type: string
      image_tag:
        description: 'Optional release tag (v*) or commit SHA to promote (resolved to git commit and OCI digest)'
        required: false
        default: ''
        type: string
      release_ref:
        description: 'Optional immutable release tag (v*) or 40-character commit SHA to promote'
        required: false
        default: ''
        type: string
      previous_tag:
        description: 'Optional immutable container image tag override to restore on failure (defaults to active pre-deploy tag)'
        required: false
        default: ''
        type: string
      provider:
        description: 'Hosting Provider Adapter'
        required: false
        default: 'google-cloud-run'
        type: string
      dry_run:
        description: 'Run release provider deployment in explicit dry-run validation mode'
        required: false
        default: false
        type: boolean
      cloud_run_service:
        description: 'Optional Cloud Run service name override (defaults to vars.CLOUD_RUN_SERVICE or environment-isolated service name)'
        required: false
        default: ''
        type: string
      cloud_run_region:
        description: 'Optional Cloud Run region override (defaults to vars.CLOUD_RUN_REGION or us-central1)'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      environment:
        description: 'Target Deployment Environment (all, staging, production)'
        required: false
        default: 'all'
        type: string
      image_digest:
        description: 'Optional immutable OCI image digest (sha256:<64-hex>) to pin for manual deployment'
        required: false
        type: string
      image_tag:
        description: 'Optional release tag (v*) or commit SHA to promote (resolved to git commit and OCI digest)'
        required: false
        default: ''
        type: string
      release_ref:
        description: 'Optional immutable release tag (v*) or 40-character commit SHA to promote'
        required: false
        default: ''
        type: string
      previous_tag:
        description: 'Optional immutable container image tag override to restore on failure (defaults to active pre-deploy tag)'
        required: false
        default: ''
        type: string
      provider:
        description: 'Hosting Provider Adapter'
        required: false
        default: 'google-cloud-run'
        type: string
      rollback_environment:
        description: 'Optional unguarded GitHub Environment holding rollback secrets'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Run release provider deployment in explicit dry-run validation mode'
        required: false
        default: false
        type: boolean
      commit_sha:
        description: 'Optional 40-character commit SHA to deploy (resolved from image_digest provenance if omitted)'
        required: false
        default: ''
        type: string
      cloud_run_service:
        description: 'Optional Cloud Run service name override (defaults to vars.CLOUD_RUN_SERVICE or environment-isolated service name)'
        required: false
        default: ''
        type: string
      cloud_run_region:
        description: 'Optional Cloud Run region override (defaults to vars.CLOUD_RUN_REGION or us-central1)'
        required: false
        default: ''
        type: string
    outputs:
      schema_compatibility_status:
        description: 'Schema compatibility check status'
        value: ${{ jobs.schema-compatibility.outputs.compatibility_status }}

jobs:
  ci-gate:
    name: Verify CI Status & Resolve Release SHA
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
      attestations: read
    outputs:
      target_sha: ${{ steps.resolve-sha.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: "(github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.image_tag != ''"
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Target Commit SHA
        id: resolve-sha
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTOR_LOGIN: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_REF: ${{ inputs.release_ref }}
          CURRENT_SHA: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-artifact.yml
        run: |
          TARGET_SHA=""
          COMMIT_INPUT_SHA=""
          IMAGE_TAG_SHA=""
          REF_RESOLVED_SHA=""
          ATTESTED_SHA=""
          EFFECTIVE_IMAGE_DIGEST="${INPUT_IMAGE_DIGEST:-${IMAGE_DIGEST:-}}"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TARGET_SHA="$WORKFLOW_RUN_HEAD_SHA"
          else
            if [ -n "${INPUT_COMMIT_SHA:-}" ]; then
              if [[ ! "$INPUT_COMMIT_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
                echo "::error::Invalid commit_sha '${INPUT_COMMIT_SHA}'. Must be a 40-character hexadecimal commit SHA."
                exit 1
              fi
              COMMIT_INPUT_SHA=$(printf '%s' "$INPUT_COMMIT_SHA" | tr '[:upper:]' '[:lower:]')
            fi

            if [ -n "${INPUT_IMAGE_TAG:-}" ]; then
              if [[ "${INPUT_IMAGE_TAG,,}" == "latest" ]]; then
                echo "::error::Unpinned 'latest' image_tag is forbidden. Provide an immutable v* release tag or 40-character commit SHA."
                exit 1
              fi
              if [[ ! "$INPUT_IMAGE_TAG" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
                echo "::error::Invalid image_tag '${INPUT_IMAGE_TAG}'. Must only contain alphanumeric characters, underscores, periods, and hyphens."
                exit 1
              fi
              if git remote get-url origin >/dev/null 2>&1; then
                GIT_AUTH_ARGS=()
                ORIGIN_URL=$(git remote get-url origin 2>/dev/null || true)
                EFFECTIVE_GIT_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
                if [ -n "$EFFECTIVE_GIT_TOKEN" ] && [[ "$ORIGIN_URL" =~ ^https?://[^/]+ ]]; then
                  ORIGIN_SERVER="${BASH_REMATCH[0]}"
                  BASIC_TOKEN=$(printf 'x-access-token:%s' "$EFFECTIVE_GIT_TOKEN" | base64 | tr -d '\r\n')
                  GIT_AUTH_ARGS=(-c "http.${ORIGIN_SERVER}/.extraheader=AUTHORIZATION: basic ${BASIC_TOKEN}")
                fi
                git "${GIT_AUTH_ARGS[@]}" fetch --tags origin +refs/heads/main:refs/remotes/origin/main
              fi
              if [[ "$INPUT_IMAGE_TAG" =~ ^[a-fA-F0-9]{40}$ ]]; then
                IMAGE_TAG_SHA=$(printf '%s' "$INPUT_IMAGE_TAG" | tr '[:upper:]' '[:lower:]')
              elif ! IMAGE_TAG_SHA=$(git rev-parse --verify "${INPUT_IMAGE_TAG}^{commit}" 2>/dev/null | tr '[:upper:]' '[:lower:]'); then
                echo "::error::Failed to resolve image_tag '${INPUT_IMAGE_TAG}' to a repository commit SHA."
                exit 1
              fi
              if ! git show-ref --verify --quiet refs/remotes/origin/main; then
                echo "::error::Missing refs/remotes/origin/main reference required to verify main branch ancestry."
                exit 1
              fi
              if ! git merge-base --is-ancestor "$IMAGE_TAG_SHA" refs/remotes/origin/main; then
                echo "::error::Target commit '${IMAGE_TAG_SHA}' (resolved from '${INPUT_IMAGE_TAG}') is not an ancestor of origin/main."
                exit 1
              fi
            fi

            if [ -n "${RELEASE_REF:-}" ]; then
              if [[ "${RELEASE_REF,,}" == "latest" ]]; then
                echo "::error::Unpinned 'latest' release_ref is forbidden. Provide an immutable v* tag or 40-character commit SHA."
                exit 1
              fi
              if [[ ! "$RELEASE_REF" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
                echo "::error::Invalid release_ref '${RELEASE_REF}'. Must only contain alphanumeric characters, underscores, periods, and hyphens."
                exit 1
              fi
              if [ -z "${GH_TOKEN:-}" ] || [ -z "${GITHUB_REPOSITORY:-}" ]; then
                echo "::error::Missing GITHUB_TOKEN or GITHUB_REPOSITORY required to resolve release_ref '${RELEASE_REF}'."
                exit 1
              fi
              API_BASE="${GITHUB_API_URL:-https://api.github.com}"
              COMMIT_JSON=$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "${API_BASE}/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_REF}" || true)
              REF_RESOLVED_SHA=$(printf '%s' "$COMMIT_JSON" | jq -r '.sha // empty' 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
              if [[ ! "$REF_RESOLVED_SHA" =~ ^[a-f0-9]{40}$ ]]; then
                echo "::error::Failed to resolve release_ref '${RELEASE_REF}' to a 40-character commit SHA in ${GITHUB_REPOSITORY}."
                exit 1
              fi
            fi

            if [ -n "${EFFECTIVE_IMAGE_DIGEST:-}" ]; then
              if [[ ! "$EFFECTIVE_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "::error::Invalid image_digest '${EFFECTIVE_IMAGE_DIGEST}'. Must match ^sha256:[a-f0-9]{64}$."
                exit 1
              fi
              if [ -z "${GH_TOKEN:-}" ] || [ -z "${GITHUB_REPOSITORY:-}" ]; then
                echo "::error::Missing GITHUB_TOKEN or GITHUB_REPOSITORY required to inspect build provenance for '${EFFECTIVE_IMAGE_DIGEST}'."
                exit 1
              fi
              REPO_LOWER=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
              IMAGE_URI="ghcr.io/${REPO_LOWER}@${EFFECTIVE_IMAGE_DIGEST}"

              if command -v docker >/dev/null 2>&1 && [ -n "${GITHUB_ACTOR_LOGIN:-}" ]; then
                printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR_LOGIN" --password-stdin >/dev/null 2>&1 || true
              fi

              echo "Verifying OIDC provenance attestation to resolve source commit SHA for oci://${IMAGE_URI}..."

              if ! ATTESTATION_JSON=$(gh attestation verify "oci://${IMAGE_URI}" \
                --owner "$REPO_OWNER" \
                --signer-workflow "$SIGNER_WORKFLOW" \
                --format json); then
                echo "::error::OIDC build provenance verification failed for oci://${IMAGE_URI} (expected owner '${REPO_OWNER}' and signer workflow '${SIGNER_WORKFLOW}'). Release aborted."
                exit 1
              fi

              INDEX_REVISION=""
              if command -v docker >/dev/null 2>&1 && [ -n "${GITHUB_ACTOR_LOGIN:-}" ]; then
                RAW_INDEX_JSON=$(docker buildx imagetools inspect --raw "$IMAGE_URI" 2>/dev/null || true)
                if [[ "${RAW_INDEX_JSON#"${RAW_INDEX_JSON%%[![:space:]]*}"}" == \{* ]]; then
                  INDEX_REVISION=$(printf '%s' "$RAW_INDEX_JSON" | jq -r '
                    (
                      .annotations["org.opencontainers.image.revision"]
                      // .config.Labels["org.opencontainers.image.revision"]
                      // ([.manifests[]?.annotations["org.opencontainers.image.revision"] | select(type == "string" and test("^[a-fA-F0-9]{40}$"))][0])
                      // empty
                    )
                  ' 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
                fi
                if [[ ! "$INDEX_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
                  INDEX_REVISION=""
                fi
              fi

              SLSA_INPUT_REVISION=$(printf '%s' "$ATTESTATION_JSON" | jq -r '
                [
                  (if type == "array" then .[] else . end)
                  | (.verificationResult.statement.predicate // .statement.predicate // .predicate // empty)
                  | .buildDefinition.externalParameters.inputs.commit_sha
                  | select(type == "string" and test("^[a-fA-F0-9]{40}$"))
                ][0] // empty
              ' 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
              if [[ ! "$SLSA_INPUT_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
                SLSA_INPUT_REVISION=""
              fi

              if [ -n "$INDEX_REVISION" ] && [ -n "$SLSA_INPUT_REVISION" ] && [ "$INDEX_REVISION" != "$SLSA_INPUT_REVISION" ]; then
                echo "::error::Attested OCI index revision '${INDEX_REVISION}' conflicts with SLSA input commit_sha '${SLSA_INPUT_REVISION}' for '${IMAGE_URI}'. Release aborted."
                exit 1
              fi

              SLSA_REVISION=$(printf '%s' "$ATTESTATION_JSON" | jq -r '
                [
                  (if type == "array" then .[] else . end)
                  | (
                      ((.verificationResult.statement.predicate // .statement.predicate // .predicate // empty) | (
                        .buildDefinition.externalParameters.inputs.commit_sha,
                        (.buildDefinition.resolvedDependencies[]? | (.digest.gitCommit, .digest.sha1)),
                        .buildDefinition.internalParameters.github.sha,
                        .invocation.configSource.digest.sha1,
                        (.materials[]? | (.digest.gitCommit, .digest.sha1))
                      )),
                      .verificationResult.signature.certificate.sourceRepositoryDigest,
                      .verificationResult.statement.subject[]?.annotations["org.opencontainers.image.revision"],
                      .statement.subject[]?.annotations["org.opencontainers.image.revision"]
                    )
                  | select(type == "string" and test("^[a-fA-F0-9]{40}$"))
                ][0] // empty
              ' 2>/dev/null | tr '[:upper:]' '[:lower:]' || true)
              if [[ ! "$SLSA_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
                SLSA_REVISION=""
              fi

              ATTESTED_SHA="${INDEX_REVISION:-${SLSA_REVISION}}"
              if [[ ! "$ATTESTED_SHA" =~ ^[a-f0-9]{40}$ ]] && [ -z "$COMMIT_INPUT_SHA" ]; then
                echo "::error::Failed to extract 40-character source commit SHA from OIDC provenance attestation or OCI revision metadata for oci://${IMAGE_URI}."
                exit 1
              fi
            fi

            if [ -n "$COMMIT_INPUT_SHA" ] && [ -n "$ATTESTED_SHA" ] && [ "$COMMIT_INPUT_SHA" != "$ATTESTED_SHA" ]; then
              echo "::error::Commit mismatch: provided commit_sha '${INPUT_COMMIT_SHA}' does not match attested provenance commit SHA '${ATTESTED_SHA}' for ${EFFECTIVE_IMAGE_DIGEST}."
              exit 1
            fi
            if [ -n "$COMMIT_INPUT_SHA" ] && [ -n "$IMAGE_TAG_SHA" ] && [ "$COMMIT_INPUT_SHA" != "$IMAGE_TAG_SHA" ]; then
              echo "::error::Commit mismatch: provided commit_sha '${INPUT_COMMIT_SHA}' does not match image_tag '${INPUT_IMAGE_TAG}' (${IMAGE_TAG_SHA})."
              exit 1
            fi
            if [ -n "$COMMIT_INPUT_SHA" ] && [ -n "$REF_RESOLVED_SHA" ] && [ "$COMMIT_INPUT_SHA" != "$REF_RESOLVED_SHA" ]; then
              echo "::error::Commit mismatch: provided commit_sha '${INPUT_COMMIT_SHA}' does not match release_ref '${RELEASE_REF}' (${REF_RESOLVED_SHA})."
              exit 1
            fi
            if [ -n "$IMAGE_TAG_SHA" ] && [ -n "$REF_RESOLVED_SHA" ] && [ "$IMAGE_TAG_SHA" != "$REF_RESOLVED_SHA" ]; then
              echo "::error::Commit mismatch: image_tag '${INPUT_IMAGE_TAG}' resolved to ${IMAGE_TAG_SHA}, whereas release_ref '${RELEASE_REF}' resolved to ${REF_RESOLVED_SHA}."
              exit 1
            fi
            if [ -n "$IMAGE_TAG_SHA" ] && [ -n "$ATTESTED_SHA" ] && [ "$IMAGE_TAG_SHA" != "$ATTESTED_SHA" ]; then
              echo "::error::Commit mismatch: image_tag '${INPUT_IMAGE_TAG}' resolved to ${IMAGE_TAG_SHA}, whereas image_digest '${EFFECTIVE_IMAGE_DIGEST}' provenance attested ${ATTESTED_SHA}."
              exit 1
            fi
            if [ -n "$REF_RESOLVED_SHA" ] && [ -n "$ATTESTED_SHA" ] && [ "$REF_RESOLVED_SHA" != "$ATTESTED_SHA" ]; then
              echo "::error::Commit mismatch: release_ref '${RELEASE_REF}' resolved to ${REF_RESOLVED_SHA}, whereas image_digest '${EFFECTIVE_IMAGE_DIGEST}' provenance attested ${ATTESTED_SHA}."
              exit 1
            fi

            if [ -n "$ATTESTED_SHA" ]; then
              TARGET_SHA="$ATTESTED_SHA"
            elif [ -n "$IMAGE_TAG_SHA" ]; then
              TARGET_SHA="$IMAGE_TAG_SHA"
            elif [ -n "$REF_RESOLVED_SHA" ]; then
              TARGET_SHA="$REF_RESOLVED_SHA"
            elif [ -n "$COMMIT_INPUT_SHA" ]; then
              TARGET_SHA="$COMMIT_INPUT_SHA"
            else
              TARGET_SHA="$CURRENT_SHA"
            fi
          fi

          if [[ ! "$TARGET_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Resolved target SHA '${TARGET_SHA}' is not a valid 40-character commit SHA."
            exit 1
          fi

          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved release target commit SHA: ${TARGET_SHA} (event: ${EVENT_NAME})"

      - name: Verify Successful CI Run for Commit
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        timeout-minutes: 3
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.resolve-sha.outputs.target_sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const normalizedTargetSha = (targetSha || '').toLowerCase();
            const fullRepo = `${context.repo.owner}/${context.repo.repo}`;
            const normalizedFullRepo = fullRepo.toLowerCase();
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: targetSha,
                status: 'completed',
                per_page: 100,
              }
            );

            const successfulRun = runs.find(
              (run) =>
                run.conclusion === 'success' &&
                (run.head_sha || '').toLowerCase() === normalizedTargetSha &&
                (!run.head_repository || (run.head_repository.full_name || '').toLowerCase() === normalizedFullRepo)
            );

            if (!successfulRun) {
              core.setFailed(
                `No completed successful CI workflow run found for commit ${targetSha} in ${fullRepo}. Release aborted.`
              );
              return;
            }

            core.info(
              `Verified successful CI run #${successfulRun.run_number} (ID: ${successfulRun.id}) for commit ${targetSha}.`
            );

      - name: Write CI Gate Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ steps.resolve-sha.outputs.target_sha }}
        run: |
          echo "### 🟢 Pre-Release CI Verification Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger Event:** \`${EVENT_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Commit SHA:** \`${TARGET_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CI Status:** \`VERIFIED\`" >> "$GITHUB_STEP_SUMMARY"

  schema-compatibility:
    name: Verify Schema Compatibility
    needs: [ci-gate]
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      compatibility_status: ${{ steps.lint.outputs.compatibility_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Align Workspace to Verified Commit SHA
        if: github.event_name == 'workflow_run' || inputs.image_tag != '' || inputs.release_ref != '' || inputs.image_digest != '' || needs.ci-gate.outputs.target_sha != github.sha
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_REF: ${{ inputs.release_ref }}
          INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
          TARGET_SHA: ${{ needs.ci-gate.outputs.target_sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Target commit '${TARGET_SHA}' is not a valid 40-character hexadecimal commit SHA."
            exit 1
          fi

          GIT_AUTH_ARGS=()
          ORIGIN_URL=$(git remote get-url origin 2>/dev/null || true)
          EFFECTIVE_GIT_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -n "$EFFECTIVE_GIT_TOKEN" ] && [[ "$ORIGIN_URL" =~ ^https?://[^/]+ ]]; then
            ORIGIN_SERVER="${BASH_REMATCH[0]}"
            BASIC_TOKEN=$(printf 'x-access-token:%s' "$EFFECTIVE_GIT_TOKEN" | base64 | tr -d '\r\n')
            GIT_AUTH_ARGS=(-c "http.${ORIGIN_SERVER}/.extraheader=AUTHORIZATION: basic ${BASIC_TOKEN}")
          fi

          if [ "$EVENT_NAME" = "workflow_run" ] || { [ -n "${INPUT_IMAGE_TAG:-}" ] && [ -z "${INPUT_IMAGE_DIGEST:-}" ] && [ -z "${RELEASE_REF:-}" ]; }; then
            if ! git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
              echo "::error::Target commit ${TARGET_SHA} is not an ancestor of ${GITHUB_REF}."
              exit 1
            fi
          elif [ -n "${RELEASE_REF:-}" ] && [ -z "${INPUT_IMAGE_DIGEST:-}" ]; then
            if ! git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
              git "${GIT_AUTH_ARGS[@]}" fetch --no-tags origin "+refs/tags/v*:refs/tags/v*" 2>/dev/null || true
              MATCHING_TAG=$(git tag --list 'v*' --points-at "$TARGET_SHA" | head -n 1 || true)
              if [ -z "$MATCHING_TAG" ]; then
                echo "::error::Target commit ${TARGET_SHA} is neither an ancestor of ${GITHUB_REF} nor pointed to by a v* release tag."
                exit 1
              fi
            fi
            if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
              git "${GIT_AUTH_ARGS[@]}" fetch --no-tags origin "$TARGET_SHA" --depth=2 || true
            fi
          else
            if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
              git "${GIT_AUTH_ARGS[@]}" fetch --no-tags origin "$TARGET_SHA" --depth=2 || true
            fi
            if ! git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
              echo "::error::Signed source revision ${TARGET_SHA} does not exist in repository ${GITHUB_REPOSITORY}."
              exit 1
            fi
          fi

          git checkout --detach "$TARGET_SHA"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Run Schema Compatibility Linter
        id: lint
        run: |
          echo "Executing pre-deployment schema compatibility verification..."
          npm run lint:migrations
          echo "compatibility_status=compatible" >> $GITHUB_OUTPUT
          echo "### 🟢 Pre-Deployment Schema Compatibility Gate" >> $GITHUB_STEP_SUMMARY
          echo "- **Linter Check:** \`PASSED\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** \`COMPATIBLE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **N-1 Container Compatibility:** \`VERIFIED\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate Pre-Flight Schema Migration & SQL DDL Summary
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          echo "Generating pre-flight schema migration and SQL DDL summary for release review..."
          if [[ "${BEFORE_SHA:-}" =~ ^[a-fA-F0-9]{40}$ ]] && [[ ! "${BEFORE_SHA}" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            node --experimental-strip-types scripts/preflight-migration-summary.ts --offline --base-ref "$BEFORE_SHA"
          else
            node --experimental-strip-types scripts/preflight-migration-summary.ts --offline
          fi

  publish-artifact:
    name: Publish Release Artifact
    needs: [ci-gate]
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      (
        (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
        inputs.image_digest == '' &&
        inputs.image_tag == '' &&
        inputs.release_ref == ''
      )
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-artifact.yml
    with:
      commit_sha: ${{ needs.ci-gate.outputs.target_sha }}
      tag_name: ${{ needs.ci-gate.outputs.target_sha }}
    secrets: inherit

  # ============================================================================
  # STAGING ENVIRONMENT PIPELINE (Automated after CI succeeds on main push)
  # ============================================================================
  staging:
    name: Staging Deployment Stage
    permissions:
      actions: read
      contents: read
      packages: read
      attestations: read
      deployments: write
      id-token: write
    needs: [ci-gate, publish-artifact, schema-compatibility]
    if: |
      !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          (inputs.environment == 'all' || inputs.environment == 'staging' || inputs.environment == '')
        )
      ) &&
      (needs.ci-gate.result == 'success') &&
      (needs.schema-compatibility.result == 'success') &&
      (needs.publish-artifact.result == 'success' || ((inputs.image_digest != '' || inputs.image_tag != '' || inputs.release_ref != '') && needs.publish-artifact.result == 'skipped'))
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: 'staging'
      commit_sha: ${{ needs.ci-gate.outputs.target_sha }}
      image_digest: ${{ inputs.image_digest || needs.publish-artifact.outputs.image_digest }}
      image_tag: ${{ inputs.image_tag || needs.publish-artifact.outputs.image_tag || needs.ci-gate.outputs.target_sha }}
      previous_tag: ${{ inputs.previous_tag || '' }}
      provider: ${{ inputs.provider || 'google-cloud-run' }}
      cloud_run_service: ${{ inputs.cloud_run_service || '' }}
      cloud_run_region: ${{ inputs.cloud_run_region || '' }}
      rollback_environment: ${{ (github.event_name == 'workflow_call' && inputs.rollback_environment) || vars.STAGING_ROLLBACK_ENVIRONMENT || '' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

  # ============================================================================
  # PRODUCTION ENVIRONMENT PIPELINE (Mandatory Reviewer Gate & Promotion)
  # ============================================================================
  production:
    name: Production Deployment Stage
    permissions:
      actions: read
      contents: read
      packages: read
      attestations: read
      deployments: write
      id-token: write
    needs: [ci-gate, publish-artifact, schema-compatibility, staging]
    if: |
      !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          (inputs.environment == 'all' || inputs.environment == 'production' || inputs.environment == '')
        )
      ) &&
      (needs.ci-gate.result == 'success') &&
      (needs.schema-compatibility.result == 'success') &&
      (needs.publish-artifact.result == 'success' || ((inputs.image_digest != '' || inputs.image_tag != '' || inputs.release_ref != '') && needs.publish-artifact.result == 'skipped')) &&
      (inputs.environment == 'production' || needs.staging.result == 'success')
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: 'production'
      commit_sha: ${{ needs.ci-gate.outputs.target_sha }}
      image_digest: ${{ inputs.image_digest || needs.publish-artifact.outputs.image_digest }}
      image_tag: ${{ inputs.image_tag || needs.publish-artifact.outputs.image_tag || needs.ci-gate.outputs.target_sha }}
      previous_tag: ${{ inputs.previous_tag || '' }}
      provider: ${{ inputs.provider || 'google-cloud-run' }}
      cloud_run_service: ${{ inputs.cloud_run_service || '' }}
      cloud_run_region: ${{ inputs.cloud_run_region || '' }}
      rollback_environment: ${{ (github.event_name == 'workflow_call' && inputs.rollback_environment) || vars.PRODUCTION_ROLLBACK_ENVIRONMENT || '' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
