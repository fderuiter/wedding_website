name: Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Verify mandatory secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "ERROR: Missing mandatory configuration secret: DATABASE_URL."
            exit 1
          fi
          if [[ ! "${{ secrets.DATABASE_URL }}" =~ ^postgres(ql)?:// ]]; then
            echo "ERROR: Invalid format for DATABASE_URL. Must start with postgres:// or postgresql://"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start local test database and application container
        timeout-minutes: 2
        run: |
          docker compose up --build -d app

      - name: Wait for application to be ready
        timeout-minutes: 2
        run: |
          echo "Waiting for application to boot on port 3000..."
          timeout 120 bash -c 'until curl -s http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "Application is responsive!"

      - name: Seed local database
        timeout-minutes: 1
        env:
          DATABASE_URL: postgresql://wedding:wedding123@localhost:5432/wedding
        run: |
          npm run db:seed

      - name: Install Playwright Browsers
        timeout-minutes: 2
        run: npx playwright install --with-deps

      - name: Run Playwright smoke tests against container
        timeout-minutes: 3
        env:
          TEST_CONTAINER: "true"
        run: npx playwright test

      - name: Print container logs on failure
        if: failure()
        run: |
          echo "=== App Container Logs ==="
          docker compose logs app || true
          echo "=== DB Container Logs ==="
          docker compose logs db || true

      - name: Clean up containers
        if: always()
        run: docker compose down -v || true

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Verify external registry secrets
        id: registry_check
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "ERROR: Missing external registry credentials (DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN). Falling back to local-only build with default tag."
            echo "push=false" >> $GITHUB_OUTPUT
            echo "tags=my-app:latest" >> $GITHUB_OUTPUT
          else
            echo "push=true" >> $GITHUB_OUTPUT
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: steps.registry_check.outputs.push == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.registry_check.outputs.push == 'true' }}
          tags: ${{ steps.registry_check.outputs.tags }}
