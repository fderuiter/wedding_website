name: Release Pipeline

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment (all: staging then production gate, staging, production)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - staging
          - production
      image_digest:
        description: 'Optional immutable OCI image digest (sha256:<64-hex>) to pin for manual deployment'
        required: false
        type: string
      previous_tag:
        description: 'Optional immutable container image tag override to restore on failure (defaults to active pre-deploy tag)'
        required: false
        default: ''
        type: string
      provider:
        description: 'Hosting Provider Adapter'
        required: false
        default: 'google-cloud-run'
        type: string
      rollback_environment:
        description: 'Optional unguarded GitHub Environment holding rollback secrets'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      environment:
        description: 'Target Deployment Environment (all, staging, production)'
        required: false
        default: 'all'
        type: string
      image_digest:
        description: 'Optional immutable OCI image digest (sha256:<64-hex>) to pin for manual deployment'
        required: false
        type: string
      previous_tag:
        description: 'Optional immutable container image tag override to restore on failure (defaults to active pre-deploy tag)'
        required: false
        default: ''
        type: string
      provider:
        description: 'Hosting Provider Adapter'
        required: false
        default: 'google-cloud-run'
        type: string
      rollback_environment:
        description: 'Optional unguarded GitHub Environment holding rollback secrets'
        required: false
        default: ''
        type: string
    outputs:
      schema_compatibility_status:
        description: 'Schema compatibility check status'
        value: ${{ jobs.schema-compatibility.outputs.compatibility_status }}

concurrency:
  group: deploy-${{ inputs.environment || 'pipeline' }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Verify CI Status & Resolve Release SHA
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      target_sha: ${{ steps.resolve-sha.outputs.target_sha }}
    steps:
      - name: Resolve Target Commit SHA
        id: resolve-sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TARGET_SHA="$WORKFLOW_RUN_HEAD_SHA"
          else
            TARGET_SHA="$CURRENT_SHA"
          fi

          if [[ ! "$TARGET_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Resolved target SHA '${TARGET_SHA}' is not a valid 40-character commit SHA."
            exit 1
          fi

          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved release target commit SHA: ${TARGET_SHA} (event: ${EVENT_NAME})"

      - name: Verify Successful CI Run for Commit
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_SHA: ${{ steps.resolve-sha.outputs.target_sha }}
        with:
          script: |
            const targetSha = process.env.TARGET_SHA;
            const fullRepo = `${context.repo.owner}/${context.repo.repo}`;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: targetSha,
                status: 'completed',
                per_page: 100,
              }
            );

            const successfulRun = runs.find(
              (run) =>
                run.conclusion === 'success' &&
                run.head_sha === targetSha &&
                (!run.head_repository || run.head_repository.full_name === fullRepo)
            );

            if (!successfulRun) {
              core.setFailed(
                `No completed successful CI workflow run found for commit ${targetSha} in ${fullRepo}. Release aborted.`
              );
              return;
            }

            core.info(
              `Verified successful CI run #${successfulRun.run_number} (ID: ${successfulRun.id}) for commit ${targetSha}.`
            );

      - name: Write CI Gate Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ steps.resolve-sha.outputs.target_sha }}
        run: |
          echo "### 🟢 Pre-Release CI Verification Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger Event:** \`${EVENT_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target Commit SHA:** \`${TARGET_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CI Status:** \`VERIFIED\`" >> "$GITHUB_STEP_SUMMARY"

  schema-compatibility:
    name: Verify Schema Compatibility
    needs: [ci-gate]
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    outputs:
      compatibility_status: ${{ steps.lint.outputs.compatibility_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Align Workspace to Verified Commit SHA
        if: github.event_name == 'workflow_run'
        env:
          TARGET_SHA: ${{ needs.ci-gate.outputs.target_sha }}
        run: |
          if ! git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
            echo "::error::Target commit ${TARGET_SHA} is not an ancestor of ${GITHUB_REF}."
            exit 1
          fi
          git checkout --detach "$TARGET_SHA"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Schema Compatibility Linter
        id: lint
        run: |
          echo "Executing pre-deployment schema compatibility verification..."
          npm run lint:migrations
          echo "compatibility_status=compatible" >> $GITHUB_OUTPUT
          echo "### 🟢 Pre-Deployment Schema Compatibility Gate" >> $GITHUB_STEP_SUMMARY
          echo "- **Linter Check:** \`PASSED\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** \`COMPATIBLE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **N-1 Container Compatibility:** \`VERIFIED\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate Pre-Flight Schema Migration & SQL DDL Summary
        run: |
          echo "Generating pre-flight schema migration and SQL DDL summary for release review..."
          npx tsx scripts/preflight-migration-summary.ts

  publish-artifact:
    name: Publish Release Artifact
    needs: [ci-gate]
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) ||
      (
        (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
        inputs.image_digest == ''
      )
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-artifact.yml
    with:
      commit_sha: ${{ needs.ci-gate.outputs.target_sha }}
      tag_name: ${{ needs.ci-gate.outputs.target_sha }}
    secrets: inherit

  # ============================================================================
  # STAGING ENVIRONMENT PIPELINE (Automated after CI succeeds on main push)
  # ============================================================================
  staging-database-migration:
    name: Staging Database Migration
    needs: [ci-gate, publish-artifact, schema-compatibility]
    if: |
      !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          (inputs.environment == 'all' || inputs.environment == 'staging' || inputs.environment == '')
        )
      ) &&
      (needs.ci-gate.result == 'success') &&
      (needs.schema-compatibility.result == 'success') &&
      (needs.publish-artifact.result == 'success' || (inputs.image_digest != '' && needs.publish-artifact.result == 'skipped'))
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: 'staging'
      commit_sha: ${{ needs.ci-gate.outputs.target_sha }}
    secrets: inherit

  staging-deploy-provider:
    name: Staging Provider Deployment
    permissions:
      contents: read
      packages: read
      attestations: read
    needs: [ci-gate, publish-artifact, staging-database-migration]
    if: |
      !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          (inputs.environment == 'all' || inputs.environment == 'staging' || inputs.environment == '')
        )
      ) &&
      (needs.ci-gate.result == 'success') &&
      (needs.staging-database-migration.result == 'success') &&
      (needs.publish-artifact.result == 'success' || (inputs.image_digest != '' && needs.publish-artifact.result == 'skipped'))
    uses: ./.github/workflows/deploy-provider.yml
    with:
      environment: 'staging'
      image_digest: ${{ inputs.image_digest || needs.publish-artifact.outputs.image_digest }}
      image_tag: ${{ needs.publish-artifact.outputs.image_tag || needs.ci-gate.outputs.target_sha }}
      provider: ${{ inputs.provider || 'google-cloud-run' }}
    secrets: inherit

  staging-verify-deployment:
    name: Staging Post-Deployment Health Verification
    needs: [ci-gate, publish-artifact, staging-deploy-provider]
    if: |
      !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          (inputs.environment == 'all' || inputs.environment == 'staging' || inputs.environment == '')
        )
      ) &&
      (needs.ci-gate.result == 'success') &&
      (needs.staging-deploy-provider.result == 'success')
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      health_status: ${{ steps.health-probe.outputs.health_status }}
    steps:
      - name: Execute Staging Health Probe Verification
        id: health-probe
        env:
          VAR_SERVICE_URL: ${{ vars.SERVICE_URL }}
          SERVICE_URL: ${{ needs.staging-deploy-provider.outputs.service_url }}
          SECRET_SERVICE_URL: ${{ secrets.SERVICE_URL }}
          IS_DRY_RUN: ${{ needs.staging-deploy-provider.outputs.is_dry_run }}
        run: |
          RESOLVED_URL="${VAR_SERVICE_URL:-}"
          if [ -z "$RESOLVED_URL" ] && [ -n "${SERVICE_URL:-}" ] && [ "$SERVICE_URL" != "***" ]; then
            RESOLVED_URL="$SERVICE_URL"
          fi
          if [ -z "$RESOLVED_URL" ]; then
            RESOLVED_URL="${SECRET_SERVICE_URL:-}"
          fi

          if [ "${IS_DRY_RUN:-false}" = "true" ]; then
            TARGET_URL="${RESOLVED_URL:-http://127.0.0.1:3000}"
          else
            TARGET_URL="$RESOLVED_URL"
          fi
          TARGET_URL="${TARGET_URL%/}"

          if [ -z "$TARGET_URL" ] || [[ ! "$TARGET_URL" =~ ^https?://[^[:space:]]+ ]]; then
            echo "::error::Missing or invalid SERVICE_URL for staging health verification. Configure vars.SERVICE_URL (recommended) or legacy secrets.SERVICE_URL with a valid http:// or https:// URL in the 'staging' GitHub Environment."
            echo "health_status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "### 🔴 Staging Post-Deployment Health Verification Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Environment:** \`staging\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Target Service URL:** \`${TARGET_URL:-unconfigured}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Health Endpoint:** \`/api/health\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **HTTP Status:** \`invalid-url\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Verification Outcome:** \`UNHEALTHY\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          HEALTH_ENDPOINT="${TARGET_URL}/api/health"

          echo "=================================================="
          echo "     STAGING HEALTH CHECK VERIFICATION PROBE      "
          echo "=================================================="
          echo "Target Service URL : ${TARGET_URL}"
          echo "Health Probe Path  : ${HEALTH_ENDPOINT}"
          echo "Dry Run Environment: ${IS_DRY_RUN}"
          echo "=================================================="

          MAX_TIMEOUT=120
          START_TIME=$(date +%s)
          DELAY=2
          SUCCESS=false
          HTTP_STATUS=""
          RESPONSE_BODY=""

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            if [ $ELAPSED -ge $MAX_TIMEOUT ]; then
              echo "❌ Health check timed out after ${MAX_TIMEOUT} seconds."
              break
            fi

            echo "Polling ${HEALTH_ENDPOINT} (elapsed: ${ELAPSED}s)..."

            HTTP_RESPONSE=$(curl -s -S -w "\nHTTP_STATUS_CODE:%{http_code}" "${HEALTH_ENDPOINT}" || true)
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS_CODE:" | cut -d':' -f2)
            RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS_CODE:/d')

            if [ "$HTTP_STATUS" = "200" ]; then
              DB_STATUS=$(echo "$RESPONSE_BODY" | grep -o '"database"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4 || true)
              STATUS_VAL=$(echo "$RESPONSE_BODY" | grep -o '"status"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4 || true)

              if [ "$DB_STATUS" = "connected" ] && [ "$STATUS_VAL" = "ok" ]; then
                echo "✅ Staging health check probe succeeded! HTTP ${HTTP_STATUS}, status: ${STATUS_VAL}, database: ${DB_STATUS}"
                SUCCESS=true
                break
              else
                echo "⚠️ Endpoint returned 200 but payload unhealthy. status: '${STATUS_VAL}', database: '${DB_STATUS}'. Retrying in ${DELAY}s..."
              fi
            else
              echo "⚠️ Probe query failed with HTTP status '${HTTP_STATUS:-unreachable}'. Retrying in ${DELAY}s..."
            fi

            if [ "$IS_DRY_RUN" = "true" ] && [ -z "$HTTP_STATUS" -o "$HTTP_STATUS" = "000" ]; then
              if [ $ELAPSED -ge 6 ]; then
                echo "::notice::Dry-run staging environment detected without live endpoint. Dry-run health verification probe validated."
                SUCCESS=true
                HTTP_STATUS="200 (dry-run)"
                RESPONSE_BODY='{"status":"ok","database":"connected","mode":"dry-run"}'
                break
              fi
            fi

            sleep $DELAY
            DELAY=$((DELAY * 2))
            if [ $DELAY -gt 16 ]; then
              DELAY=16
            fi
          done

          if [ "$SUCCESS" = "true" ]; then
            echo "health_status=healthy" >> "$GITHUB_OUTPUT"
            echo "### 🟢 Staging Post-Deployment Health Verification Passed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Environment:** \`staging\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Target Service URL:** \`${TARGET_URL}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Health Endpoint:** \`/api/health\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **HTTP Status:** \`${HTTP_STATUS}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Verification Outcome:** \`HEALTHY\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "health_status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "### 🔴 Staging Post-Deployment Health Verification Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Environment:** \`staging\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Target Service URL:** \`${TARGET_URL}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Health Endpoint:** \`/api/health\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **HTTP Status:** \`${HTTP_STATUS:-unreachable}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Last Response:** \`${RESPONSE_BODY}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Verification Outcome:** \`UNHEALTHY\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  staging-rollback:
    name: Staging Automated Rollback
    permissions:
      contents: read
      packages: read
      attestations: read
    needs: [publish-artifact, staging-deploy-provider, staging-verify-deployment]
    if: failure() && needs.staging-verify-deployment.result == 'failure'
    uses: ./.github/workflows/rollback.yml
    with:
      target_environment: 'staging'
      rollback_environment: ${{ inputs.rollback_environment || vars.STAGING_ROLLBACK_ENVIRONMENT || '' }}
      previous_digest: ${{ inputs.previous_tag == '' && needs.staging-deploy-provider.outputs.previous_image_digest || '' }}
      previous_tag: ${{ (inputs.previous_tag != '' && inputs.previous_tag != 'latest' && inputs.previous_tag) || needs.staging-deploy-provider.outputs.previous_image_tag }}
      provider: ${{ inputs.provider || 'google-cloud-run' }}
      reason: 'Automated staging post-deployment health check failure on /api/health'
    secrets: inherit

  # ============================================================================
  # PRODUCTION ENVIRONMENT PIPELINE (Mandatory Reviewer Gate & Promotion)
  # ============================================================================
  production-database-migration:
    name: Production Database Migration
    needs: [ci-gate, publish-artifact, schema-compatibility, staging-verify-deployment]
    if: |
      !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          (inputs.environment == 'all' || inputs.environment == 'production' || inputs.environment == '')
        )
      ) &&
      (needs.ci-gate.result == 'success') &&
      (needs.schema-compatibility.result == 'success') &&
      (needs.publish-artifact.result == 'success' || (inputs.image_digest != '' && needs.publish-artifact.result == 'skipped')) &&
      (inputs.environment == 'production' || needs.staging-verify-deployment.result == 'success')
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: 'production'
      commit_sha: ${{ needs.ci-gate.outputs.target_sha }}
    secrets: inherit

  production-deploy-provider:
    name: Production Provider Deployment
    permissions:
      contents: read
      packages: read
      attestations: read
    needs: [ci-gate, publish-artifact, staging-verify-deployment, production-database-migration]
    if: |
      !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          (inputs.environment == 'all' || inputs.environment == 'production' || inputs.environment == '')
        )
      ) &&
      (needs.ci-gate.result == 'success') &&
      (needs.publish-artifact.result == 'success' || (inputs.image_digest != '' && needs.publish-artifact.result == 'skipped')) &&
      (needs.production-database-migration.result == 'success') &&
      (inputs.environment == 'production' || needs.staging-verify-deployment.result == 'success')
    uses: ./.github/workflows/deploy-provider.yml
    with:
      environment: 'production'
      image_digest: ${{ inputs.image_digest || needs.publish-artifact.outputs.image_digest }}
      image_tag: ${{ needs.publish-artifact.outputs.image_tag || needs.ci-gate.outputs.target_sha }}
      provider: ${{ inputs.provider || 'google-cloud-run' }}
    secrets: inherit

  production-verify-deployment:
    name: Production Post-Deployment Health Verification
    needs: [ci-gate, publish-artifact, production-deploy-provider]
    if: |
      !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
          (inputs.environment == 'all' || inputs.environment == 'production' || inputs.environment == '')
        )
      ) &&
      (needs.ci-gate.result == 'success') &&
      (needs.production-deploy-provider.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    outputs:
      health_status: ${{ steps.health-probe.outputs.health_status }}
    steps:
      - name: Execute Production Health Probe Verification
        id: health-probe
        env:
          VAR_SERVICE_URL: ${{ vars.SERVICE_URL }}
          SERVICE_URL: ${{ needs.production-deploy-provider.outputs.service_url }}
          SECRET_SERVICE_URL: ${{ secrets.SERVICE_URL }}
          IS_DRY_RUN: ${{ needs.production-deploy-provider.outputs.is_dry_run }}
        run: |
          RESOLVED_URL="${VAR_SERVICE_URL:-}"
          if [ -z "$RESOLVED_URL" ] && [ -n "${SERVICE_URL:-}" ] && [ "$SERVICE_URL" != "***" ]; then
            RESOLVED_URL="$SERVICE_URL"
          fi
          if [ -z "$RESOLVED_URL" ]; then
            RESOLVED_URL="${SECRET_SERVICE_URL:-}"
          fi

          if [ "${IS_DRY_RUN:-false}" = "true" ]; then
            TARGET_URL="${RESOLVED_URL:-http://127.0.0.1:3000}"
          else
            TARGET_URL="$RESOLVED_URL"
          fi
          TARGET_URL="${TARGET_URL%/}"

          if [ -z "$TARGET_URL" ] || [[ ! "$TARGET_URL" =~ ^https?://[^[:space:]]+ ]]; then
            echo "::error::Missing or invalid SERVICE_URL for production health verification. Configure vars.SERVICE_URL (recommended) or legacy secrets.SERVICE_URL with a valid http:// or https:// URL in the 'production' GitHub Environment."
            echo "health_status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "### 🔴 Production Post-Deployment Health Verification Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Environment:** \`production\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Target Service URL:** \`${TARGET_URL:-unconfigured}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Health Endpoint:** \`/api/health\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **HTTP Status:** \`invalid-url\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Verification Outcome:** \`UNHEALTHY\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Action:** Triggering automated rollback pipeline with N-1 schema compatibility verification..." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          HEALTH_ENDPOINT="${TARGET_URL}/api/health"

          echo "=================================================="
          echo "    PRODUCTION HEALTH CHECK VERIFICATION PROBE    "
          echo "=================================================="
          echo "Target Service URL : ${TARGET_URL}"
          echo "Health Probe Path  : ${HEALTH_ENDPOINT}"
          echo "Dry Run Environment: ${IS_DRY_RUN}"
          echo "=================================================="

          MAX_TIMEOUT=120
          START_TIME=$(date +%s)
          DELAY=2
          SUCCESS=false
          HTTP_STATUS=""
          RESPONSE_BODY=""

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            if [ $ELAPSED -ge $MAX_TIMEOUT ]; then
              echo "❌ Health check timed out after ${MAX_TIMEOUT} seconds."
              break
            fi

            echo "Polling ${HEALTH_ENDPOINT} (elapsed: ${ELAPSED}s)..."

            HTTP_RESPONSE=$(curl -s -S -w "\nHTTP_STATUS_CODE:%{http_code}" "${HEALTH_ENDPOINT}" || true)
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS_CODE:" | cut -d':' -f2)
            RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS_CODE:/d')

            if [ "$HTTP_STATUS" = "200" ]; then
              DB_STATUS=$(echo "$RESPONSE_BODY" | grep -o '"database"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4 || true)
              STATUS_VAL=$(echo "$RESPONSE_BODY" | grep -o '"status"[[:space:]]*:[[:space:]]*"[^"]*"' | cut -d'"' -f4 || true)

              if [ "$DB_STATUS" = "connected" ] && [ "$STATUS_VAL" = "ok" ]; then
                echo "✅ Production health check probe succeeded! HTTP ${HTTP_STATUS}, status: ${STATUS_VAL}, database: ${DB_STATUS}"
                SUCCESS=true
                break
              else
                echo "⚠️ Endpoint returned 200 but payload unhealthy. status: '${STATUS_VAL}', database: '${DB_STATUS}'. Retrying in ${DELAY}s..."
              fi
            else
              echo "⚠️ Probe query failed with HTTP status '${HTTP_STATUS:-unreachable}'. Retrying in ${DELAY}s..."
            fi

            if [ "$IS_DRY_RUN" = "true" ] && [ -z "$HTTP_STATUS" -o "$HTTP_STATUS" = "000" ]; then
              if [ $ELAPSED -ge 6 ]; then
                echo "::notice::Dry-run production environment detected without live endpoint. Dry-run health verification probe validated."
                SUCCESS=true
                HTTP_STATUS="200 (dry-run)"
                RESPONSE_BODY='{"status":"ok","database":"connected","mode":"dry-run"}'
                break
              fi
            fi

            sleep $DELAY
            DELAY=$((DELAY * 2))
            if [ $DELAY -gt 16 ]; then
              DELAY=16
            fi
          done

          if [ "$SUCCESS" = "true" ]; then
            echo "health_status=healthy" >> "$GITHUB_OUTPUT"
            echo "### 🟢 Production Post-Deployment Health Verification Passed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Environment:** \`production\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Target Service URL:** \`${TARGET_URL}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Health Endpoint:** \`/api/health\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **HTTP Status:** \`${HTTP_STATUS}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Verification Outcome:** \`HEALTHY\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            echo "health_status=unhealthy" >> "$GITHUB_OUTPUT"
            echo "### 🔴 Production Post-Deployment Health Verification Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Environment:** \`production\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Target Service URL:** \`${TARGET_URL}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Health Endpoint:** \`/api/health\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **HTTP Status:** \`${HTTP_STATUS:-unreachable}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Last Response:** \`${RESPONSE_BODY}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Verification Outcome:** \`UNHEALTHY\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Action:** Triggering automated rollback pipeline with N-1 schema compatibility verification..." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  production-rollback:
    name: Production Automated Rollback
    permissions:
      contents: read
      packages: read
      attestations: read
    needs: [publish-artifact, production-deploy-provider, production-verify-deployment]
    if: failure() && needs.production-verify-deployment.result == 'failure'
    uses: ./.github/workflows/rollback.yml
    with:
      target_environment: 'production'
      rollback_environment: ${{ inputs.rollback_environment || vars.PRODUCTION_ROLLBACK_ENVIRONMENT || '' }}
      previous_digest: ${{ inputs.previous_tag == '' && needs.production-deploy-provider.outputs.previous_image_digest || '' }}
      previous_tag: ${{ (inputs.previous_tag != '' && inputs.previous_tag != 'latest' && inputs.previous_tag) || needs.production-deploy-provider.outputs.previous_image_tag }}
      provider: ${{ inputs.provider || 'google-cloud-run' }}
      reason: 'Automated post-deployment health check failure on /api/health in production'
    secrets: inherit
