# Isolated CI & Automated Container Test Overrides
# Layer on top of docker-compose.yml with .env.ci for disposable smoke/E2E tests:
#   docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml ...

services:
  db:
    environment:
      POSTGRES_USER: ${DB_USER:-wedding}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wedding123}
      POSTGRES_DB: ${DB_NAME:-wedding}

  migration:
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgres://${DB_USER:-wedding}:${DB_PASSWORD:-wedding123}@db:5432/${DB_NAME:-wedding}}
      POSTGRES_URL_NON_POOLING: ${CONTAINER_POSTGRES_URL_NON_POOLING:-}

  app:
    build:
      cache_from:
        - type=gha,scope=${GHA_CACHE_SCOPE:-app-amd64}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgres://${DB_USER:-wedding}:${DB_PASSWORD:-wedding123}@db:5432/${DB_NAME:-wedding}}
      POSTGRES_URL_NON_POOLING: ${CONTAINER_POSTGRES_URL_NON_POOLING:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-scrypt:d2VkZGluZy1lMmUtc2FsdA==:q++ok9TyDBa8bSKUlVR+j/tjiVTGj95CWT5HK8KkpIHzWRnv2t2hAhDz2PkdPUDsMO+ulGpXGCFQAqDKwK7Lxw==}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,*.localhost,app,db,wedding_website-app-1,0.0.0.0}
      GUEST_PASSCODE: ${GUEST_PASSCODE:-playwright-e2e-guest-passcode}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:-playwright-e2e-session-secret-32-chars-min}
      E2E_TEST: ${E2E_TEST:-true}
