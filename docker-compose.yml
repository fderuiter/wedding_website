# Authoritative Runtime Contract: docs/runtime-contract.md

services:
  db:
    image: postgres:15-alpine@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
    environment:
      POSTGRES_USER: ${DB_USER:-wedding}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-wedding}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wedding} -d ${DB_NAME:-wedding}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    image: wedding-website:latest
    build:
      context: .
      cache_from:
        - type=gha,scope=app
      cache_to:
        - type=gha,scope=app,mode=max
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${DB_USER:-wedding}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-wedding}}
      POSTGRES_URL_NON_POOLING: ${POSTGRES_URL_NON_POOLING:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: wedding-website:latest
    build:
      context: .
      cache_from:
        - type=gha,scope=app
      cache_to:
        - type=gha,scope=app,mode=max
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgres://${DB_USER:-wedding}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-wedding}}
      POSTGRES_URL_NON_POOLING: ${POSTGRES_URL_NON_POOLING:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,*.localhost}
      MULTISITE_ENABLED: ${MULTISITE_ENABLED:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      GUEST_PASSCODE: ${GUEST_PASSCODE:?GUEST_PASSCODE is required}
      GUEST_SESSION_SECRET: ${GUEST_SESSION_SECRET:?GUEST_SESSION_SECRET is required}
      HISTORY_VERSION_LIMIT: ${HISTORY_VERSION_LIMIT:-50}
      CRON_SECRET: ${CRON_SECRET:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      E2E_TEST: ${E2E_TEST:-false}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db_data:
  uploads_data:
